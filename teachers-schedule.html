<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حصص الأساتذة | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ux-enhancements.js"></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title"><i class="fas fa-clock"></i> حصص الأساتذة</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <div class="search-section">
                <h3><i class="fas fa-user-tie"></i> اختيار الأستاذ</h3>
                <form class="search-form"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                    <select id="teacher-select">
                        <option value="">-- اختر أستاذ --</option>
                    </select>
                    <button class="btn btn-primary" type="button" id="view-btn"><i class="fas fa-table"></i> ???
                        الجدول</button>
                </form>
            </div>

            <div class="students-results">
                <h3><i class="fas fa-table"></i> جدول الحصص</h3>
                <div id="schedule" class="page-empty-state">
                    <i class="fas fa-calendar-alt"></i>
                    <p>اختر أستاذ لعرض جدول حصصه</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const year = '2025/2026';
        const days = ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const periods = ['08:00-09:00', '09:00-10:00', '10:00-11:00', '11:00-12:00', '14:00-15:00', '15:00-16:00', '16:00-17:00', '17:00-18:00'];

        document.addEventListener('DOMContentLoaded', async () => {
            const teachers = await window.api.teachers.getAll(year) || [];
            const select = document.getElementById('teacher-select');
            teachers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.full_name;
                opt.textContent = t.full_name;
                select.appendChild(opt);
            });
        });

        document.getElementById('view-btn').addEventListener('click', async () => {
            const teacher = document.getElementById('teacher-select').value;
            if (!teacher) {
                showToast('اختر أستاذ أولاً', 'warning');
                return;
            }

            const lessons = await window.api.timetable.getByTeacher(teacher, year) || [];

            let html = `<table class="students-table" style="width: 100%;">
                <thead>
                    <tr>
                        <th>الفترة</th>
                        ${days.map(d => `<th>${d}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>`;

            periods.forEach(period => {
                html += `<tr><td style="font-weight: bold; background: var(--bg-secondary);">${period}</td>`;
                days.forEach(day => {
                    const lesson = lessons.find(l => l.day === day && l.period === period);
                    html += `<td style="padding: 8px;">${lesson ? `<span style="background: var(--primary); color: white; padding: 4px 8px; border-radius: 6px;">${lesson.subject || ''} - ${lesson.class_name || ''}</span>` : '-'}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            document.getElementById('schedule').innerHTML = html;
        });
    </script>
</body>

</html>
