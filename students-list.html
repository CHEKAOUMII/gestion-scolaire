<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوائح التلاميذ | الثانوية التأهيلية ابن سينا</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind-output.css">
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/sidebar.js" defer></script>
    <script src="js/cc-rules.js" defer></script>
    <script src="js/ux-enhancements.js" defer></script>
    </head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle" aria-label="فتح أو إغلاق القائمة الجانبية"><i
                        class="fas fa-bars" aria-hidden="true"></i></button>
                <h2 class="page-title"><i class="fas fa-users" aria-hidden="true"></i> لوائح التلاميذ</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل السمة" aria-label="تبديل السمة"><i
                        class="fas fa-moon" aria-hidden="true"></i></button>
            </div>
        </header>

        <div class="grades-container" style="padding-top: 18px;">
            <!-- Filter Section — gs-form-section style -->
            <div class="gs-form-section">
                <div class="gs-form-header">
                    <i class="fas fa-filter"></i> تصفية التلاميذ
                </div>
                <form id="search-form" class="gs-form-grid" role="search" aria-label="نموذج البحث عن التلاميذ">
                    <div class="gs-form-group" style="grid-column: span 2;">
                        <label for="search-query">البحث</label>
                        <input id="search-query" name="search-query" type="text"
                            placeholder="ابحث بالاسم أو رمز مسار أو تاريخ الازدياد..." autocomplete="off"
                            style="width:100%;padding:10px 14px;border:1px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-main);font-family:var(--font-main);font-size:14px;">
                    </div>
                    <div class="gs-form-group">
                        <label for="search-level">المستوى</label>
                        <select id="search-level" name="search-level" aria-label="المستوى">
                            <option value="">كل المستويات</option>
                        </select>
                    </div>
                    <div class="gs-form-group">
                        <label for="search-class">القسم</label>
                        <select id="search-class" name="search-class" aria-label="القسم">
                            <option value="">كل الأقسام</option>
                        </select>
                    </div>
                    <div class="gs-form-group">
                        <label for="search-gender">الجنس</label>
                        <select id="search-gender" name="search-gender" aria-label="الجنس">
                            <option value="">كل الأجناس</option>
                            <option value="M">ذكر</option>
                            <option value="F">أنثى</option>
                        </select>
                    </div>
                    <div class="gs-form-actions">
                        <button class="btn btn-primary" type="submit"><i class="fas fa-search" aria-hidden="true"></i>
                            بحث</button>
                        <button class="btn btn-success ux-print-preview-btn" type="button" id="print-preview-btn" disabled>
                            <i class="fas fa-eye" aria-hidden="true"></i> معاينة
                        </button>
                    </div>
                </form>
            </div>

            <!-- Results Section — gs-preview-section style -->
            <div class="gs-preview-section">
                <div class="gs-preview-header">
                    <h3 class="gs-preview-title">
                        <i class="fas fa-table-list"></i>
                        لائحة التلاميذ
                        <span id="count-badge" class="gs-count-badge" aria-live="polite">0</span>
                    </h3>
                </div>

                <div class="gs-preview-body">
                    <div class="sl-table-wrapper">
                        <table class="sl-table" id="students-table">
                            <caption class="sr-only">جدول لوائح التلاميذ مرتب حسب القسم والاسم</caption>
                            <thead>
                                <tr>
                                    <th data-sort="index"># <i class="fas fa-sort sort-icon"></i></th>
                                    <th data-sort="massar_code">رمز مسار <i class="fas fa-sort sort-icon"></i></th>
                                    <th data-sort="full_name">الاسم الكامل <i class="fas fa-sort sort-icon"></i></th>
                                    <th data-sort="class_name">القسم <i class="fas fa-sort sort-icon"></i></th>
                                    <th data-sort="gender">الجنس <i class="fas fa-sort sort-icon"></i></th>
                                    <th data-sort="birth_date">تاريخ الازدياد <i class="fas fa-sort sort-icon"></i></th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="students-tbody">
                                <tr>
                                    <td colspan="7">
                                        <div class="sl-loading-state">
                                            <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
                                            <span>جاري تحميل التلاميذ...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div id="pagination" class="sl-pagination" style="display:none;"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Student Modal -->
    <div class="sl-modal-overlay" id="student-modal" aria-hidden="true">
        <div class="sl-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"
            style="max-height:88vh;display:flex;flex-direction:column;overflow:hidden;">
            <div class="sl-modal-header">
                <h3 id="modal-title"><i class="fas fa-user-graduate"></i> بطاقة التلميذ(ة)</h3>
                <button type="button" class="sl-modal-close" id="modal-close" aria-label="إغلاق"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="sl-modal-body" id="modal-body" style="overflow-y:auto;flex:1;"></div>
            <div class="sl-modal-footer">
                <a class="btn btn-primary" id="modal-full-profile-btn" href="#"
                    style="display:none;gap:6px;align-items:center;text-decoration:none;">
                    <i class="fas fa-user-circle"></i> عرض الملف الكامل
                </a>
                <button class="btn btn-secondary" type="button" id="modal-close-btn">إغلاق</button>
            </div>
        </div>
    </div>


    <p id="students-feedback" class="sr-only" aria-live="polite"></p>

    <script src="js/data/ma-education-labels.js"></script>
    <script src="js/pages/students-list.js" defer></script>
</body>

</html>
