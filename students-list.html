<!doctype html>
<html lang="ar" dir="rtl">
    <head>
    <script src="js/theme-boot.js"></script>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>لوائح التلاميذ | الثانوية التأهيلية ابن سينا</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/shared/dom-helpers.js" defer></script>
        <script src="js/shared/auth-session.js" defer></script>
        <script src="js/shared/filter-manager.js" defer></script>
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/cc-rules.js" defer></script>
        <script src="js/print-system.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        <script src="js/shared/gender.js" defer></script>
    </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
    <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" aria-label="فتح أو إغلاق القائمة الجانبية">
                        <i class="fas fa-bars" aria-hidden="true"></i>
                    </button>
                    <h2 class="page-title"><i class="fas fa-users" aria-hidden="true"></i> لوائح التلاميذ</h2>
                </div>
                <div class="header-right">
                    <a
                        class="btn btn-secondary"
                        data-import-shortcut
                        data-import-type="students"
                        data-import-source="students-list"
                        href="settings-imports.html?type=students&amp;source=students-list"
                        title="استيراد التلاميذ — مراجعة قبل الحفظ"
                        aria-label="فتح مركز الاستيراد للتلاميذ"
                    >
                        <i class="fas fa-file-import" aria-hidden="true"></i> استيراد
                    </a>
                    <button class="theme-toggle" id="theme-toggle" title="تبديل السمة" aria-label="تبديل السمة">
                        <i class="fas fa-moon" aria-hidden="true"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container" style="padding-top: 18px">
                <!-- Filter Section — gs-form-section style -->
                <div class="gs-form-section">
                    <div class="gs-form-header"><i class="fas fa-filter"></i> تصفية التلاميذ</div>
                    <form id="search-form" class="gs-form-grid" role="search" aria-label="نموذج البحث عن التلاميذ">
                        <div class="gs-form-group gs-form-group-wide">
                            <label for="search-query">البحث</label>
                            <input
                                id="search-query"
                                name="search-query"
                                type="text"
                                placeholder="ابحث بالاسم أو رمز مسار أو تاريخ الازدياد..."
                                autocomplete="off"
                                style="
                                    width: 100%;
                                    padding: 10px 14px;
                                    border: 1px solid var(--color-accent);
                                    border-radius: var(--radius-sm);
                                    background: var(--color-surface);
                                    color: var(--color-text-main);
                                    font-family: var(--font-main);
                                    font-size: 14px;
                                "
                            />
                        </div>
                        <div class="gs-form-group">
                            <label for="search-level">المستوى</label>
                            <select id="search-level" name="search-level" aria-label="المستوى">
                                <option value="">كل المستويات</option>
                            </select>
                        </div>
                        <div class="gs-form-group">
                            <label for="search-class">القسم</label>
                            <select id="search-class" name="search-class" aria-label="القسم">
                                <option value="">كل الأقسام</option>
                            </select>
                        </div>
                        <div class="gs-form-group">
                            <label for="search-gender">الجنس</label>
                            <select id="search-gender" name="search-gender" aria-label="الجنس">
                                <option value="">كل الأجناس</option>
                                <option value="M">ذكر</option>
                                <option value="F">أنثى</option>
                            </select>
                        </div>
                        <div class="gs-form-actions">
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-search" aria-hidden="true"></i> بحث
                            </button>
                            <button
                                class="btn btn-success ux-print-preview-btn"
                                type="button"
                                id="print-preview-btn"
                                disabled
                            >
                                <i class="fas fa-eye" aria-hidden="true"></i> معاينة
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Results Section — gs-preview-section style -->
                <div class="gs-preview-section">
                    <div class="gs-preview-header">
                        <h3 class="gs-preview-title">
                            <i class="fas fa-table-list"></i>
                            لائحة التلاميذ
                            <span id="count-badge" class="gs-count-badge" aria-live="polite">0</span>
                        </h3>
                    </div>

                    <div class="gs-preview-body">
                        <div class="sl-table-wrapper">
                            <table class="sl-table" id="students-table">
                                <caption class="sr-only">
                                    جدول لوائح التلاميذ مرتب حسب القسم والاسم
                                </caption>
                                <thead>
                                    <tr>
                                        <th data-sort="index" aria-sort="none" scope="col">
                                            <button class="sl-sort-button" type="button">
                                                <span>#</span>
                                                <i class="fas fa-sort sort-icon" aria-hidden="true"></i>
                                            </button>
                                        </th>
                                        <th data-sort="massar_code" aria-sort="none" scope="col">
                                            <button class="sl-sort-button" type="button">
                                                <span>رمز مسار</span>
                                                <i class="fas fa-sort sort-icon" aria-hidden="true"></i>
                                            </button>
                                        </th>
                                        <th data-sort="full_name" aria-sort="none" scope="col">
                                            <button class="sl-sort-button" type="button">
                                                <span>الاسم الكامل</span>
                                                <i class="fas fa-sort sort-icon" aria-hidden="true"></i>
                                            </button>
                                        </th>
                                        <th data-sort="class_name" aria-sort="none" scope="col">
                                            <button class="sl-sort-button" type="button">
                                                <span>القسم</span>
                                                <i class="fas fa-sort sort-icon" aria-hidden="true"></i>
                                            </button>
                                        </th>
                                        <th data-sort="gender" aria-sort="none" scope="col">
                                            <button class="sl-sort-button" type="button">
                                                <span>الجنس</span>
                                                <i class="fas fa-sort sort-icon" aria-hidden="true"></i>
                                            </button>
                                        </th>
                                        <th data-sort="birth_date" aria-sort="none" scope="col">
                                            <button class="sl-sort-button" type="button">
                                                <span>تاريخ الازدياد</span>
                                                <i class="fas fa-sort sort-icon" aria-hidden="true"></i>
                                            </button>
                                        </th>
                                        <th>الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="students-tbody">
                                    <tr>
                                        <td colspan="7">
                                            <div class="sl-loading-state">
                                                <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
                                                <span>جاري تحميل التلاميذ...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div id="pagination" class="sl-pagination" style="display: none"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Student Modal -->
        <div class="sl-modal-overlay" id="student-modal" aria-hidden="true">
            <div class="sl-modal sl-modal-shell" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <div class="sl-modal-header">
                    <h3 id="modal-title"><i class="fas fa-user-graduate"></i> بطاقة التلميذ(ة)</h3>
                    <button type="button" class="sl-modal-close" id="modal-close" aria-label="إغلاق">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="sl-modal-body sl-modal-body-scroll" id="modal-body"></div>
                <div class="sl-modal-footer">
                    <a
                        class="btn btn-primary"
                        id="modal-full-profile-btn"
                        href="#"
                        style="display: none; gap: 6px; align-items: center; text-decoration: none"
                    >
                        <i class="fas fa-user-circle"></i> عرض الملف الكامل
                    </a>
                    <button class="btn btn-secondary" type="button" id="modal-close-btn">إغلاق</button>
                </div>
            </div>
        </div>

        <p id="students-feedback" class="sr-only" aria-live="polite"></p>

        <script src="js/data/ma-education-labels.js" defer></script>
        <script src="js/shared/orientation-topbar-print.js" defer></script>
        <script src="js/pages/students-list.js" defer></script>
    </body>
</html>
