<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الجدول الزمني للقاعات | برنامج التدبير المدرسي</title>
  <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ux-enhancements.css">
  <script src="js/utils.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/ux-enhancements.js"></script>
  <style>
    /* ==================== Room Stats Cards ==================== */
    .room-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .room-stats-grid.visible {
      opacity: 1;
    }

    .room-stat-card {
      background: #fff;
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
    }

    .room-stat-card .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: white;
    }

    .room-stat-card .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 2px;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }

    .room-stat-card .stat-label {
      font-size: 0.78rem;
      color: #607d8b;
      font-weight: 500;
    }

    .room-stat-card.usage .stat-icon {
      background: #10b981;
    }

    .room-stat-card.usage .stat-value {
      color: #059669;
    }

    .room-stat-card.hours .stat-icon {
      background: #6366f1;
    }

    .room-stat-card.hours .stat-value {
      color: #4f46e5;
    }

    .room-stat-card.teachers .stat-icon {
      background: #f59e0b;
    }

    .room-stat-card.teachers .stat-value {
      color: #d97706;
    }

    .room-stat-card.subjects .stat-icon {
      background: #ec4899;
    }

    .room-stat-card.subjects .stat-value {
      color: #db2777;
    }

    /* ==================== Simple Clean Timetable ==================== */
    .room-timetable-wrapper {
      overflow-x: auto;
      border: 2px solid #333;
    }

    .room-timetable {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      table-layout: fixed;
    }

    /* Header row (time slots) */
    .room-timetable thead th {
      background: #e8e8e8;
      color: #222;
      padding: 6px 4px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.78rem;
      border: 1px solid #999;
    }

    .room-timetable thead th.total-header {
      background: #d0d0d0;
      font-size: 0.85rem;
      font-weight: 800;
    }

    /* Day column */
    .room-timetable tbody td.day-cell {
      background: #e0e0e0;
      color: #111;
      font-weight: 800;
      font-size: 0.9rem;
      min-width: 70px;
      width: 80px;
      text-align: center;
      vertical-align: middle;
      border: 1px solid #999;
    }

    .room-timetable tbody td {
      padding: 2px;
      text-align: center;
      border: 1px solid #999;
      vertical-align: middle;
      min-width: 90px;
      height: auto;
    }

    /* ==================== Subject Cell — Flat & Compact ==================== */
    .subject-cell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      height: 100%;
      min-height: 32px;
      cursor: default;
      overflow: hidden;
    }

    .subject-cell .class-name {
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.2;
      padding: 2px 4px;
      text-align: center;
    }

    .subject-cell .teacher-name {
      font-size: 0.62rem;
      font-weight: 500;
      line-height: 1.2;
      padding: 2px 4px;
      text-align: center;
    }

    .subject-stack {
      display: grid;
      gap: 2px;
    }

    .room-timetable tbody td.has-multiple-lessons {
      vertical-align: top;
    }

    .subject-stack .subject-cell {
      min-height: auto;
      height: auto;
    }

    .empty-cell {
      color: #ccc;
      font-size: 0.9rem;
    }



    /* ==================== Room Select ==================== */
    #room-select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      background: white;
      cursor: pointer;
      min-width: 180px;
    }

    #room-select:focus {
      border-color: #3B6AC5;
      outline: none;
      box-shadow: 0 0 0 2px rgba(59, 106, 197, 0.15);
    }

    /* ==================== Room Info Header (simple) ==================== */
    .room-info-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      background: #f5f5f5;
      border: 1px solid #ccc;
      margin-bottom: 0;
      border-bottom: none;
    }

    .room-info-bar .room-avatar {
      display: none;
    }

    .room-info-bar .room-details h4 {
      margin: 0;
      font-size: 1rem;
      color: #111;
      font-weight: 700;
    }

    .room-info-bar .room-details span {
      font-size: 0.8rem;
      color: #666;
    }

    .room-info-bar .total-hours-badge {
      margin-right: auto;
      background: #3B6AC5;
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .room-info-bar .usage-badge {
      background: #10b981;
      color: white;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ==================== No Data State ==================== */
    .no-data-state {
      text-align: center;
      padding: 60px 30px;
      color: #94a3b8;
    }

    .no-data-state i {
      font-size: 56px;
      display: block;
      margin-bottom: 18px;
      opacity: 0.4;
    }

    .no-data-state h4 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      color: #64748b;
    }

    .no-data-state p {
      font-size: 0.9rem;
    }

    .no-data-state .btn {
      margin-top: 16px;
    }

    /* ==================== Dark Mode ==================== */
    [data-theme="dark"] .room-stat-card {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.08);
    }

    [data-theme="dark"] .room-stat-card .stat-label {
      color: #94a3b8;
    }

    [data-theme="dark"] .room-timetable-wrapper {
      border-color: #555;
    }

    [data-theme="dark"] .room-timetable thead th {
      background: #2d2d2d;
      color: #e0e0e0;
      border-color: #555;
    }

    [data-theme="dark"] .room-timetable tbody td {
      border-color: #444;
      color: #e2e8f0;
      background: #1a1a1a;
    }

    [data-theme="dark"] .room-timetable tbody td.day-cell {
      background: #2d2d2d;
      color: #e0e0e0;
    }

    [data-theme="dark"] #room-select {
      background: #1e293b;
      border-color: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    [data-theme="dark"] .room-info-bar {
      background: #222;
      border-color: #555;
    }

    [data-theme="dark"] .room-info-bar .room-details h4 {
      color: #e2e8f0;
    }

    [data-theme="dark"] .room-info-bar .room-details span {
      color: #94a3b8;
    }

    /* ==================== Print ==================== */
    @page {
      size: A4 landscape;
      margin: 8mm;
    }

    @media print {

      .sidebar,
      .header,
      .search-section,
      .room-stats-grid,
      .toast-container,
      .menu-toggle,
      .theme-toggle,
      #print-preview-btn,
      .no-data-state {
        display: none !important;
      }

      body {
        background: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .main-content {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }

      .grades-container {
        padding: 0 !important;
      }

      .students-results h3 {
        font-size: 12px !important;
        margin: 0 0 6px !important;
      }

      .room-timetable-wrapper {
        border: 1px solid #333;
        overflow: visible !important;
      }

      .room-timetable {
        width: 100% !important;
        table-layout: fixed !important;
        font-size: 8px !important;
        border-collapse: collapse !important;
        page-break-inside: avoid;
      }

      .room-timetable thead th {
        padding: 4px 2px !important;
        font-size: 8px !important;
        position: static !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .room-timetable tbody td {
        padding: 2px 1px !important;
        font-size: 7px !important;
        min-width: 0 !important;
        border: 1px solid #666 !important;
        line-height: 1.2 !important;
        height: auto !important;
      }

      .room-timetable tbody td.day-cell {
        font-size: 8px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .subject-cell {
        padding: 2px 1px !important;
        min-height: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .subject-cell .class-name {
        font-size: 7px !important;
      }

      .subject-cell .teacher-name {
        font-size: 6px !important;
      }

      .subject-cell .subject-name {
        font-size: 5.5px !important;
      }

      .room-info-bar {
        padding: 6px 10px !important;
        margin-bottom: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .room-info-bar .room-details h4 {
        font-size: 11px !important;
      }

      .room-info-bar .room-details span {
        font-size: 8px !important;
      }

      .room-info-bar .total-hours-badge,
      .room-info-bar .usage-badge {
        font-size: 9px !important;
        padding: 3px 8px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .empty-cell {
        font-size: 7px !important;
      }
    }
  </style>
</head>

<body>
  <div class="toast-container" id="toast-container"></div>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
        <h2 class="page-title"><i class="fas fa-door-open"></i> جدول القاعات</h2>
      </div>
      <div class="header-right">
        <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
      </div>
    </header>

    <div class="grades-container">
      <!-- Room Selector -->
      <div class="search-section">
        <h3><i class="fas fa-door-open"></i> اختيار القاعة</h3>
        <form class="search-form" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
          <select id="room-select">
            <option value="">-- ???? ???? --</option>
          </select>
          <span id="room-count-badge" style="font-size: 0.85rem; color: #64748b; font-weight: 500;"></span>
          <button type="button" class="btn btn-success" id="print-preview-btn"
            style="display:none; margin-right: auto;"><i class="fas fa-eye"></i> معاينة الطباعة</button>
        </form>
      </div>

      <!-- Stats Cards -->
      <div class="room-stats-grid" id="room-stats-grid">
        <div class="room-stat-card usage">
          <div class="stat-icon"><i class="fas fa-chart-pie"></i></div>
          <div class="stat-value" id="stat-usage">�</div>
          <div class="stat-label">نسبة الاستغلال</div>
        </div>
        <div class="room-stat-card hours">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-value" id="stat-hours">�</div>
          <div class="stat-label">حصة أسبوعية</div>
        </div>
        <div class="room-stat-card teachers">
          <div class="stat-icon"><i class="fas fa-chalkboard-teacher"></i></div>
          <div class="stat-value" id="stat-teachers">�</div>
          <div class="stat-label">أستاذ (ة)</div>
        </div>
        <div class="room-stat-card subjects">
          <div class="stat-icon"><i class="fas fa-book"></i></div>
          <div class="stat-value" id="stat-subjects">�</div>
          <div class="stat-label">مادة دراسية</div>
        </div>
      </div>

      <!-- Timetable Display -->
      <div class="students-results">
        <h3><i class="fas fa-calendar-alt"></i> جدول استعمال القاعة</h3>
        <div id="schedule">
          <div class="no-data-state">
            <i class="fas fa-door-open"></i>
            <h4>اختر قاعة لعرض جدول استعمالها</h4>
            <p>سيتم عرض الجدول الأسبوعي مع معلومات الأساتذة والمواد</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const days = ['الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    let discoveredMorningHours = [];
    let discoveredAfternoonHours = [];

    const defaultHourLabels = {
      h1: '08:30-09:30', h2: '09:30-10:30', h3: '10:30-11:30', h4: '11:30-12:30',
      h5: '14:30-15:30', h6: '15:30-16:30', h7: '16:30-17:30', h8: '17:30-18:30'
    };

    let timetableData = null;
    let roomsIndex = {};
    let subjectColorMap = {};

    document.addEventListener('DOMContentLoaded', () => {
      loadTimetableData();

      document.getElementById('room-select').addEventListener('change', (e) => {
        if (e.target.value) {
          showRoomSchedule(e.target.value);
        } else {
          hideStats();
          document.getElementById('schedule').innerHTML = `
            <div class="no-data-state">
              <i class="fas fa-door-open"></i>
              <h4>اختر قاعة لعرض جدول استعمالها</h4>
              <p>سيتم عرض الجدول الأسبوعي مع معلومات الأساتذة والمواد</p>
            </div>`;
        }
      });

      document.getElementById('print-preview-btn').addEventListener('click', () => {
        const roomName = document.getElementById('room-select')?.value || '';
        const title = roomName ? `جدول القاعة - ${roomName}` : 'جدول القاعات';
        electronPrint({ mode: 'preview', title, pageSize: 'A4', landscape: true });
      });
    });

    function loadTimetableData() {
      try {
        const raw = localStorage.getItem('timetableData');
        if (!raw) { showNoImportState(); return; }

        timetableData = JSON.parse(raw);
        if (!timetableData || !timetableData.timetables) { showNoImportState(); return; }

        const morningSet = new Set();
        const afternoonSet = new Set();
        roomsIndex = {};

        for (const [teacher, daysData] of Object.entries(timetableData.timetables)) {
          for (const [day, periods] of Object.entries(daysData)) {
            for (const [period, hours] of Object.entries(periods)) {
              for (const [hour, lesson] of Object.entries(hours)) {
                if (period === 'morning') morningSet.add(hour);
                else if (period === 'afternoon') afternoonSet.add(hour);

                const roomName = (lesson.room || '').trim();
                if (!roomName) continue;

                if (!roomsIndex[roomName]) roomsIndex[roomName] = [];
                roomsIndex[roomName].push({
                  teacher: teacher.replace(/_/g, ' '),
                  day,
                  period,
                  hour,
                  subject: lesson.subject || '',
                  students: (lesson.students || '').replace(/:[Gg]\d+$/g, '').trim()
                });
              }
            }
          }
        }

        const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
        discoveredMorningHours = [...morningSet].sort(naturalSort);
        discoveredAfternoonHours = [...afternoonSet].sort(naturalSort);

        const roomNames = Object.keys(roomsIndex).sort((a, b) => a.localeCompare(b, 'ar'));
        populateRoomSelect(roomNames);

        if (roomNames.length > 0) {
          showToast(`تم تحميل ${roomNames.length} قاعة من البيانات المحفوظة`, 'success');
        } else {
          showNoRoomsState();
        }

      } catch (e) {
        console.error('Error loading timetable data:', e);
        showNoImportState();
      }
    }

    function getHourLabel(hourKey) {
      return defaultHourLabels[hourKey] || hourKey;
    }

    function populateRoomSelect(roomNames) {
      const select = document.getElementById('room-select');
      select.innerHTML = '<option value="">-- ???? ???? --</option>';
      roomNames.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      document.getElementById('room-count-badge').innerHTML =
        `<i class="fas fa-info-circle"></i> ${roomNames.length} قاعة متاحة`;
    }

    /* ── Color palettes ── */
    const TEACHER_COLORS = [
      { bg: '#FFCC80', fg: '#4E342E' },
      { bg: '#EF9A9A', fg: '#B71C1C' },
      { bg: '#A5D6A7', fg: '#1B5E20' },
      { bg: '#CE93D8', fg: '#4A148C' },
      { bg: '#80CBC4', fg: '#004D40' },
      { bg: '#FFE082', fg: '#5D4037' },
      { bg: '#90CAF9', fg: '#0D47A1' },
      { bg: '#FFAB91', fg: '#BF360C' },
      { bg: '#B39DDB', fg: '#311B92' },
      { bg: '#C5E1A5', fg: '#33691E' },
      { bg: '#81D4FA', fg: '#01579B' },
      { bg: '#BCAAA4', fg: '#3E2723' },
      { bg: '#FFF59D', fg: '#F57F17' },
      { bg: '#F48FB1', fg: '#880E4F' },
      { bg: '#9FA8DA', fg: '#1A237E' },
    ];

    const SECTION_COLORS = [
      { bg: '#E8F5E9', fg: '#2E7D32' },
      { bg: '#E3F2FD', fg: '#1565C0' },
      { bg: '#FFF3E0', fg: '#E65100' },
      { bg: '#FCE4EC', fg: '#C62828' },
      { bg: '#F3E5F5', fg: '#6A1B9A' },
      { bg: '#E0F7FA', fg: '#00695C' },
      { bg: '#FFF8E1', fg: '#F57F17' },
      { bg: '#E8EAF6', fg: '#283593' },
      { bg: '#F1F8E9', fg: '#33691E' },
      { bg: '#EFEBE9', fg: '#4E342E' },
      { bg: '#E0F2F1', fg: '#004D40' },
      { bg: '#E1F5FE', fg: '#01579B' },
      { bg: '#FBE9E7', fg: '#BF360C' },
      { bg: '#EDE7F6', fg: '#4527A0' },
      { bg: '#F9FBE7', fg: '#827717' },
    ];

    let teacherColorMap = {};
    let sectionColorMap = {};

    function getTeacherColor(teacher) {
      if (!teacherColorMap[teacher]) {
        const idx = Object.keys(teacherColorMap).length % TEACHER_COLORS.length;
        teacherColorMap[teacher] = TEACHER_COLORS[idx];
      }
      return teacherColorMap[teacher];
    }

    function getSectionColor(section) {
      if (!sectionColorMap[section]) {
        const idx = Object.keys(sectionColorMap).length % SECTION_COLORS.length;
        sectionColorMap[section] = SECTION_COLORS[idx];
      }
      return sectionColorMap[section];
    }

    function showRoomSchedule(roomName) {
      const lessons = roomsIndex[roomName] || [];

      // Calculate stats
      const allHours = [...discoveredMorningHours, ...discoveredAfternoonHours];
      const totalSlots = days.length * allHours.length;
      const usedSlots = lessons.length;
      const usagePercent = totalSlots > 0 ? Math.round((usedSlots / totalSlots) * 100) : 0;
      const uniqueTeachers = new Set(lessons.map(l => l.teacher));
      const uniqueSubjects = new Set(lessons.map(l => l.subject));

      // Update stat cards
      document.getElementById('stat-usage').textContent = usagePercent + '%';
      document.getElementById('stat-hours').textContent = usedSlots;
      document.getElementById('stat-teachers').textContent = uniqueTeachers.size;
      document.getElementById('stat-subjects').textContent = uniqueSubjects.size;

      document.getElementById('room-stats-grid').classList.add('visible');

      // Build lookup: day+period+hour -> lessons[]
      const lookup = {};
      lessons.forEach(l => {
        const key = `${l.day}|${l.period}|${l.hour}`;
        if (lookup[key]) {
          lookup[key].push(l);
        } else {
          lookup[key] = [l];
        }
      });

      // Reset color maps for this room
      teacherColorMap = {};
      sectionColorMap = {};

      // All hours in order
      const allHoursOrdered = [];
      discoveredMorningHours.forEach(h => allHoursOrdered.push({ key: h, period: 'morning' }));
      discoveredAfternoonHours.forEach(h => allHoursOrdered.push({ key: h, period: 'afternoon' }));

      const separatorAfter = discoveredMorningHours.length > 0 && discoveredAfternoonHours.length > 0
        ? discoveredMorningHours.length
        : -1;

      // ===================================================================
      // Build the table: Days as ROWS, Time slots as COLUMNS
      // ===================================================================

      let html = `
        <div class="room-info-bar">
          <div class="room-details">
            <h4>جدول حصص :  ${roomName}</h4>
            <span>الموسم الدراسي 2025-2026</span>
          </div>
          <div class="total-hours-badge">
            ${usedSlots} h
          </div>
        </div>
        <div class="room-timetable-wrapper">
        <table class="room-timetable">
          <thead>
            <tr>
              <th class="total-header" style="width:100px;">
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                  <span style="font-size:1.1rem;">${usedSlots} h</span>
                </div>
              </th>`;

      // Time slot headers
      allHoursOrdered.forEach((h, i) => {
        if (separatorAfter > 0 && i === separatorAfter) {
          html += `<th style="width:4px; padding:0; background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));"></th>`;
        }
        html += `<th>${getHourLabel(h.key)}</th>`;
      });

      html += `</tr></thead><tbody>`;

      // Day rows
      days.forEach(day => {
        // Pre-process for consecutive merging
        const dayCells = [];
        allHoursOrdered.forEach((h, i) => {
          dayCells.push({
            hourIdx: i,
            period: h.period,
            hourKey: h.key,
            lessons: lookup[`${day}|${h.period}|${h.key}`] || null,
            skip: false,
            colspan: 1
          });
        });

        // Detect consecutive hours with same subject+teacher for merging (supports 2, 3, 4+ hours)
        for (let i = 0; i < dayCells.length - 1; i++) {
          if (dayCells[i].skip) continue;
          if (separatorAfter > 0 && i === separatorAfter - 1) continue;

          const anchor = dayCells[i];
          if (!anchor.lessons || anchor.lessons.length !== 1) continue;

          let span = 1;
          const mergedSections = [anchor.lessons[0].students || ''];
          for (let j = i + 1; j < dayCells.length; j++) {
            if (separatorAfter > 0 && j === separatorAfter) break;
            const next = dayCells[j];
            if (!next.lessons || next.lessons.length !== 1) break;
            if (next.lessons[0].subject !== anchor.lessons[0].subject ||
              next.lessons[0].teacher !== anchor.lessons[0].teacher ||
              next.period !== anchor.period) break;
            span++;
            mergedSections.push(next.lessons[0].students || '');
            next.skip = true;
          }
          if (span > 1) { anchor.colspan = span; anchor.mergedSections = mergedSections; }
        }

        html += `<tr><td class="day-cell">${day}</td>`;

        dayCells.forEach((cell, i) => {
          if (separatorAfter > 0 && i === separatorAfter) {
            html += `<td style="width:4px; padding:0; background: linear-gradient(180deg, rgba(45,95,74,0.08), transparent); border: none;"></td>`;
          }

          if (cell.skip) return;

          const colspanAttr = cell.colspan > 1 ? ` colspan="${cell.colspan}"` : '';

          if (cell.lessons && cell.lessons.length > 0) {
            const lessonsAtSlot = [...cell.lessons].sort((a, b) => {
              const aKey = `${a.teacher}|${a.subject}|${a.students || ''}`;
              const bKey = `${b.teacher}|${b.subject}|${b.students || ''}`;
              return aKey.localeCompare(bKey, 'ar');
            });

            // Merged cell: sections side-by-side, teacher spanning below
            if (cell.mergedSections && cell.mergedSections.length > 1) {
              const lesson = lessonsAtSlot[0];
              const tc = getTeacherColor(lesson.teacher);
              const uniqueSections = [...new Set(cell.mergedSections)];
              const allSame = uniqueSections.length === 1;
              let sectionsRow = '';
              if (allSame && uniqueSections[0]) {
                const sc = getSectionColor(uniqueSections[0]);
                sectionsRow = `<div class="class-name" style="background:${sc.bg};color:${sc.fg}">${uniqueSections[0]}</div>`;
              } else {
                sectionsRow = `<div style="display:flex">${cell.mergedSections.map(s => {
                  if (!s) return '<span style="flex:1"></span>';
                  const sc = getSectionColor(s);
                  return `<span class="class-name" style="background:${sc.bg};color:${sc.fg};flex:1">${s}</span>`;
                }).join('')}</div>`;
              }
              const cellContent = `<div class="subject-cell">${sectionsRow}<div class="teacher-name" style="background:${tc.bg};color:${tc.fg}">${lesson.teacher} : (${lesson.subject})</div></div>`;
              html += `<td${colspanAttr} class="merged-cell">${cellContent}</td>`;
            } else {
              const cellContent = lessonsAtSlot.map(lesson => {
                const tc = getTeacherColor(lesson.teacher);
                const sc = lesson.students ? getSectionColor(lesson.students) : null;
                return `
                  <div class="subject-cell">
                    ${lesson.students ? `<div class="class-name" style="background:${sc.bg};color:${sc.fg}">${lesson.students}</div>` : ''}
                    <div class="teacher-name" style="background:${tc.bg};color:${tc.fg}">${lesson.teacher} : (${lesson.subject})</div>
                  </div>`;
              }).join('');

              const tdClasses = [];
              if (cell.colspan > 1) tdClasses.push('merged-cell');
              if (lessonsAtSlot.length > 1) tdClasses.push('has-multiple-lessons');
              const classAttr = tdClasses.length > 0 ? ` class="${tdClasses.join(' ')}"` : '';
              html += `<td${colspanAttr}${classAttr}>${lessonsAtSlot.length > 1 ? `<div class="subject-stack">${cellContent}</div>` : cellContent}</td>`;
            }
          } else {
            const classAttr = cell.colspan > 1 ? ' class="merged-cell"' : '';
            html += `<td${colspanAttr}${classAttr}><span class="empty-cell">�</span></td>`;
          }
        });

        html += '</tr>';
      });

      html += '</tbody></table></div>';

      document.getElementById('schedule').innerHTML = html;
      document.getElementById('print-preview-btn').style.display = '';
    }

    function hideStats() {
      document.getElementById('room-stats-grid').classList.remove('visible');
      document.getElementById('print-preview-btn').style.display = 'none';
    }

    function showNoImportState() {
      document.getElementById('room-count-badge').innerHTML =
        '<span style="color: #ef4444;"><i class="fas fa-exclamation-triangle"></i> لا توجد بيانات</span>';
      document.getElementById('schedule').innerHTML = `
        <div class="no-data-state">
          <i class="fas fa-file-import"></i>
          <h4>لم يتم استيراد بيانات استعمال الزمن بعد</h4>
          <p>يرجى استيراد ملف FET من صفحة <strong>استيراد البيانات</strong> أولاً</p>
          <a href="settings-imports.html" class="btn btn-primary" style="display: inline-block;">
            <i class="fas fa-upload"></i> الانتقال لصفحة الاستيراد
          </a>
        </div>`;
    }

    function showNoRoomsState() {
      document.getElementById('room-count-badge').innerHTML =
        '<span style="color: #f59e0b;"><i class="fas fa-info-circle"></i> لا توجد قاعات في البيانات</span>';
      document.getElementById('schedule').innerHTML = `
        <div class="no-data-state">
          <i class="fas fa-door-open"></i>
          <h4>لم يتم العثور على قاعات</h4>
          <p>ملف FET المستورد لا يحتوي على بيانات القاعات</p>
        </div>`;
    }
  </script>
</body>
