<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول حصص الأساتذة | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind-output.css">
  <script src="js/utils.js" defer></script>
    <script src="js/notifications.js" defer></script>
  <script src="js/sidebar.js" defer></script>
  <script src="js/ux-enhancements.js" defer></script>
  </head>

<body>
  <div class="toast-container" id="toast-container"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
        <h2 class="page-title"><i class="fas fa-chalkboard-teacher"></i> جدول حصص الأساتذة</h2>
      </div>
      <div class="header-right">
        <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر" type="button" aria-label="تبديل المظهر"><i class="fas fa-moon" aria-hidden="true"></i></button>
      </div>
    </header>

    <div class="grades-container">
      <!-- Teacher Selector -->
      <div class="search-section">
        <h3><i class="fas fa-chalkboard-teacher"></i> اختيار الأستاذ</h3>
        <form class="search-form" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
          <select id="teacher-select" class="filter-select">
            <option value="">-- اختر أستاذ --</option>
          </select>
          <span id="teacher-count-badge" style="font-size: 0.85rem; color: #64748b; font-weight: 500;"></span>
          <button type="button" class="btn btn-success" id="print-preview-btn"
            style="display:none; margin-right: auto;"><i class="fas fa-print"></i> طباعة الجدول</button>
        </form>
      </div>

      <!-- Stats Cards -->
      <div class="teacher-stats-grid" id="teacher-stats-grid">
        <div class="teacher-stat-card hours">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-value" id="stat-hours">—</div>
          <div class="stat-label">حصة أسبوعية</div>
        </div>
        <div class="teacher-stat-card classes">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="stat-classes">—</div>
          <div class="stat-label">قسم</div>
        </div>
        <div class="teacher-stat-card subjects">
          <div class="stat-icon"><i class="fas fa-book"></i></div>
          <div class="stat-value" id="stat-subjects">—</div>
          <div class="stat-label">مادة دراسية</div>
        </div>
        <div class="teacher-stat-card rooms">
          <div class="stat-icon"><i class="fas fa-door-open"></i></div>
          <div class="stat-value" id="stat-rooms">—</div>
          <div class="stat-label">قاعة</div>
        </div>
      </div>

      <!-- Timetable Display -->
      <div class="students-results">
        <h3><i class="fas fa-calendar-alt"></i> جدول الحصص</h3>
        <div id="schedule">
          <div class="no-data-state">
            <i class="fas fa-chalkboard-teacher"></i>
            <h4>اختر أستاذ لعرض جدول حصصه</h4>
            <p>سيتم عرض الجدول الأسبوعي بشكل مشابه لاستعمال الزمن الرسمي</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Print Header (hidden, shown only in print) -->
  <div class="print-header" id="print-header" style="display:none;">
    <h2 id="print-title"></h2>
    <p id="print-subtitle"></p>
  </div>

  <script>
    const days = ['الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    // Dynamically discovered from FET data
    let discoveredMorningHours = [];
    let discoveredAfternoonHours = [];

    const defaultHourLabels = {
      h1: '08:30-09:30', h2: '09:30-10:30', h3: '10:30-11:30', h4: '11:30-12:30',
      h5: '14:30-15:30', h6: '15:30-16:30', h7: '16:30-17:30', h8: '17:30-18:30'
    };

    let timetableData = null;
    let teachersIndex = {}; // teacherName -> [{day, period, hour, subject, class, room}]
    let subjectColorMap = {};

    document.addEventListener('DOMContentLoaded', () => {
      loadTimetableData();

      document.getElementById('teacher-select').addEventListener('change', (e) => {
        if (e.target.value) {
          showTeacherSchedule(e.target.value);
        } else {
          hideStats();
          document.getElementById('schedule').innerHTML = `
            <div class="no-data-state">
              <i class="fas fa-chalkboard-teacher"></i>
              <h4>اختر أستاذ لعرض جدول حصصه</h4>
              <p>سيتم عرض الجدول الأسبوعي بشكل مشابه لاستعمال الزمن الرسمي</p>
            </div>`;
        }
      });

      document.getElementById('print-preview-btn').addEventListener('click', () => {
        window.print();
      });
    });

    function loadTimetableData() {
      try {
        const raw = localStorage.getItem('timetableData');
        if (!raw) {
          showNoImportState();
          return;
        }

        timetableData = JSON.parse(raw);
        if (!timetableData || !timetableData.timetables) {
          showNoImportState();
          return;
        }

        // Discover hours and build teacher index
        const morningSet = new Set();
        const afternoonSet = new Set();
        teachersIndex = {};

        for (const [teacher, daysData] of Object.entries(timetableData.timetables)) {
          const teacherName = teacher.replace(/_/g, ' ');

          for (const [day, periods] of Object.entries(daysData)) {
            for (const [period, hours] of Object.entries(periods)) {
              for (const [hour, lesson] of Object.entries(hours)) {
                if (period === 'morning') morningSet.add(hour);
                else if (period === 'afternoon') afternoonSet.add(hour);

                if (!teachersIndex[teacherName]) teachersIndex[teacherName] = [];
                teachersIndex[teacherName].push({
                  day,
                  period,
                  hour,
                  subject: lesson.subject || '',
                  className: (lesson.students || '').replace(/_/g, ' '),
                  room: lesson.room || ''
                });
              }
            }
          }
        }

        // Sort hours naturally
        const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
        discoveredMorningHours = [...morningSet].sort(naturalSort);
        discoveredAfternoonHours = [...afternoonSet].sort(naturalSort);

        // Populate teacher select
        const teacherNames = Object.keys(teachersIndex).sort((a, b) => a.localeCompare(b, 'ar'));
        const select = document.getElementById('teacher-select');
        teacherNames.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });

        if (teacherNames.length > 0) {
          document.getElementById('teacher-count-badge').innerHTML =
            `<i class="fas fa-info-circle"></i> ${teacherNames.length} أستاذ(ة) متاح`;
          showToast(`تم تحميل ${teacherNames.length} أستاذ(ة) من البيانات المحفوظة`, 'success');
        } else {
          showNoTeachersState();
        }

      } catch (e) {
        console.error('Error loading timetable data:', e);
        showNoImportState();
      }
    }

    function getHourLabel(hourKey) {
      return defaultHourLabels[hourKey] || hourKey;
    }

    function getSubjectColor(subject) {
      if (!subjectColorMap[subject]) {
        const idx = Object.keys(subjectColorMap).length % 15;
        subjectColorMap[subject] = idx;
      }
      return `subject-color-${subjectColorMap[subject]}`;
    }

    function showTeacherSchedule(teacherName) {
      const lessons = teachersIndex[teacherName] || [];

      // Calculate stats
      const usedSlots = lessons.length;
      const uniqueClasses = new Set(lessons.map(l => l.className).filter(Boolean));
      const uniqueSubjects = new Set(lessons.map(l => l.subject).filter(Boolean));
      const uniqueRooms = new Set(lessons.map(l => l.room).filter(Boolean));

      // Update stat cards
      document.getElementById('stat-hours').textContent = usedSlots;
      document.getElementById('stat-classes').textContent = uniqueClasses.size;
      document.getElementById('stat-subjects').textContent = uniqueSubjects.size;
      document.getElementById('stat-rooms').textContent = uniqueRooms.size;

      // Show stats
      document.getElementById('teacher-stats-grid').classList.add('visible');

      // Build lookup: day+period+hour -> lesson(s)
      const lookup = {};
      lessons.forEach(l => {
        const key = `${l.day}|${l.period}|${l.hour}`;
        if (lookup[key]) {
          lookup[key].push(l);
        } else {
          lookup[key] = [l];
        }
      });

      // Reset subject color map for fresh assignment
      subjectColorMap = {};

      // All hours in order
      const allHoursOrdered = [];
      discoveredMorningHours.forEach(h => allHoursOrdered.push({ key: h, period: 'morning' }));
      discoveredAfternoonHours.forEach(h => allHoursOrdered.push({ key: h, period: 'afternoon' }));

      // Find separator position
      const separatorAfter = discoveredMorningHours.length > 0 && discoveredAfternoonHours.length > 0
        ? discoveredMorningHours.length
        : -1;

      // ==================== Build the table (Days as rows, Time as columns) ====================
      // The layout from the image: time slots are COLUMNS (horizontal), days are ROWS (vertical, on the right)

      let html = `
        <div class="teacher-info-bar">
          <div class="teacher-avatar"><i class="fas fa-user-tie"></i></div>
          <div class="teacher-details">
            <h4>${teacherName}</h4>
            <span>الموسم الدراسي 2025-2026</span>
          </div>
          <div class="total-hours-badge">
            <i class="fas fa-clock"></i>
            ${usedSlots} h
          </div>
        </div>
        <div class="teacher-timetable-wrapper">
        <table class="teacher-timetable">
          <thead>
            <tr>
              <th class="total-header" style="width:100px;">
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                  <span style="font-size:1.1rem;">${usedSlots} h</span>
                </div>
              </th>`;

      // Time slot headers (from right to left as in image since dir=rtl)
      let colIdx = 0;
      allHoursOrdered.forEach((h, i) => {
        // Insert separator column between morning and afternoon
        if (separatorAfter > 0 && i === separatorAfter) {
          html += `<th style="width:4px; padding:0; background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));"></th>`;
        }
        html += `<th>${getHourLabel(h.key)}</th>`;
        colIdx++;
      });

      html += `</tr></thead><tbody>`;

      // Day rows
      days.forEach(day => {
        html += `<tr><td class="day-cell">${day}</td>`;

        allHoursOrdered.forEach((h, i) => {
          // Insert separator column
          if (separatorAfter > 0 && i === separatorAfter) {
            html += `<td style="width:4px; padding:0; background: linear-gradient(180deg, rgba(45,95,74,0.08), transparent); border: none;"></td>`;
          }

          const lessonsAtSlot = lookup[`${day}|${h.period}|${h.key}`];
          if (lessonsAtSlot && lessonsAtSlot.length > 0) {
            const cellContent = lessonsAtSlot.map(lesson => {
              const colorClass = getSubjectColor(lesson.subject);
              return `
                <div class="subject-cell ${colorClass}">
                  <div class="subject-name">${lesson.subject}</div>
                  <div class="class-name">${lesson.className}</div>
                  ${lesson.room ? `<div class="room-name">${lesson.room}</div>` : ''}
                </div>`;
            }).join('');
            html += `<td>${cellContent}</td>`;
          } else {
            html += `<td><span class="empty-cell">—</span></td>`;
          }
        });

        html += '</tr>';
      });

      html += '</tbody></table></div>';

      document.getElementById('schedule').innerHTML = html;
      document.getElementById('print-preview-btn').style.display = '';

      // Update print header
      document.getElementById('print-title').textContent = `جدول حصص الأستاذ(ة): ${teacherName}`;
      document.getElementById('print-subtitle').textContent = `الموسم الدراسي 2025-2026`;
    }

    function hideStats() {
      document.getElementById('teacher-stats-grid').classList.remove('visible');
      document.getElementById('print-preview-btn').style.display = 'none';
    }

    function showNoImportState() {
      document.getElementById('teacher-count-badge').innerHTML =
        '<span style="color: #ef4444;"><i class="fas fa-exclamation-triangle"></i> لا توجد بيانات</span>';
      document.getElementById('schedule').innerHTML = `
        <div class="no-data-state">
          <i class="fas fa-file-import"></i>
          <h4>لم يتم استيراد بيانات استعمال الزمن بعد</h4>
          <p>يرجى استيراد ملف FET من صفحة <strong>استيراد البيانات</strong> أولاً</p>
          <a href="settings-imports.html" class="btn btn-primary" style="display: inline-block;">
            <i class="fas fa-upload"></i> الانتقال لصفحة الاستيراد
          </a>
        </div>`;
    }

    function showNoTeachersState() {
      document.getElementById('teacher-count-badge').innerHTML =
        '<span style="color: #f59e0b;"><i class="fas fa-info-circle"></i> لا يوجد أساتذة في البيانات</span>';
      document.getElementById('schedule').innerHTML = `
        <div class="no-data-state">
          <i class="fas fa-chalkboard-teacher"></i>
          <h4>لم يتم العثور على أساتذة</h4>
          <p>ملف FET المستورد لا يحتوي على بيانات الأساتذة</p>
        </div>`;
    }
  </script>
</body>

</html>
