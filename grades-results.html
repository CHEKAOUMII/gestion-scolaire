<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <script src="js/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="بيان النتائج الدراسية للتلاميذ">
    <title>بيان النتائج | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind-output.css">
    <script src="js/data/ma-education-labels.js"></script>
        <script src="js/shared/dom-helpers.js" defer></script>
        <script src="js/shared/auth-session.js" defer></script>
        <script src="js/shared/filter-manager.js" defer></script>
        <script src="js/utils.js" defer></script>
    <script src="js/notifications.js" defer></script>
    <script src="js/message-system.js" defer></script>
    <script src="js/sidebar.js" defer></script>
    <script src="js/shared/errors/subject-coefficient-error-contract.js"></script>
    <script src="js/cc-rules.js"></script>
    <script src="js/ux-enhancements.js" defer></script>
    <script src="js/print-system.js"></script>
    <script src="js/shared/orientation-topbar-print.js" defer></script>
    </head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
    <div class="header-left">
                <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                <h2 class="page-title"><i class="fas fa-file-invoice"></i> بيان النتائج</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر" type="button" aria-label="تبديل المظهر"><i class="fas fa-moon" aria-hidden="true"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <!-- Filter Section -->
            <div class="gr-form-section">
                <div class="gr-form-header">
                    <i class="fas fa-filter"></i> تصفية وتوليد بيان النتائج
                </div>
                <form id="gr-form" class="gr-form-grid">
                    <div class="gr-form-group">
                        <label for="level-select">المستوى</label>
                        <select id="level-select">
                            <option value="">اختر المستوى</option>
                        </select>
                    </div>
                    <div class="gr-form-group">
                        <label for="class-select">القسم</label>
                        <select id="class-select" disabled>
                            <option value="">اختر القسم</option>
                        </select>
                    </div>
                    <div class="gr-form-group">
                        <label for="semester-select">الدورة</label>
                        <select id="semester-select">
                            <option value="1">الدورة الأولى</option>
                            <option value="2">الدورة الثانية</option>
                        </select>
                    </div>
                    <div class="gr-form-group">
                        <label for="student-select">التلميذ</label>
                        <select id="student-select" disabled>
                            <option value="">الكل</option>
                        </select>
                    </div>
                    <div class="gr-form-actions">
                        <button class="btn btn-primary" type="button" id="generate-btn"><i
                                class="fas fa-file-invoice"></i> توليد</button>
                        <button class="btn btn-success ux-print-preview-btn" type="button" id="print-btn" disabled><i
                                class="fas fa-eye"></i> معاينة</button>
                    </div>
                </form>
            </div>

            <!-- Preview Section -->
            <div class="gr-preview-section">
                <div class="gr-preview-header">
                    <h3 class="gr-preview-title">
                        <i class="fas fa-scroll"></i>
                        بيان النتائج الدراسية
                        <span id="gr-count-badge" class="gr-count-badge" style="display:none;">0</span>
                    </h3>
                </div>

                <div class="gr-preview-body" id="gr-preview-body">
                    <div class="gr-empty-state" id="gr-empty-state">
                        <div class="gr-empty-icon">
                            <i class="fas fa-file-invoice"></i>
                        </div>
                        <h4>لا يوجد بيان نتائج</h4>
                        <p>اختر المستوى والقسم ثم اضغط "توليد" لإنشاء بيانات النتائج</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            // ─── Globals ───
            let allGrades = [];
            let allStudents = [];
            let allAbsences = [];
            let generatedData = null;

            const schoolYear = () => {
                return typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';
            };

            // ─── Level Normalization ───
            // Uses shared getLevelFromSection() from utils.js (returns {code, name, order})

            // ─── Helpers ───

            function gradeComment(avg) {
                if (avg >= 16) return 'ممتاز';
                if (avg >= 14) return 'حسن جداً';
                if (avg >= 12) return 'حسن';
                if (avg >= 10) return 'متوسط';
                if (avg >= 8) return 'دون المتوسط';
                return 'ضعيف';
            }

            // ─── Data Loading ───
            async function loadAllData() {
                const year = schoolYear();
                try {
                    [allStudents, allGrades, allAbsences] = await Promise.all([
                        window.api?.students?.getAll?.(year) || [],
                        window.api?.grades?.getAll?.(year) || [],
                        window.api?.absences?.getAll?.(year) || []
                    ]);
                } catch (e) {
                    console.error('Failed to load data', e);
                    allStudents = []; allGrades = []; allAbsences = [];
                }
            }

            // ─── Populate Filters (via shared FilterManager) ───
            let filterManager = null;

            function populateStudentList() {
                const classSelect = document.getElementById('class-select');
                const studentSelect = document.getElementById('student-select');
                const cls = classSelect.value;
                studentSelect.innerHTML = '<option value="">الكل</option>';
                studentSelect.disabled = !cls;
                if (!cls) return;
                allStudents
                    .filter(s => String(s.section || '').trim() === cls)
                    .sort((a, b) => String(a.full_name || '').localeCompare(b.full_name || '', 'ar'))
                    .forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = String(s.code || '').trim();
                        opt.textContent = `${s.full_name || s.code} (${s.code})`;
                        studentSelect.appendChild(opt);
                    });
            }

            async function populateFilters() {
                try {
                    filterManager = new FilterManager({
                        selectors: { level: 'level-select', class: 'class-select' },
                        placeholders: { level: 'اختر المستوى', class: 'اختر القسم' },
                        onChange: () => populateStudentList()
                    });
                    await filterManager.init();
                } catch (err) {
                    console.warn('Failed to load filters:', err);
                    if (typeof showToast === 'function') showToast('تعذر تحميل بيانات المستويات', 'error');
                }
            }

            // ─── Generate Results ───
            function generateResults() {
                const className = document.getElementById('class-select').value;
                const semester = parseInt(document.getElementById('semester-select').value, 10);
                if (!className) {
                    if (typeof showToast === 'function') showToast('يرجى اختيار القسم', 'warning');
                    return;
                }

                // Filter grades for this class and semester
                const classGrades = allGrades.filter(g =>
                    String(g.section || '').trim() === className &&
                    parseInt(g.semester, 10) === semester
                );

                if (!classGrades.length) {
                    if (typeof showToast === 'function') showToast('لا توجد نقط لهذا القسم في هذه الدورة', 'warning');
                    return;
                }

                // Get students in this class
                const selectedStudentCode = document.getElementById('student-select').value;
                let classStudents = allStudents.filter(s =>
                    String(s.section || '').trim() === className
                ).sort((a, b) => String(a.full_name || '').localeCompare(b.full_name || '', 'ar'));

                // If a specific student is selected, filter to only that student
                if (selectedStudentCode) {
                    classStudents = classStudents.filter(s =>
                        String(s.code || '').trim() === selectedStudentCode
                    );
                }

                const branch = typeof detectBranch === 'function' ? detectBranch(className) : null;
                const coefficientContext = {
                    cycleCode: 'secondary_qualifiant',
                    streamCode: branch,
                    schoolYear: schoolYear()
                };
                const missingCoefficients = [];
                console.log('[بيان النتائج] className:', className, '→ branch:', branch);
                if (branch && typeof CC_BRANCH_COEFFICIENTS !== 'undefined') {
                    console.log('[بيان النتائج] coefficient table keys:', Object.keys(CC_BRANCH_COEFFICIENTS[branch] || {}));
                }

                // Compute subject-level data for all students
                // First: get all subjects in this class
                const allSubjects = new Set();
                classGrades.forEach(g => {
                    const base = normalizeSubjectName(g.subject);
                    if (base) allSubjects.add(base);
                });
                const subjectList = [...allSubjects];

                // Compute each student's subject averages
                const studentResults = [];
                classStudents.forEach(student => {
                    const studentGrades = classGrades.filter(g =>
                        String(g.student_code || '').trim() === String(student.code || '').trim()
                    );
                    if (!studentGrades.length) return;

                    const bySubject = {};
                    studentGrades.forEach(g => {
                        const base = normalizeSubjectName(g.subject);
                        if (!base) return;
                        if (!bySubject[base]) bySubject[base] = [];
                        bySubject[base].push(g);
                    });

                    const subjectData = [];
                    Object.entries(bySubject).forEach(([subj, grades]) => {
                        const avg = typeof computeSubjectAverage === 'function'
                            ? computeSubjectAverage(subj, grades)
                            : grades.reduce((s, g) => s + (Number(g.grade) || 0), 0) / grades.length;
                        const coefficientResolution = typeof resolveSubjectCoefficient === 'function'
                            ? resolveSubjectCoefficient(subj, branch, coefficientContext)
                            : { ok: false, details: { subject: subj, streamCode: branch } };
                        if (!coefficientResolution.ok) missingCoefficients.push(coefficientResolution.details);
                        const coeff = coefficientResolution.ok ? coefficientResolution.coefficient : null;
                        console.log('[coeff]', subj, '→', coeff, '(branch:', branch, ')');
                        subjectData.push({
                            subject: subj,
                            avg: parseFloat(avg.toFixed(2)),
                            coeff,
                            nxm: coeff == null ? null : parseFloat((avg * coeff).toFixed(2))
                        });
                    });

                    // General average
                    const subjectAvgs = subjectData.map(s => ({ subject: s.subject, avg: s.avg }));
                    const averageResolution = typeof computeWeightedGeneralAverageResult === 'function'
                        ? computeWeightedGeneralAverageResult(subjectAvgs, branch, coefficientContext)
                        : { ok: false, missingCoefficients };
                    if (!averageResolution.ok) {
                        (averageResolution.missingCoefficients || []).forEach((entry) => missingCoefficients.push(entry));
                    }
                    const generalAvg = averageResolution.ok ? averageResolution.value : null;

                    const sumNxM = subjectData.reduce((sum, detail) => sum + (detail.nxm || 0), 0);

                    // Absences
                    const studentAbsences = allAbsences.filter(a =>
                        String(a.student_code || '').trim() === String(student.code || '').trim()
                    );
                    const justifiedHours = studentAbsences.filter(a => a.absence_type === 'justified')
                        .reduce((s, a) => s + (Number(a.hours) || 0), 0);
                    const unjustifiedHours = studentAbsences.filter(a => a.absence_type !== 'justified')
                        .reduce((s, a) => s + (Number(a.hours) || 0), 0);
                    const justifiedDays = studentAbsences.filter(a => a.absence_type === 'justified')
                        .reduce((s, a) => s + (Number(a.days) || 0), 0);
                    const unjustifiedDays = studentAbsences.filter(a => a.absence_type !== 'justified')
                        .reduce((s, a) => s + (Number(a.days) || 0), 0);

                    studentResults.push({
                        student,
                        subjectData,
                        generalAvg: parseFloat(generalAvg.toFixed(2)),
                        sumNxM: parseFloat(sumNxM.toFixed(2)),
                        justifiedHours, unjustifiedHours,
                        justifiedDays, unjustifiedDays
                    });
                });

                // Compute rankings per subject
                subjectList.forEach(subj => {
                    const studentsWithSubj = studentResults.filter(sr =>
                        sr.subjectData.some(sd => sd.subject === subj)
                    );
                    studentsWithSubj.sort((a, b) => {
                        const aAvg = a.subjectData.find(sd => sd.subject === subj)?.avg || 0;
                        const bAvg = b.subjectData.find(sd => sd.subject === subj)?.avg || 0;
                        return bAvg - aAvg;
                    });
                    studentsWithSubj.forEach((sr, idx) => {
                        const sd = sr.subjectData.find(s => s.subject === subj);
                        if (sd) sd.rank = idx + 1;
                    });
                });

                // Overall ranking
                const sorted = [...studentResults].sort((a, b) => b.generalAvg - a.generalAvg);
                sorted.forEach((sr, idx) => { sr.overallRank = idx + 1; });

                // Class average
                const classAvg = studentResults.length
                    ? studentResults.reduce((s, r) => s + r.generalAvg, 0) / studentResults.length
                    : 0;

                const uniqueMissingCoefficients = Array.from(
                    new Map(
                        missingCoefficients.map((entry) => [
                            `${entry.streamCode || branch}:${entry.normalizedSubject || entry.subject}`,
                            entry
                        ])
                    ).values()
                );
                generatedData = {
                    className,
                    semester,
                    branch,
                    studentResults,
                    classAvg: parseFloat(classAvg.toFixed(2)),
                    totalStudents: classStudents.length,
                    incomplete: uniqueMissingCoefficients.length > 0,
                    missingCoefficients: uniqueMissingCoefficients,
                    metadata: uniqueMissingCoefficients.length
                        ? SubjectCoefficientErrorContract.createIncompleteResultMetadata(uniqueMissingCoefficients)
                        : { status: 'complete', officialExportBlocked: false, missingCoefficients: [] }
                };

                renderResults();
            }

            // ─── Render ───
            function renderIncompleteResult() {
                const body = document.getElementById('gr-preview-body');
                const printBtn = document.getElementById('print-btn');
                const emptyState = document.getElementById('gr-empty-state');
                const badge = document.getElementById('gr-count-badge');
                if (emptyState) emptyState.style.display = 'none';
                if (badge) badge.style.display = 'none';
                if (printBtn) printBtn.disabled = true;

                const panel = document.createElement('div');
                panel.className = 'gr-empty-state';
                const title = document.createElement('h4');
                title.textContent = 'تعذر اعتماد بيان النتائج';
                const message = document.createElement('p');
                message.textContent = 'توجد معاملات ناقصة. لا يمكن معاينة أو تصدير وثيقة رسمية قبل استكمالها.';
                const list = document.createElement('ul');
                generatedData.missingCoefficients.forEach((entry) => {
                    const item = document.createElement('li');
                    item.textContent = `${entry.subject || 'مادة غير محددة'} — ${entry.streamLabel || entry.streamCode || 'مسلك غير محدد'}`;
                    list.appendChild(item);
                });
                panel.append(title, message, list);

                const role = typeof getCurrentAppRole === 'function' ? getCurrentAppRole() : null;
                const canOverride = ['admin', 'developer'].includes(role);
                if (canOverride && window.api?.subjectCoefficients?.override) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'btn btn-primary';
                    button.textContent = 'اعتماد معامل استثنائي للمادة الأولى';
                    button.addEventListener('click', overrideFirstMissingCoefficient);
                    panel.appendChild(button);
                }
                body.replaceChildren(panel);
            }

            async function overrideFirstMissingCoefficient() {
                const entry = generatedData?.missingCoefficients?.[0];
                if (!entry) return;
                const coefficient = Number(window.prompt(`أدخل معامل المادة «${entry.subject}» (بين 0 و20):`, '1'));
                if (!Number.isFinite(coefficient) || coefficient <= 0 || coefficient > 20) {
                    showToast('المعامل غير صالح', 'warning');
                    return;
                }
                const reason = window.prompt('اذكر سبب الاعتماد الاستثنائي:', 'تصحيح إعدادات المادة');
                if (!reason || !reason.trim()) {
                    showToast('سبب الاعتماد مطلوب للتدقيق', 'warning');
                    return;
                }
                const response = await window.api.subjectCoefficients.override({
                    cycleCode: 'secondary_qualifiant',
                    streamCode: entry.streamCode || generatedData.branch,
                    subject: entry.subject,
                    coefficient,
                    reason,
                    schoolYear: schoolYear()
                });
                if (!response?.success) {
                    showToast(response?.error || 'تعذر اعتماد المعامل', 'error');
                    return;
                }
                setSubjectCoefficientOverrides(response.mappings || []);
                generatedData = null;
                generateResults();
            }

            function renderResults() {
                if (!generatedData || !generatedData.studentResults.length) return;
                if (!SubjectCoefficientErrorContract.isOfficialExportAllowed(generatedData)) {
                    renderIncompleteResult();
                    return;
                }

                const body = document.getElementById('gr-preview-body');
                const badge = document.getElementById('gr-count-badge');
                const printBtn = document.getElementById('print-btn');
                const emptyState = document.getElementById('gr-empty-state');

                if (emptyState) emptyState.style.display = 'none';
                badge.style.display = 'inline-flex';
                badge.textContent = generatedData.studentResults.length;
                printBtn.disabled = false;

                const { className, semester, studentResults, classAvg, totalStudents } = generatedData;
                const semesterLabel = semester === 1 ? 'الدورة الأولى' : 'الدورة الثانية';
                const year = schoolYear();

                let html = '<div class="gr-sheet-wrapper">';

                studentResults.forEach(sr => {
                    const { student, subjectData, generalAvg, sumNxM, overallRank,
                        justifiedHours, unjustifiedHours, justifiedDays, unjustifiedDays } = sr;

                    html += `
                <div class="gr-sheet">
                    <!-- Header -->
                    <div class="gr-header-block">
                        <div class="gr-header-right">
                            <div>الأكاديمية الجهوية للتربية و التكوين</div>
                            <div>المديرية الإقليمية:</div>
                            <div>مؤسسة: الثانوية التأهيلية ابن سينا</div>
                        </div>
                        <div class="gr-header-center">
                            <div class="gr-doc-title">بيان النتائج الدراسية ${semesterLabel === 'الدورة الأولى' ? 'للدورة الأولى' : 'للدورة الثانية'}</div>
                            <div class="gr-doc-year">السنة الدراسية: ${year}</div>
                        </div>
                        <div class="gr-header-left">
                            <div>المملكة المغربية</div>
                            <div>وزارة التربية الوطنية</div>
                            <div>والتعليم الأولي والرياضة</div>
                        </div>
                    </div>

                    <div class="gr-student-meta">
                        <span>المستوى: ${getLevelFromSection(className).name}</span>
                        <span>القسم: ${className}</span>
                        <span>عدد التلاميذ: ${totalStudents}</span>
                    </div>
                    <div class="gr-student-meta">
                        <span>إسم ورقم التلميذ: ${student.full_name || ''} ${student.code || ''}</span>
                    </div>

                    <!-- Grades Table -->
                    <table>
                        <thead>
                            <tr>
                                <th>المواد</th>
                                <th>نقط المراقبة المستمرة</th>
                                <th>المعامل</th>
                                <th>ن × م</th>
                                <th>الترتيب</th>
                                <th>ملاحظات الأساتذة</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${subjectData.map(sd => `
                            <tr>
                                <td>${sd.subject}</td>
                                <td>${sd.avg.toFixed(2).replace('.', ',')}</td>
                                <td>${sd.coeff}</td>
                                <td>${sd.nxm.toFixed(2).replace('.', ',')}</td>
                                <td>${sd.rank || ''}</td>
                                <td>${gradeComment(sd.avg)}</td>
                            </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <!-- Summary -->
                    <div class="gr-summary-row">
                        <div class="gr-summary-box">
                            <table>
                                <tr><td>مجموع ن × م</td><td>${sumNxM.toFixed(2).replace('.', ',')}</td></tr>
                                <tr><td>معدل الدورة</td><td>${generalAvg.toFixed(2).replace('.', ',')}</td></tr>
                                <tr><td>معدل القسم</td><td>${classAvg.toFixed(2).replace('.', ',')}</td></tr>
                            </table>
                        </div>
                        <div class="gr-summary-box">
                            <table>
                                <tr><td>الغياب</td><td>الأيام</td><td>الساعات</td></tr>
                                <tr><td>مبرر</td><td>${justifiedDays}</td><td>${justifiedHours}</td></tr>
                                <tr><td>غير مبرر</td><td>${unjustifiedDays}</td><td>${unjustifiedHours}</td></tr>
                            </table>
                        </div>
                    </div>

                    <!-- Committee Decision -->
                    <div class="gr-decision-row">
                        <div class="gr-decision-box">
                            <h5>قرار اللجنة</h5>
                            <div class="gr-decision-grid">
                                <div class="gr-decision-item"><span class="gr-checkbox"></span> لوحة الشرف</div>
                                <div class="gr-decision-item"><span class="gr-checkbox"></span> إنذار</div>
                                <div class="gr-decision-item"><span class="gr-checkbox"></span> تشجيع</div>
                                <div class="gr-decision-item"><span class="gr-checkbox"></span> توبيخ</div>
                                <div class="gr-decision-item"><span class="gr-checkbox"></span> تنويه</div>
                            </div>
                        </div>
                        <div class="gr-observations">
                            <h5>الملاحظات العامة</h5>
                        </div>
                    </div>

                    <div class="gr-signature">توقيع المدير(ة):</div>
                </div>`;
                });

                html += '</div>';
                body.innerHTML = html;

                if (typeof showToast === 'function') {
                    showToast(`تم توليد بيان النتائج لـ ${studentResults.length} تلميذ`, 'success');
                }
            }

            // ─── Init ───
            async function init() {
                await Promise.all([loadAllData(), populateFilters()]);

                document.getElementById('generate-btn').addEventListener('click', generateResults);

                // Print Preview
                document.getElementById('print-btn').addEventListener('click', () => {
                    if (!generatedData || !generatedData.studentResults.length) {
                        if (typeof showToast === 'function') showToast('قم بتوليد البيان أولاً', 'warning');
                        return;
                    }
                    if (!SubjectCoefficientErrorContract.isOfficialExportAllowed(generatedData)) {
                        if (typeof showToast === 'function') showToast('لا يمكن تصدير بيان غير مكتمل', 'warning');
                        return;
                    }
                    PrintSystem.preview({
                            title: 'بيان النتائج',
                            pageSize: 'A4',
                            contentSelector: '.gr-sheet-wrapper'
                        });
                });

                // Relocate the primary print control into the sticky unified header (after setupUnifiedHeader).
                // The disabled/enabled state is preserved: renderResults() re-queries #print-btn by id.
                (window.StickyTopbarPrint || window.OrientationTopbarPrint)?.mount?.(document, { buttonId: 'print-btn' });

                // School year change
                const yearEl = document.getElementById('school-year');
                if (yearEl) yearEl.addEventListener('change', async () => {
                    await loadAllData();
                    if (filterManager) { filterManager.destroy(); }
                    await populateFilters();
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>

</html>
