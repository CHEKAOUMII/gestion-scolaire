
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{direction:rtl;font-family:var(--font-sans)}
  .card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin:1rem 0}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
  .card-title{font-size:15px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:7px}
  .type-tabs{display:flex;gap:6px}
  .tab-btn{padding:6px 16px;border-radius:var(--border-radius-md);font-size:13px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
  .tab-btn.active{background:#185FA5;color:#fff;border-color:#185FA5}
  .card-body{padding:14px 16px}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--color-text-secondary)}
  .field select,.field input,.date-wrap input{width:100%;padding:7px 9px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary);outline:none;font-family:var(--font-sans)}
  .field select:focus,.field input:focus,.date-wrap input:focus{border-color:#185FA5;box-shadow:0 0 0 2px rgba(24,95,165,.12)}

  /* The smart date field */
  .date-wrap{display:flex;align-items:center;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden;transition:all .2s;background:var(--color-background-primary)}
  .date-wrap:focus-within{border-color:#185FA5;box-shadow:0 0 0 2px rgba(24,95,165,.12)}
  .date-wrap input{border:none!important;box-shadow:none!important;border-radius:0;padding:7px 8px;flex:1;min-width:0}
  .date-sep{padding:0 6px;font-size:12px;color:var(--color-text-tertiary);white-space:nowrap;flex-shrink:0;display:none;align-items:center;gap:4px}
  .date-sep.visible{display:flex}
  .date-to-wrap{max-width:0;overflow:hidden;transition:max-width .25s ease;display:flex;align-items:center;flex-shrink:0}
  .date-to-wrap.open{max-width:160px}
  .days-pill{font-size:11px;font-weight:500;background:#E6F1FB;color:#0C447C;padding:2px 8px;border-radius:20px;white-space:nowrap;display:none;margin-left:4px;flex-shrink:0}
  .days-pill.visible{display:inline-block}

  .divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:12px 0}
  .actions{display:flex;justify-content:center;gap:8px}
  .btn-primary{padding:7px 20px;background:#185FA5;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .btn-secondary{padding:7px 20px;background:var(--color-background-primary);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .field-notes{grid-column:1/-1}
</style>

<div class="card">
  <div class="card-header">
    <div class="card-title">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="8" y1="5" x2="8" y2="11"/></svg>
      تسجيل غياب أو تأخر
    </div>
    <div class="type-tabs">
      <button class="tab-btn" onclick="setType('late',this)">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><polyline points="8 5 8 8 10 10"/></svg>تأخر
      </button>
      <button class="tab-btn active" onclick="setType('absent',this)">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><line x1="5" y1="8" x2="11" y2="8"/></svg>غياب
      </button>
    </div>
  </div>

  <div class="card-body">
    <div class="row">
      <div class="field">
        <label>المادة</label>
        <select><option>-- كل المواد --</option><option>الرياضيات</option><option>اللغة العربية</option></select>
      </div>
      <div class="field">
        <label>الأستاذ(ة)</label>
        <select><option>-- اختر أستاذ(ة) --</option><option>محمد العلوي</option><option>فاطمة بنعلي</option></select>
      </div>
      <div class="field">
        <label>فترة الغياب</label>
        <select><option>اليوم كامل</option><option>صباح</option><option>مساء</option></select>
      </div>

      <!-- THE SMART DATE FIELD — spans across remaining columns -->
      <div class="field" style="grid-column:span 2">
        <label id="date-label">التاريخ</label>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="date-wrap" id="date-wrap" style="flex:1">
            <input type="date" id="date-from" value="2026-04-17" oninput="calcDays()">
            <span class="date-sep" id="date-sep">←</span>
            <div class="date-to-wrap" id="date-to-wrap">
              <input type="date" id="date-to" value="2026-04-20" oninput="calcDays()">
            </div>
          </div>
          <span class="days-pill" id="days-pill"></span>
        </div>
      </div>
    </div>

    <div style="height:10px"></div>

    <div class="row">
      <div class="field">
        <label>السبب</label>
        <select id="reason" onchange="onReason()">
          <option value="">-- اختر السبب --</option>
          <option value="medical">شهادة طبية</option>
          <option value="family">ظروف عائلية</option>
          <option value="other">أخرى</option>
        </select>
      </div>
      <div class="field field-notes" style="grid-column:span 4">
        <label>ملاحظات</label>
        <input type="text" placeholder="اختياري">
      </div>
    </div>

    <hr class="divider">
    <div class="actions">
      <button class="btn-secondary">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1 4 1 1 15 1 15 4"/><line x1="8" y1="1" x2="8" y2="15"/></svg>
        إعادة تعيين
      </button>
      <button class="btn-primary">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H5L2 5v9h12V2z"/><rect x="5" y="9" width="6" height="5"/><rect x="5" y="2" width="5" height="4"/></svg>
        حفظ
      </button>
    </div>
  </div>
</div>

<script>
function setType(t,el){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}
function onReason(){
  const isMed = document.getElementById('reason').value === 'medical';
  document.getElementById('date-to-wrap').classList.toggle('open', isMed);
  document.getElementById('date-sep').classList.toggle('visible', isMed);
  document.getElementById('date-label').textContent = isMed ? 'التاريخ (من ← إلى)' : 'التاريخ';
  if(isMed) calcDays(); else document.getElementById('days-pill').classList.remove('visible');
}
function calcDays(){
  const f = new Date(document.getElementById('date-from').value);
  const t = new Date(document.getElementById('date-to').value);
  const pill = document.getElementById('days-pill');
  if(!isNaN(f)&&!isNaN(t)&&t>=f){
    const d = Math.round((t-f)/864e5)+1;
    pill.textContent = d + ' يوم';
    pill.classList.add('visible');
  } else { pill.classList.remove('visible'); }
}
calcDays();
</script>
