<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برمجة الامتحانات | برنامج التدبير المدرسي</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ux-enhancements.js"></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title"><i class="fas fa-calendar-check"></i> برمجة الامتحانات</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <div class="search-section">
                <form id="form" class="search-form"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                    <input type="hidden" id="id">
                    <input id="title" placeholder="عنوان الامتحان" required>
                    <input id="section" placeholder="القسم">
                    <input id="subject" placeholder="المادة">
                    <input type="date" id="date">
                    <input type="time" id="time">
                    <button class="btn btn-success" type="submit">حفظ</button>
                </form>
            </div>

            <div class="students-results">
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>العنوان</th>
                            <th>القسم</th>
                            <th>المادة</th>
                            <th>التاريخ</th>
                            <th>الوقت</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const year = '2025/2026';
        let rows = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadRows();
            document.getElementById('form').addEventListener('submit', save);
        });

        async function loadRows() {
            rows = await window.api.exams.getAll(year) || [];
            document.getElementById('tbody').innerHTML = rows.length ? rows.map((r, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${r.title || '-'}</td>
                    <td>${r.section || '-'}</td>
                    <td>${r.subject || '-'}</td>
                    <td>${r.exam_date || '-'}</td>
                    <td>${r.exam_time || '-'}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="editRow(${r.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="delRow(${r.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="7" style="padding: 20px; text-align: center;">لا توجد بيانات</td></tr>';
        }

        async function save(e) {
            e.preventDefault();
            const payload = {
                id: document.getElementById('id').value ? Number(document.getElementById('id').value) : undefined,
                title: document.getElementById('title').value.trim(),
                section: document.getElementById('section').value.trim(),
                subject: document.getElementById('subject').value.trim(),
                exam_date: document.getElementById('date').value,
                exam_time: document.getElementById('time').value,
                school_year: year
            };
            const res = await window.api.exams.save(payload);
            if (!res || res.success === false) {
                showToast('فشل الحفظ', 'error');
                return;
            }
            showToast('تم الحفظ', 'success');
            e.target.reset();
            document.getElementById('id').value = '';
            await loadRows();
        }

        function editRow(id) {
            const r = rows.find(x => x.id === id);
            if (!r) return;
            document.getElementById('id').value = r.id;
            document.getElementById('title').value = r.title || '';
            document.getElementById('section').value = r.section || '';
            document.getElementById('subject').value = r.subject || '';
            document.getElementById('date').value = r.exam_date || '';
            document.getElementById('time').value = r.exam_time || '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function delRow(id) {
            if (!confirm('حذف الامتحان؟')) return;
            const res = await window.api.exams.delete(id);
            if (!res || res.success === false) {
                showToast('فشل الحذف', 'error');
                return;
            }
            await loadRows();
        }
    </script>
</body>

</html>
