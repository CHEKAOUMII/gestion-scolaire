<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/ux-enhancements.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-secondary);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 106, 197, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 106, 197, 0.05) 0px, transparent 50%);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-card);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: var(--shadow-soft);
            transform: rotate(-5deg);
        }

        .login-logo i {
            font-size: 36px;
            color: white;
        }

        .login-header h1 {
            font-family: var(--font-display);
            font-size: 24px;
            color: var(--color-text-main);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            color: var(--color-text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--color-text-main);
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 1px solid var(--color-accent);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            transition: var(--transition-fast);
            background: rgba(255, 255, 255, 0.8);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 106, 197, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(59, 106, 197, 0.3);
        }

        .btn-login:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 106, 197, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        .btn-login.loading span {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #FED7D7;
            color: #C53030;
            padding: 12px 15px;
            border-radius: variables(--radius-sm);
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--color-accent);
        }

        .login-footer p {
            color: var(--color-text-muted);
            font-size: 13px;
        }

        .school-name {
            text-align: center;
            margin-top: 30px;
            color: var(--color-text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        .school-name i {
            margin-left: 5px;
            color: var(--color-primary);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>برنامج التدبير المدرسي</h1>
                <p>تسجيل دخول المشرف فقط</p>
            </div>



            <div class="error-message" id="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="example@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <div class="spinner"></div>
                    <span><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</span>
                </button>


            </form>

            <div class="login-footer">
                <p>© 2026 جميع الحقوق محفوظة</p>
            </div>
        </div>

        <p class="school-name">
            <i class="fas fa-school"></i>
            الثانوية التأهيلية ابن سينا
        </p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');


        function getSafeNextPage() {
            const params = new URLSearchParams(window.location.search);
            const next = String(params.get('next') || '').trim();
            if (/^[a-zA-Z0-9._-]+\.html$/.test(next)) return next;
            return 'index.html';
        }

        async function checkExistingAdminSession() {
            if (!window.api?.auth?.getSession) return;
            try {
                const res = await window.api.auth.getSession();
                if (res?.success && res?.authenticated && String(res.user?.role || '').toLowerCase() === 'admin') {
                    const nextPage = getSafeNextPage();
                    window.location.replace(`${nextPage}?loggedin=1`);
                }
            } catch (_err) {
                // ignore
            }
        }

        function clearLocalSession() {
            try {
                localStorage.removeItem('gsl_auth_session_v1');
            } catch (_err) {
                // ignore storage errors
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btnLogin.classList.add('loading');
            btnLogin.disabled = true;
            errorMessage.classList.remove('show');

            try {
                if (!window.api?.auth?.login) {
                    throw new Error('تعذر تهيئة جلسة التطبيق');
                }

                const appSessionRes = await window.api.auth.login({ email, password });
                if (!appSessionRes?.success || !appSessionRes?.authenticated) {
                    clearLocalSession();
                    errorText.textContent = appSessionRes?.error || 'فشل تسجيل الدخول';
                    errorMessage.classList.add('show');
                    btnLogin.classList.remove('loading');
                    btnLogin.disabled = false;
                    return;
                }

                const sessionUser = appSessionRes.user || {};
                if (String(sessionUser.role || '').toLowerCase() !== 'admin') {
                    await window.api.auth.logout();
                    clearLocalSession();
                    errorText.textContent = 'هذه الصفحة مخصصة للمشرف فقط';
                    errorMessage.classList.add('show');
                    btnLogin.classList.remove('loading');
                    btnLogin.disabled = false;
                    return;
                }

                localStorage.setItem(
                    'gsl_auth_session_v1',
                    JSON.stringify({
                        userId: Number(sessionUser.userId || 0),
                        name: String(sessionUser.name || ''),
                        email: String(sessionUser.email || email || '').trim().toLowerCase(),
                        role: 'admin',
                        loggedAt: Date.now(),
                        source: 'sqlite'
                    })
                );

                const nextPage = getSafeNextPage();
                window.location.replace(`${nextPage}?loggedin=1`);
            } catch (error) {
                let message = 'حدث خطأ أثناء تسجيل الدخول';

                switch (error.code) {
                    case 'USER_NOT_FOUND':
                        message = 'البريد الإلكتروني غير مسجل';
                        break;
                    case 'INVALID_CREDENTIALS':
                        message = 'كلمة المرور غير صحيحة';
                        break;
                    case 'INVALID_EMAIL':
                        message = 'البريد الإلكتروني غير صالح';
                        break;
                    case 'INVALID_PASSWORD':
                        message = 'كلمة المرور مطلوبة';
                        break;
                    case 'PASSWORD_NOT_SET':
                        message = 'لم يتم إعداد كلمة مرور لهذا المستخدم';
                        break;
                    case 'USER_DISABLED':
                        message = 'هذا المستخدم معطّل من طرف الإدارة';
                        break;
                }

                errorText.textContent = message;
                errorMessage.classList.add('show');
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        });

        checkExistingAdminSession();
    </script>
</body>

</html>
