<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <script src="js/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة الغياب الأسبوعية | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind-output.css">
    <link rel="stylesheet" href="css/absence-weekly.css">
    <script src="js/utils.js" defer></script>
        <script src="js/shared/date-utils.js" defer></script>
    <script src="js/notifications.js" defer></script>
    <script src="js/message-system.js" defer></script>
    <script src="js/sidebar.js" defer></script>
    <script src="js/ux-enhancements.js" defer></script>
    <script src="js/print-system.js"></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
    <div class="header-left">
                <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                <h2 class="page-title"><i class="fas fa-calendar-week"></i> ورقة الغياب الأسبوعية</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر" type="button" aria-label="تبديل المظهر"><i class="fas fa-moon" aria-hidden="true"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <div class="search-section">
                <h3><i class="fas fa-calendar-alt"></i> اختيار القسم والأسبوع</h3>
                <form class="search-form"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                    <select id="level-select">
                        <option value="">-- اختر المستوى --</option>
                    </select>
                    <select id="class-select" disabled>
                        <option value="">-- اختر القسم --</option>
                    </select>
                    <input type="date" id="week-start" required aria-label="تاريخ بداية الأسبوع (الإثنين)">
                    <button class="btn btn-primary" type="button" id="generate-btn"><i class="fas fa-table"></i>
                        توليد</button>
                    <button class="btn btn-success" type="button" id="print-btn" style="display:none;"><i class="fas fa-eye"></i>
                        معاينة الطباعة</button>
                </form>
                <div id="data-badge" style="margin-top:10px;font-size:0.85rem;"></div>
            </div>

            <div class="students-results">
                <h3><i class="fas fa-clipboard-list"></i> ورقة الغياب</h3>
                <div id="sheet" class="page-empty-state">
                    <i class="fas fa-calendar-week"></i>
                    <p>اختر المستوى ثم القسم وتاريخ بداية الأسبوع ثم اضغط "توليد"</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/pages/absence-weekly.js" defer></script>
</body>

</html>
