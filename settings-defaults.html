<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="إعدادات التطبيق الافتراضية: عدد الفروض وصلاحيات الصفحات" />
        <meta name="theme-color" content="#3b6ac5" />
        <title>إعدادات التطبيق | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        <script src="js/shared/role-session-guard.js"></script>
        <script src="js/pages/settings-defaults-guard.js"></script>
    </head>

    <body>
        <noscript>
            <div
                class="fixed inset-0 z-[9999] flex min-h-screen items-center justify-center bg-[var(--color-primary-dark)] p-10 text-center text-white"
            >
                <div>
                    <i class="fas fa-exclamation-triangle mb-4 block text-5xl text-[var(--color-warning-solid)]"></i>
                    <h2 class="text-2xl font-bold">يجب تفعيل JavaScript لاستخدام هذا التطبيق</h2>
                </div>
            </div>
        </noscript>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button
                        class="menu-toggle"
                        id="menu-toggle"
                        type="button"
                        aria-label="فتح القائمة الجانبية"
                        title="القائمة"
                    >
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="page-title"><i class="fas fa-sliders-h"></i> إعدادات التطبيق</h2>
                </div>
                <div class="header-right">
                    <button
                        class="theme-toggle"
                        id="theme-toggle"
                        type="button"
                        aria-label="تبديل المظهر"
                        title="تبديل المظهر"
                    >
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container su-page sd-shell">
                <!-- Compact page intro -->
                <div class="sd-intro">
                    <div class="sd-intro__copy">
                        <p class="sd-intro__lead">افتراضيات التطبيق</p>
                        <p class="sd-intro__hint">عدد الفروض حسب المستوى · صلاحيات الوصول للصفحات</p>
                    </div>
                    <div class="rh-tabs sd-tabs" role="tablist" aria-label="أقسام الإعدادات">
                        <button
                            type="button"
                            class="rh-tab-btn active"
                            role="tab"
                            id="tab-btn-exams"
                            data-tab="exams"
                            aria-selected="true"
                            aria-controls="tab-exams"
                        >
                            <i class="fas fa-clipboard-list"></i>
                            <span>عدد الفروض</span>
                        </button>
                        <button
                            type="button"
                            class="rh-tab-btn"
                            role="tab"
                            id="tab-btn-access"
                            data-tab="access"
                            aria-selected="false"
                            aria-controls="tab-access"
                        >
                            <i class="fas fa-user-shield"></i>
                            <span>صلاحيات الصفحات</span>
                        </button>
                    </div>
                </div>

                <!-- ═══ Tab 1: Exam counts ═══ -->
                <div class="rh-tab-panel active" id="tab-exams" role="tabpanel" aria-labelledby="tab-btn-exams">
                    <section class="sd-panel">
                        <div class="sd-toolbar">
                            <div class="sd-toolbar__start">
                                <div class="sd-field-inline">
                                    <label for="exam-level-select" class="sd-field-inline__label">
                                        <i class="fas fa-graduation-cap"></i> المستوى
                                    </label>
                                    <select id="exam-level-select" class="sd-select"></select>
                                </div>
                            </div>
                            <div class="sd-toolbar__end">
                                <span id="exam-counts-pending" class="sd-chip" data-state="clean">محفوظ</span>
                                <button id="refresh-exam-counts" class="btn btn-secondary btn-sm" type="button" title="تحديث">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                                <button id="save-exam-counts" class="btn btn-success btn-sm" type="button" disabled>
                                    <i class="fas fa-save"></i> حفظ
                                </button>
                            </div>
                        </div>
                        <p class="sd-hint">
                            المستوى «الافتراضي» يُطبَّق عند غياب تخصيص لمستوى معيّن.
                        </p>
                        <div class="sd-table-scroll">
                            <table class="sd-table sd-table--exams">
                                <thead>
                                    <tr>
                                        <th class="sd-col-num">#</th>
                                        <th>المادة</th>
                                        <th class="sd-col-count">عدد الفروض</th>
                                        <th class="sd-col-source">المصدر</th>
                                    </tr>
                                </thead>
                                <tbody id="exam-counts-tbody"></tbody>
                            </table>
                        </div>
                    </section>
                </div>

                <!-- ═══ Tab 2: Page access matrix ═══ -->
                <div class="rh-tab-panel" id="tab-access" role="tabpanel" aria-labelledby="tab-btn-access" hidden>
                    <section class="sd-panel">
                        <div class="sd-toolbar">
                            <div class="sd-toolbar__start">
                                <span class="sd-toolbar__title">
                                    <i class="fas fa-table-cells"></i>
                                    مصفوفة الصلاحيات
                                </span>
                                <span class="sd-toolbar__meta" id="page-access-meta"></span>
                            </div>
                            <div class="sd-toolbar__end">
                                <span id="page-access-pending" class="sd-chip" data-state="clean">محفوظ</span>
                                <button id="refresh-page-access" class="btn btn-secondary btn-sm" type="button" title="تحديث">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                                <button id="save-page-access" class="btn btn-success btn-sm" type="button" disabled>
                                    <i class="fas fa-save"></i> حفظ
                                </button>
                            </div>
                        </div>
                        <p class="sd-hint">
                            الصفوف = الصفحات · الأعمدة = الأدوار · المدير والمطوّر دائماً مسموح لهم.
                        </p>
                        <div class="sd-matrix-wrap">
                            <table class="sd-table sd-matrix-table" id="page-access-table">
                                <thead id="page-access-thead"></thead>
                                <tbody id="page-access-tbody"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <script src="js/pages/settings-defaults.js" defer></script>
    </body>
</html>
