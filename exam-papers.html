<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تتبع استلام أوراق التحرير من الأساتذة حسب المادة والفرض والأقسام">
    <title>تتبع أوراق التحرير | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind-output.css">
    <script src="js/utils.js" defer></script>
    <script src="js/notifications.js" defer></script>
    <script src="js/message-system.js" defer></script>
    <script src="js/sidebar.js" defer></script>
    <script src="js/ux-enhancements.js" defer></script>
    <script src="js/shared/timetable-utils.js" defer></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle" aria-label="فتح أو إغلاق القائمة الجانبية"><i
                        class="fas fa-bars" aria-hidden="true"></i></button>
                <h2 class="page-title"><i class="fas fa-file-import" aria-hidden="true"></i> تتبع أوراق التحرير</h2>
            </div>
            <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر" aria-label="تبديل المظهر"><i
                    class="fas fa-moon" aria-hidden="true"></i></button>
        </header>

        <div class="grades-container" style="padding-top:18px">
            <!-- Stats Row -->
            <div class="staff-stats-row animate-in">
                <div class="staff-stat-card ep-stat-total">
                    <span class="staff-stat-icon" aria-hidden="true"><i class="fas fa-inbox"></i></span>
                    <span class="staff-stat-content">
                        <span class="stat-value" id="ep-stat-total">0</span>
                        <span class="stat-label">إجمالي التسليمات</span>
                    </span>
                </div>
                <div class="staff-stat-card ep-stat-complete">
                    <span class="staff-stat-icon" aria-hidden="true"><i class="fas fa-check-double"></i></span>
                    <span class="staff-stat-content">
                        <span class="stat-value" id="ep-stat-complete">0</span>
                        <span class="stat-label">مستلمة كاملاً</span>
                    </span>
                </div>
                <div class="staff-stat-card ep-stat-partial">
                    <span class="staff-stat-icon" aria-hidden="true"><i class="fas fa-hourglass-half"></i></span>
                    <span class="staff-stat-content">
                        <span class="stat-value" id="ep-stat-partial">0</span>
                        <span class="stat-label">استلام جزئي</span>
                    </span>
                </div>
                <div class="staff-stat-card ep-stat-teachers">
                    <span class="staff-stat-icon" aria-hidden="true"><i class="fas fa-chalkboard-teacher"></i></span>
                    <span class="staff-stat-content">
                        <span class="stat-value" id="ep-stat-teachers">0</span>
                        <span class="stat-label">أستاذ(ة) مسجَّل</span>
                    </span>
                </div>
            </div>

            <!-- Entry form -->
            <div class="gs-form-section">
                <div class="gs-form-header">
                    <i class="fas fa-inbox"></i> تسجيل استلام أوراق التحرير
                </div>
                <div class="gs-form-grid">
                    <div class="gs-form-group">
                        <label for="ep-session">الدورة</label>
                        <select id="ep-session">
                            <option value="1">الدورة الأولى</option>
                            <option value="2">الدورة الثانية</option>
                        </select>
                    </div>
                    <div class="gs-form-group">
                        <label for="ep-subject">المادة</label>
                        <select id="ep-subject"><option value="">اختر المادة</option></select>
                    </div>
                    <div class="gs-form-group">
                        <label for="ep-teacher">الأستاذ(ة)</label>
                        <select id="ep-teacher"><option value="">اختر المادة أولاً</option></select>
                    </div>
                    <div class="gs-form-group">
                        <label for="ep-date">تاريخ التسليم</label>
                        <input type="date" id="ep-date" class="gs-field-control">
                    </div>
                </div>

                <div class="ep-extra-fields">
                    <div class="gs-form-group">
                        <label class="ep-matrix-label"><i class="fas fa-table-cells-large"></i> أوراق التحرير المستلمة — علّم الخانة عند الاستلام (القسم على اليمين، الفروض في الأعلى)</label>
                        <div id="ep-matrix" class="ep-matrix-card">
                            <div class="ep-matrix-empty">
                                <i class="fas fa-arrow-up" aria-hidden="true"></i>
                                اختر المادة والأستاذ لعرض جدول الأقسام والفروض
                            </div>
                        </div>
                    </div>

                    <div class="gs-form-group">
                        <label for="ep-notes">ملاحظات (اختياري)</label>
                        <input type="text" id="ep-notes" class="gs-field-control" placeholder="ملاحظة حول الاستلام…">
                    </div>
                </div>

                <div class="gs-form-actions" style="margin-top:16px">
                    <button class="btn btn-primary" type="button" id="ep-save"><i class="fas fa-save"></i> حفظ التسليم</button>
                    <button class="btn btn-secondary" type="button" id="ep-reset"><i class="fas fa-rotate-left"></i> تفريغ</button>
                </div>
            </div>

            <!-- Log / history -->
            <div class="gs-preview-section">
                <div class="gs-preview-header gs-preview-header-wrap">
                    <h3 class="gs-preview-title">
                        <i class="fas fa-list-check"></i>
                        سجل التسليمات
                        <span id="ep-count" class="gs-count-badge" aria-live="polite">0</span>
                    </h3>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <button class="btn btn-secondary btn-sm" type="button" id="ep-export"><i class="fas fa-file-export"></i> تصدير JSON</button>
                        <label class="btn btn-secondary btn-sm" style="margin:0;cursor:pointer"><i class="fas fa-file-import"></i> استيراد
                            <input type="file" id="ep-import" accept="application/json,.json" hidden>
                        </label>
                    </div>
                </div>

                <div class="ep-log-filters">
                    <div class="gs-form-grid">
                        <div class="gs-form-group">
                            <label for="ep-f-subject">المادة</label>
                            <select id="ep-f-subject"><option value="">الكل</option></select>
                        </div>
                        <div class="gs-form-group">
                            <label for="ep-f-teacher">الأستاذ(ة)</label>
                            <select id="ep-f-teacher"><option value="">الكل</option></select>
                        </div>
                        <div class="gs-form-group">
                            <label for="ep-f-kind">النوع</label>
                            <select id="ep-f-kind">
                                <option value="">الكل</option>
                                <option value="diagnostic">تشخيصي</option>
                                <option value="fk">فرض كتابي</option>
                            </select>
                        </div>
                        <div class="gs-form-group">
                            <label for="ep-f-from">من تاريخ</label>
                            <input type="date" id="ep-f-from" class="gs-field-control">
                        </div>
                        <div class="gs-form-group">
                            <label for="ep-f-to">إلى تاريخ</label>
                            <input type="date" id="ep-f-to" class="gs-field-control">
                        </div>
                    </div>
                </div>

                <div class="gs-preview-body">
                    <div class="table-responsive">
                        <table id="ep-table" class="comp-table comp-table-card">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>التاريخ</th>
                                    <th>الدورة</th>
                                    <th>المادة</th>
                                    <th>الأستاذ(ة)</th>
                                    <th>التقويم / الفرض</th>
                                    <th>الأقسام</th>
                                    <th>الحالة</th>
                                    <th>ملاحظات</th>
                                    <th class="no-print">حذف</th>
                                </tr>
                            </thead>
                            <tbody id="ep-tbody">
                                <tr class="empty-row"><td colspan="10">لا تسليمات بعد</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data/ma-education-labels.js"></script>
    <script src="js/pages/exam-papers.js" defer></script>
</body>

</html>
