<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>الحضور والغياب | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        
    <link rel="stylesheet" href="css/tailwind-output.css">
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-clipboard-check"></i> الحضور والغياب</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container">
                <!-- ══ Add Record Form ══ -->
                <div class="attendance-form-card">
                    <div class="attendance-form-header">
                        <i class="fas fa-plus-circle"></i>
                        <h3>تسجيل غياب أو تأخر</h3>
                    </div>
                    <div class="attendance-form-body">
                        <form id="att-form">
                            <!-- Type Toggle -->
                            <div style="margin-bottom: 14px">
                                <label
                                    style="
                                        font-family: var(--font-main);
                                        font-size: 13px;
                                        font-weight: 600;
                                        color: var(--color-text-muted);
                                        margin-bottom: 6px;
                                        display: block;
                                    "
                                    >النوع</label
                                >
                                <div class="type-toggle">
                                    <button type="button" class="type-toggle-btn active" data-type="absence">
                                        <i class="fas fa-user-minus"></i> غياب
                                    </button>
                                    <button type="button" class="type-toggle-btn" data-type="late">
                                        <i class="fas fa-clock"></i> تأخر
                                    </button>
                                </div>
                                <input type="hidden" id="att-type" value="absence" />
                            </div>

                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="att-subject">المادة</label>
                                    <select id="att-subject">
                                        <option value="">-- كل المواد --</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="att-teacher">الأستاذ(ة)</label>
                                    <select id="att-teacher" required>
                                        <option value="">-- اختر أستاذ(ة) --</option>
                                    </select>
                                </div>

                                <!-- Absence Period (visible only for absence type) -->
                                <div class="absence-period-field" id="absence-period-field">
                                    <div class="form-group">
                                        <label for="att-absence-period">فترة الغياب</label>
                                        <select id="att-absence-period">
                                            <option value="full_day">اليوم كامل</option>
                                            <option value="morning">صباحا فقط (08:00 – 12:00)</option>
                                            <option value="afternoon">مساءً فقط (14:00 – 18:00)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="att-date">التاريخ</label>
                                    <input type="date" id="att-date" required />
                                </div>

                                <div class="form-group">
                                    <label for="att-reason">السبب</label>
                                    <select id="att-reason">
                                        <option value="">-- اختر السبب --</option>
                                        <option value="رخصة">رخصة</option>
                                        <option value="تكوين">تكوين</option>
                                        <option value="لقاء تربوي">لقاء تربوي</option>
                                        <option value="إضراب">إضراب</option>
                                        <option value="بدون">بدون</option>
                                        <option value="أخرى">أخرى</option>
                                    </select>
                                </div>

                                <!-- Late-only fields -->
                                <div class="late-fields" id="late-fields">
                                    <div class="form-group">
                                        <label for="att-arrival-time">وقت الوصول</label>
                                        <input type="time" id="att-arrival-time" />
                                    </div>
                                </div>

                                <div class="late-fields" id="late-fields-duration">
                                    <div class="form-group">
                                        <label for="att-late-duration">مدة التأخر (بالدقائق)</label>
                                        <input
                                            type="number"
                                            id="att-late-duration"
                                            min="1"
                                            max="480"
                                            placeholder="مثال: 15"
                                        />
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="att-notes">ملاحظات</label>
                                    <input type="text" id="att-notes" placeholder="اختياري" />
                                </div>
                            </div>

                            <input type="hidden" id="att-edit-id" value="" />
                            <div class="form-actions">
                                <button type="submit" class="btn-primary" id="att-submit-btn"><i class="fas fa-save"></i> حفظ</button>
                                <button type="button" class="btn-secondary" id="att-cancel-edit-btn" style="display:none">
                                    <i class="fas fa-times"></i> إلغاء التعديل
                                </button>
                                <button type="reset" class="btn-secondary" id="reset-btn">
                                    <i class="fas fa-undo"></i> إعادة تعيين
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ══ Stat Cards ══ -->
                <div class="att-stats" id="stat-cards">
                    <div class="att-stat-card">
                        <div class="att-stat-icon absence"><i class="fas fa-user-minus"></i></div>
                        <div class="att-stat-body">
                            <h4 id="stat-absence">0</h4>
                            <p>حالة غياب</p>
                        </div>
                    </div>
                    <div class="att-stat-card">
                        <div class="att-stat-icon late"><i class="fas fa-clock"></i></div>
                        <div class="att-stat-body">
                            <h4 id="stat-late">0</h4>
                            <p>حالة تأخر</p>
                        </div>
                    </div>
                    <div class="att-stat-card">
                        <div class="att-stat-icon total"><i class="fas fa-clipboard-list"></i></div>
                        <div class="att-stat-body">
                            <h4 id="stat-total">0</h4>
                            <p>إجمالي السجلات</p>
                        </div>
                    </div>
                </div>

                <!-- ══ Records Table ══ -->
                <div class="att-section">
                    <div class="att-section-header">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>سجل الحضور والغياب</h3>
                        <span class="badge-count" id="records-count" role="status" aria-live="polite">0</span>
                        <div class="filter-bar">
                            <select id="filter-type">
                                <option value="">الكل</option>
                                <option value="absence">غياب</option>
                                <option value="late">تأخر</option>
                            </select>
                            <input type="date" id="filter-date" title="فلترة حسب التاريخ" />
                        </div>
                    </div>
                    <div class="att-table-scroll">
                    <table class="att-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>النوع</th>
                                <th>الأستاذ(ة)</th>
                                <th>المادة</th>
                                <th>التاريخ</th>
                                <th>الفترة</th>
                                <th>التوقيت / المدة</th>
                                <th>السبب</th>
                                <th>الأقسام المتضررة</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="records-tbody" aria-live="polite" aria-relevant="additions removals">
                            <tr class="empty-row">
                                <td colspan="10">لا توجد سجلات</td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                    <div class="support-pagination no-print" id="att-pagination"></div>
                </div>
            </div>
        </main>

        <script src="js/data/ma-education-labels.js"></script>
        <script>
            function escapeHtml(text) {
                if (text === null || text === undefined) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function todayStr() {
                const d = new Date();
                return (
                    d.getFullYear() +
                    '-' +
                    String(d.getMonth() + 1).padStart(2, '0') +
                    '-' +
                    String(d.getDate()).padStart(2, '0')
                );
            }

            /** Convert YYYY-MM-DD to dd/mm/yyyy */
            function formatDate(dateStr) {
                if (!dateStr) return '—';
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr;
                return parts[2] + '/' + parts[1] + '/' + parts[0];
            }

            const year = typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';

            let _timetableCache = null;
            function getTimetableData() {
                if (_timetableCache !== null) return _timetableCache;
                try {
                    const raw = localStorage.getItem('timetableData');
                    _timetableCache = raw ? JSON.parse(raw) : null;
                } catch {
                    _timetableCache = null;
                }
                return _timetableCache;
            }

            let allRecords = [];
            let teachersList = [];
            let teacherSections = {};
            let attCurrentPage = 1;
            const ATT_PER_PAGE = 20;

            /**
             * Timetable structure: timetables[teacherKey][dayName] = { morning: {H1: lesson, H2: ...}, afternoon: {H1: lesson, ...} }
             * The period keys 'morning'/'afternoon' are the first level inside a day.
             * Hour keys (H1, H2, H3, H4) repeat in both morning and afternoon.
             */

            /** Get the period sub-objects to iterate based on absencePeriod */
            function getPeriodEntries(dayData, absencePeriod) {
                if (!dayData || typeof dayData !== 'object') return [];
                if (absencePeriod === 'morning') {
                    return dayData.morning ? [['morning', dayData.morning]] : [];
                }
                if (absencePeriod === 'afternoon') {
                    return dayData.afternoon ? [['afternoon', dayData.afternoon]] : [];
                }
                // full_day → both periods
                const entries = [];
                if (dayData.morning) entries.push(['morning', dayData.morning]);
                if (dayData.afternoon) entries.push(['afternoon', dayData.afternoon]);
                return entries;
            }

            /** Check if a teacher has any hours in a specific period for a given day */
            function teacherWorksInPeriod(teacherName, teacherId, dateStr, period) {
                if (!period || period === 'full_day') return true;
                try {
                    const data = getTimetableData();
                    if (!data || !data.timetables) return true;

                    const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const dayName = dayNames[dateObj.getDay()];

                    const teacherKeys = resolveTeacherTimetableKeys(data, teacherId, teacherName);
                    if (!teacherKeys.length) return true; // no match → don't filter out

                    for (const teacherKey of teacherKeys) {
                        const dayData = data.timetables?.[teacherKey]?.[dayName];
                        if (!dayData) continue;
                        const periodEntries = getPeriodEntries(dayData, period);
                        for (const [, hours] of periodEntries) {
                            if (!hours || typeof hours !== 'object') continue;
                            // If there are any lessons in this period, teacher works here
                            for (const lesson of Object.values(hours)) {
                                if (lesson && lesson.subject) return true;
                            }
                        }
                    }
                    return false;
                } catch {
                    return true;
                }
            }

            document.addEventListener('DOMContentLoaded', async () => {
                // Set today's date
                document.getElementById('att-date').value = todayStr();

                // Load teachers from grades table (primary source)
                try {
                    let result = await window.api.teachers.getFromGrades(year);
                    teachersList = Array.isArray(result) ? result : [];

                    // Fallback to teachers table
                    if (teachersList.length === 0) {
                        result = await window.api.teachers.getAll(year);
                        teachersList = Array.isArray(result) ? result : [];
                    }
                } catch (err) {
                    console.error('[Staff Attendance] Error loading teachers:', err);
                    // Try fallback
                    try {
                        const result = await window.api.teachers.getAll(year);
                        teachersList = Array.isArray(result) ? result : [];
                    } catch (e2) {
                        teachersList = [];
                    }
                }

                if (teachersList.length === 0) {
                    showToast('لم يتم العثور على أساتذة', 'warning');
                }

                // Build unique subjects list from teachers data (with normalization)
                const subjectsSet = new Set();
                teachersList.forEach((t) => {
                    if (t.subject) {
                        // subject may be comma-separated from GROUP_CONCAT
                        t.subject.split(',').forEach((s) => {
                            const trimmed = s.trim();
                            if (trimmed) {
                                const normalized =
                                    typeof normalizeSubjectName === 'function'
                                        ? normalizeSubjectName(trimmed)
                                        : trimmed;
                                if (normalized) subjectsSet.add(normalized);
                            }
                        });
                    }
                });
                const subjectSelect = document.getElementById('att-subject');
                [...subjectsSet]
                    .sort(typeof compareSubjects === 'function' ? compareSubjects : (a, b) => a.localeCompare(b, 'ar'))
                    .forEach((s) => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = s;
                        subjectSelect.appendChild(opt);
                    });

                // Filter teachers by selected subject and absence period
                const teacherSelect = document.getElementById('att-teacher');
                const absencePeriodSelect = document.getElementById('att-absence-period');
                const absencePeriodField = document.getElementById('absence-period-field');

                function filterTeachers() {
                    const selectedSubject = subjectSelect.value;
                    const currentType = document.getElementById('att-type').value;
                    const selectedPeriod = absencePeriodSelect.value;
                    const dateStr = document.getElementById('att-date').value || todayStr();
                    teacherSelect.innerHTML = '<option value="">-- اختر أستاذ(ة) --</option>';

                    const seen = new Set();
                    teachersList.forEach((t) => {
                        // Check if teacher teaches the selected subject (normalized)
                        if (selectedSubject) {
                            const subjects = (t.subject || '').split(',').map((s) => {
                                const trimmed = s.trim();
                                return typeof normalizeSubjectName === 'function'
                                    ? normalizeSubjectName(trimmed)
                                    : trimmed;
                            });
                            if (!subjects.includes(selectedSubject)) return;
                        }
                        // Filter by absence period: only show teachers who work in the selected period
                        if (currentType === 'absence' && selectedPeriod !== 'full_day') {
                            if (!teacherWorksInPeriod(t.full_name, t.id, dateStr, selectedPeriod)) return;
                        }
                        // Deduplicate by name
                        if (seen.has(t.full_name)) return;
                        seen.add(t.full_name);

                        const opt = document.createElement('option');
                        opt.value = t.id || t.full_name;
                        opt.textContent = t.full_name;
                        opt.dataset.subject = selectedSubject || t.subject || '';
                        opt.dataset.hasId = t.id ? '1' : '0';
                        teacherSelect.appendChild(opt);
                    });
                }

                subjectSelect.addEventListener('change', filterTeachers);
                absencePeriodSelect.addEventListener('change', filterTeachers);
                document.getElementById('att-date').addEventListener('change', filterTeachers);
                filterTeachers(); // Initial populate

                // Load teacher → sections mapping for affected sections display
                try {
                    const reportData = await window.api.dailyReport.getData(todayStr(), year);
                    if (reportData && reportData.teacherSections) {
                        teacherSections = reportData.teacherSections;
                    }
                } catch (e) {
                    console.warn('Could not load teacher sections:', e);
                }

                // Type toggle
                document.querySelectorAll('.type-toggle-btn').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.type-toggle-btn').forEach((b) => b.classList.remove('active'));
                        btn.classList.add('active');
                        const type = btn.dataset.type;
                        document.getElementById('att-type').value = type;
                        const lateFields = document.querySelectorAll('.late-fields');
                        lateFields.forEach((f) => {
                            f.classList.toggle('visible', type === 'late');
                        });
                        // Show/hide absence period field
                        absencePeriodField.classList.toggle('visible', type === 'absence');
                        if (type !== 'absence') {
                            absencePeriodSelect.value = 'full_day';
                        }
                        filterTeachers();
                    });
                });

                // Show absence period by default (since default type is absence)
                absencePeriodField.classList.add('visible');

                // Reset button
                document.getElementById('reset-btn').addEventListener('click', () => {
                    document.getElementById('att-subject').value = '';
                    absencePeriodSelect.value = 'full_day';
                    absencePeriodField.classList.add('visible');
                    filterTeachers();
                    document.querySelectorAll('.late-fields').forEach((f) => f.classList.remove('visible'));
                    document.querySelectorAll('.type-toggle-btn').forEach((b) => b.classList.remove('active'));
                    document.querySelector('.type-toggle-btn[data-type="absence"]').classList.add('active');
                    document.getElementById('att-type').value = 'absence';
                    document.getElementById('att-date').value = todayStr();
                });

                // Save form
                document.getElementById('att-form').addEventListener('submit', saveRecord);

                // Cancel edit
                document.getElementById('att-cancel-edit-btn')?.addEventListener('click', resetFormToAddMode);

                // Filters
                document.getElementById('filter-type').addEventListener('change', () => { attCurrentPage = 1; renderTable(); });
                document.getElementById('filter-date').addEventListener('change', () => { attCurrentPage = 1; renderTable(); });

                // Pagination clicks
                const paginationEl = document.getElementById('att-pagination');
                if (paginationEl) {
                    paginationEl.addEventListener('click', (event) => {
                        const btn = event.target.closest('[data-page]');
                        if (btn) {
                            const page = Number(btn.dataset.page);
                            if (!isNaN(page) && page !== attCurrentPage) {
                                attCurrentPage = page;
                                renderTable();
                                document.querySelector('.att-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }
                            return;
                        }
                        if (event.target.closest('#atp-prev')) {
                            if (attCurrentPage > 1) { attCurrentPage--; renderTable(); document.querySelector('.att-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
                        } else if (event.target.closest('#atp-next')) {
                            const totalPages = Math.ceil(getFilteredRecords().length / ATT_PER_PAGE) || 1;
                            if (attCurrentPage < totalPages) { attCurrentPage++; renderTable(); document.querySelector('.att-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
                        }
                    });
                }

                // Load records
                await loadRecords();
            });

            async function loadRecords() {
                allRecords = (await window.api.staffAttendance.getAll(year)) || [];
                updateStats();
                renderTable();
            }

            function updateStats() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                // Filter for current month
                const thisMonth = allRecords.filter((r) => {
                    if (!r.attendance_date) return false;
                    const d = new Date(r.attendance_date);
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                });

                const absences = thisMonth.filter((r) => r.type === 'absence').length;
                const lates = thisMonth.filter((r) => r.type === 'late').length;

                document.getElementById('stat-absence').textContent = absences;
                document.getElementById('stat-late').textContent = lates;
                document.getElementById('stat-total').textContent = allRecords.length;
            }

            /**
             * Normalize a name for fuzzy matching:
             * remove underscores, collapse whitespace, strip Arabic diacritics, trim
             */
            function normalizeName(name) {
                return (name || '')
                    .replace(/_/g, ' ')
                    .replace(/[\u064B-\u065F\u0670]/g, '') // strip Arabic diacritics
                    .replace(/\bال/g, '') // strip Arabic definite article "ال"
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();
            }

            function normalizeStoredTeacherMeta(key, entry) {
                const sourceName = String(entry?.sourceName || key || '').trim();
                const sourceDisplayName = String(entry?.sourceDisplayName || sourceName || '').trim();
                const teacherName = String(
                    entry?.teacherName || entry?.displayName || sourceDisplayName || sourceName || ''
                ).trim();
                return {
                    key: String(key || entry?.key || '').trim(),
                    teacherId: Number(entry?.teacherId) || null,
                    teacherName,
                    displayName: String(entry?.displayName || teacherName || sourceDisplayName || sourceName).trim(),
                    sourceName,
                    sourceDisplayName
                };
            }

            function getStoredTimetableTeacherEntries(data) {
                const entriesByKey = new Map();

                Object.entries(data?.teacherMetaByKey || {}).forEach(([key, entry]) => {
                    entriesByKey.set(key, normalizeStoredTeacherMeta(key, entry));
                });

                (Array.isArray(data?.teachers) ? data.teachers : []).forEach((entry) => {
                    const normalized = normalizeStoredTeacherMeta(entry?.key || entry?.name, entry);
                    if (normalized.key && !entriesByKey.has(normalized.key)) {
                        entriesByKey.set(normalized.key, normalized);
                    }
                });

                Object.keys(data?.timetables || {}).forEach((key) => {
                    if (!entriesByKey.has(key)) {
                        entriesByKey.set(
                            key,
                            normalizeStoredTeacherMeta(key, { key, sourceName: key, teacherName: key })
                        );
                    }
                });

                return Array.from(entriesByKey.values());
            }

            function getFallbackTeacherSections(teacherId, teacherName) {
                const byId = teacherId ? teacherSections[`id:${teacherId}`] : null;
                if (Array.isArray(byId) && byId.length) return byId;
                const byName = teacherSections[teacherName] || teacherSections[`name:${teacherName}`];
                return Array.isArray(byName) ? byName : [];
            }

            function resolveTeacherTimetableKeys(data, teacherId, teacherName) {
                const entries = getStoredTimetableTeacherEntries(data);
                const targetId = Number(teacherId) || null;
                const targetName = String(teacherName || '').trim();
                const normalizedTarget = normalizeName(targetName);
                const matchedKeys = [];

                const addMatches = (predicate) => {
                    entries.forEach((entry) => {
                        if (entry.key && predicate(entry)) matchedKeys.push(entry.key);
                    });
                    return [...new Set(matchedKeys)];
                };

                if (targetId) {
                    const byId = addMatches((entry) => entry.teacherId === targetId);
                    if (byId.length) return byId;
                }

                if (!targetName) return [];

                const fieldsForEntry = (entry) => [
                    entry.teacherName,
                    entry.displayName,
                    entry.sourceDisplayName,
                    entry.sourceName,
                    entry.key.replace(/^tafwij:/, '').replace(/_/g, ' ')
                ];

                const exact = addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => String(value || '').trim() === targetName)
                );
                if (exact.length) return exact;

                const normalized = addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => normalizeName(value) === normalizedTarget)
                );
                if (normalized.length) return normalized;

                return addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => {
                        const normalizedValue = normalizeName(value);
                        return (
                            normalizedValue &&
                            (normalizedValue.includes(normalizedTarget) || normalizedTarget.includes(normalizedValue))
                        );
                    })
                );
            }

            /**
             * Get the sections a teacher was scheduled to teach on a specific date,
             * reading from the timetable stored in localStorage.
             */
            function getSectionsForDay(teacherId, teacherName, dateStr, absencePeriod) {
                try {
                    const data = getTimetableData();
                    if (!data || !data.timetables) return getFallbackTeacherSections(teacherId, teacherName);

                    // Map JS getDay() → Arabic day name
                    const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const dayName = dayNames[dateObj.getDay()];

                    const teacherKeys = resolveTeacherTimetableKeys(data, teacherId, teacherName);

                    const sections = new Set();
                    teacherKeys.forEach((teacherKey) => {
                        const dayData = data.timetables?.[teacherKey]?.[dayName];
                        if (!dayData) return;
                        const periodEntries = getPeriodEntries(dayData, absencePeriod);
                        for (const [, hours] of periodEntries) {
                            if (!hours || typeof hours !== 'object') continue;
                            for (const lesson of Object.values(hours)) {
                                if (!lesson) continue;
                                const students = (lesson.students || '').trim();
                                if (students) {
                                    const baseClass = students.replace(/:[Gg]\d+$/g, '').trim();
                                    if (baseClass) sections.add(baseClass);
                                }
                            }
                        }
                    });

                    if (sections.size > 0) return [...sections].sort();
                    return getFallbackTeacherSections(teacherId, teacherName);
                } catch (e) {
                    console.warn('Error reading timetable for day filtering:', e);
                    return getFallbackTeacherSections(teacherId, teacherName);
                }
            }

            /**
             * Get the scheduled time periods for a teacher on a specific date.
             * Returns an array of period strings, e.g. ['08:00-09:00', '10:00-11:00']
             */
            function getScheduleForDay(teacherId, teacherName, dateStr, absencePeriod) {
                try {
                    const data = getTimetableData();
                    if (!data || !data.timetables) return [];

                    const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const dayName = dayNames[dateObj.getDay()];

                    const teacherKeys = resolveTeacherTimetableKeys(data, teacherId, teacherName);
                    if (!teacherKeys.length) return [];

                    // Period mapping: morning hours and afternoon hours have distinct time ranges
                    const morningHourMap = {
                        H1: '08:30-09:30', H2: '09:30-10:30', H3: '10:30-11:30', H4: '11:30-12:30',
                        h1: '08:30-09:30', h2: '09:30-10:30', h3: '10:30-11:30', h4: '11:30-12:30'
                    };
                    const afternoonHourMap = {
                        H1: '14:30-15:30', H2: '15:30-16:30', H3: '16:30-17:30', H4: '17:30-18:30',
                        h1: '14:30-15:30', h2: '15:30-16:30', h3: '16:30-17:30', h4: '17:30-18:30'
                    };

                    const periods = [];
                    teacherKeys.forEach((teacherKey) => {
                        const dayData = data.timetables?.[teacherKey]?.[dayName];
                        if (!dayData) return;
                        const periodEntries = getPeriodEntries(dayData, absencePeriod);
                        for (const [periodKey, hours] of periodEntries) {
                            if (!hours || typeof hours !== 'object') continue;
                            const hourMap = periodKey === 'morning' ? morningHourMap : afternoonHourMap;
                            const sortedKeys = Object.keys(hours).sort();
                            for (const h of sortedKeys) {
                                if (hours[h]) {
                                    periods.push(hourMap[h] || h);
                                }
                            }
                        }
                    });
                    return [...new Set(periods)];
                } catch (e) {
                    console.warn('Error reading schedule:', e);
                    return [];
                }
            }

            function getFilteredRecords() {
                const filterType = document.getElementById('filter-type').value;
                const filterDate = document.getElementById('filter-date').value;
                let filtered = allRecords;
                if (filterType) filtered = filtered.filter((r) => r.type === filterType);
                if (filterDate) filtered = filtered.filter((r) => r.attendance_date === filterDate);
                return filtered;
            }

            function renderAttPagination(totalRows, totalPages) {
                const container = document.getElementById('att-pagination');
                if (!container) return;
                if (totalPages <= 1) {
                    container.innerHTML = totalRows > 0
                        ? `<div class="support-pagination-info"><span><i class="fas fa-list-ol"></i> المجموع: ${totalRows}</span></div>`
                        : '';
                    return;
                }

                const maxVisible = 5;
                let startPage = Math.max(1, attCurrentPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);

                let pageButtons = '';
                if (startPage > 1) {
                    pageButtons += `<button class="support-page-btn" data-page="1">1</button>`;
                    if (startPage > 2) pageButtons += `<span class="support-page-ellipsis">…</span>`;
                }
                for (let i = startPage; i <= endPage; i++) {
                    pageButtons += `<button class="support-page-btn${i === attCurrentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
                }
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) pageButtons += `<span class="support-page-ellipsis">…</span>`;
                    pageButtons += `<button class="support-page-btn" data-page="${totalPages}">${totalPages}</button>`;
                }

                const startRecord = (attCurrentPage - 1) * ATT_PER_PAGE + 1;
                const endRecord = Math.min(attCurrentPage * ATT_PER_PAGE, totalRows);

                container.innerHTML = `
                    <div class="support-pagination-bar">
                        <button class="support-page-nav" id="atp-prev" ${attCurrentPage === 1 ? 'disabled' : ''}>
                            <i class="fas fa-chevron-right"></i> السابق
                        </button>
                        <div class="support-page-numbers">${pageButtons}</div>
                        <button class="support-page-nav" id="atp-next" ${attCurrentPage === totalPages ? 'disabled' : ''}>
                            التالي <i class="fas fa-chevron-left"></i>
                        </button>
                    </div>
                    <div class="support-pagination-info">
                        <span><i class="fas fa-eye"></i> ${startRecord}–${endRecord} من ${totalRows}</span>
                        <span><i class="fas fa-file-alt"></i> صفحة ${attCurrentPage} / ${totalPages}</span>
                    </div>
                `;
            }

            function renderTable() {
                const filtered = getFilteredRecords();
                const totalRows = filtered.length;
                const totalPages = Math.ceil(totalRows / ATT_PER_PAGE) || 1;
                attCurrentPage = Math.max(1, Math.min(attCurrentPage, totalPages));

                document.getElementById('records-count').textContent = totalRows;
                const tbody = document.getElementById('records-tbody');

                if (totalRows === 0) {
                    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">لا توجد سجلات مطابقة</td></tr>';
                    renderAttPagination(0, 0);
                    return;
                }

                const startIndex = (attCurrentPage - 1) * ATT_PER_PAGE;
                const pageRows = filtered.slice(startIndex, startIndex + ATT_PER_PAGE);

                tbody.innerHTML = pageRows
                    .map((r, i) => {
                        const isAbsence = r.type === 'absence';
                        const typeBadge = isAbsence
                            ? '<span class="type-badge absence"><i class="fas fa-user-minus"></i> غياب</span>'
                            : '<span class="type-badge late"><i class="fas fa-clock"></i> تأخر</span>';

                        // Absence period display
                        const absencePeriod = r.absence_period || 'full_day';
                        let periodHtml = '—';
                        if (isAbsence) {
                            const periodLabels = {
                                full_day: '<span class="period-badge full"><i class="fas fa-calendar-day"></i> يوم كامل</span>',
                                morning: '<span class="period-badge morning"><i class="fas fa-sun"></i> صباحا</span>',
                                afternoon: '<span class="period-badge afternoon"><i class="fas fa-moon"></i> مساءً</span>'
                            };
                            periodHtml = periodLabels[absencePeriod] || periodLabels.full_day;
                        }

                        let timeInfo = '—';
                        if (!isAbsence) {
                            const parts = [];
                            if (r.arrival_time) parts.push('الوصول: ' + escapeHtml(r.arrival_time));
                            if (r.late_duration) parts.push(r.late_duration + ' دقيقة');
                            timeInfo = parts.length ? parts.join(' · ') : '—';
                        } else if ((r.teacher_id || r.full_name) && r.attendance_date) {
                            const scheduleHours = getScheduleForDay(r.teacher_id, r.full_name, r.attendance_date, absencePeriod);
                            if (scheduleHours.length > 0) {
                                timeInfo = scheduleHours
                                    .map(
                                        (h) =>
                                            `<span class="section-tag" style="font-size: 11px;">${escapeHtml(h)}</span>`
                                    )
                                    .join('');
                            }
                        }

                        const teacherName = r.full_name;
                        let sectionsHtml = '—';
                        if (isAbsence && (r.teacher_id || teacherName) && r.attendance_date) {
                            const daySections = getSectionsForDay(r.teacher_id, teacherName, r.attendance_date, absencePeriod);
                            if (daySections.length > 0) {
                                sectionsHtml = daySections
                                    .map((s) => `<span class="section-tag">${escapeHtml(s)}</span>`)
                                    .join('');
                            }
                        }

                        return `
                    <tr>
                        <td>${startIndex + i + 1}</td>
                        <td>${typeBadge}</td>
                        <td><strong>${escapeHtml(r.full_name || '—')}</strong></td>
                        <td>${escapeHtml(r.subject || '—')}</td>
                        <td>${formatDate(r.attendance_date)}</td>
                        <td>${periodHtml}</td>
                        <td>${timeInfo}</td>
                        <td>${escapeHtml(r.reason || '—')}${r.notes ? '<br><small class="record-note"><i class="fas fa-sticky-note"></i>' + escapeHtml(r.notes) + '</small>' : ''}</td>
                        <td>${isAbsence ? sectionsHtml : '—'}</td>
                        <td style="white-space:nowrap">
                            <button class="delete-btn edit-action-btn" onclick="editRecord(${Number(r.id)})" title="تعديل">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="delete-btn" onclick="deleteRecord(${Number(r.id)})" title="حذف">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>`;
                    })
                    .join('');

                renderAttPagination(totalRows, totalPages);
            }

            function resetFormToAddMode() {
                document.getElementById('att-edit-id').value = '';
                document.getElementById('att-form').reset();
                document.getElementById('att-subject').value = '';
                document.getElementById('att-absence-period').value = 'full_day';
                document.getElementById('absence-period-field').classList.add('visible');
                document.querySelectorAll('.late-fields').forEach((f) => f.classList.remove('visible'));
                document.querySelectorAll('.type-toggle-btn').forEach((b) => b.classList.remove('active'));
                document.querySelector('.type-toggle-btn[data-type="absence"]').classList.add('active');
                document.getElementById('att-type').value = 'absence';
                document.getElementById('att-date').value = todayStr();
                document.getElementById('att-submit-btn').innerHTML = '<i class="fas fa-save"></i> حفظ';
                document.getElementById('att-cancel-edit-btn').style.display = 'none';
                document.querySelector('.attendance-form-header h3').textContent = 'تسجيل غياب أو تأخر';
            }

            function editRecord(id) {
                const record = allRecords.find((r) => Number(r.id) === id);
                if (!record) { showToast('لم يتم العثور على السجل', 'error'); return; }

                // Set edit ID
                document.getElementById('att-edit-id').value = id;

                // Set type toggle
                const type = record.type || 'absence';
                document.getElementById('att-type').value = type;
                document.querySelectorAll('.type-toggle-btn').forEach((b) => b.classList.remove('active'));
                document.querySelector(`.type-toggle-btn[data-type="${type}"]`)?.classList.add('active');

                // Show/hide fields based on type
                document.querySelectorAll('.late-fields').forEach((f) => f.classList.toggle('visible', type === 'late'));
                document.getElementById('absence-period-field').classList.toggle('visible', type === 'absence');

                // Fill subject & trigger teacher filter
                document.getElementById('att-subject').value = record.subject || '';
                const filterEvent = new Event('change');
                document.getElementById('att-subject').dispatchEvent(filterEvent);

                // filterTeachers() is synchronous — set teacher value immediately after it runs
                const teacherSelect = document.getElementById('att-teacher');
                const byId = record.teacher_id ? String(record.teacher_id) : null;
                if (byId && [...teacherSelect.options].some((o) => o.value === byId)) {
                    teacherSelect.value = byId;
                } else {
                    const nameOption = [...teacherSelect.options].find((o) => o.textContent === record.full_name);
                    if (nameOption) teacherSelect.value = nameOption.value;
                }

                // Fill other fields
                document.getElementById('att-date').value = record.attendance_date || todayStr();
                document.getElementById('att-reason').value = record.reason || '';
                document.getElementById('att-notes').value = record.notes || '';

                if (type === 'absence') {
                    document.getElementById('att-absence-period').value = record.absence_period || 'full_day';
                }
                if (type === 'late') {
                    document.getElementById('att-arrival-time').value = record.arrival_time || '';
                    document.getElementById('att-late-duration').value = record.late_duration || '';
                }

                // Update UI to edit mode
                document.getElementById('att-submit-btn').innerHTML = '<i class="fas fa-check"></i> تحديث';
                document.getElementById('att-cancel-edit-btn').style.display = '';
                document.querySelector('.attendance-form-header h3').textContent = 'تعديل السجل';

                // Scroll to form
                document.querySelector('.attendance-form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            async function saveRecord(e) {
                e.preventDefault();

                const teacherSelect = document.getElementById('att-teacher');
                const teacherValue = teacherSelect.value;
                if (!teacherValue) {
                    showToast('الرجاء اختيار أستاذ(ة)', 'error');
                    return;
                }

                const selectedOption = teacherSelect.options[teacherSelect.selectedIndex];
                const teacherName = selectedOption.textContent;
                const hasId = selectedOption.dataset.hasId === '1';

                const type = document.getElementById('att-type').value;
                const selectedSubject =
                    document.getElementById('att-subject').value || selectedOption.dataset.subject || '';
                const payload = {
                    teacher_id: hasId ? Number(teacherValue) : null,
                    teacher_name: teacherName,
                    subject: selectedSubject,
                    attendance_date: document.getElementById('att-date').value,
                    type: type,
                    reason: document.getElementById('att-reason').value,
                    notes: document.getElementById('att-notes').value.trim(),
                    school_year: year
                };

                if (type === 'absence') {
                    payload.absence_period = document.getElementById('att-absence-period').value || 'full_day';
                }

                if (type === 'late') {
                    payload.arrival_time = document.getElementById('att-arrival-time').value || null;
                    payload.late_duration = Number(document.getElementById('att-late-duration').value) || null;
                }

                const editId = document.getElementById('att-edit-id').value;
                let res;
                if (editId) {
                    payload.id = Number(editId);
                    res = await window.api.staffAttendance.update(payload);
                } else {
                    res = await window.api.staffAttendance.save(payload);
                }

                if (!res || res.success === false) {
                    showToast(res?.error || 'فشل الحفظ', 'error');
                    return;
                }

                showToast(editId ? 'تم التحديث بنجاح' : 'تم الحفظ بنجاح', 'success');
                _timetableCache = null; // invalidate cache in case timetable context changed
                resetFormToAddMode();
                attCurrentPage = 1;
                await loadRecords();
            }

            async function deleteRecord(id) {
                const { confirmed } = await showConfirm({
                    title: 'حذف السجل',
                    message: 'هل أنت متأكد من حذف هذا السجل؟',
                    detail: 'لا يمكن التراجع عن هذا الإجراء.',
                    type: 'danger',
                    confirmText: 'حذف نهائي',
                    cancelText: 'إلغاء',
                });
                if (!confirmed) return;
                const res = await window.api.staffAttendance.delete(id);
                if (!res || res.success === false) {
                    showToast('فشل الحذف', 'error');
                    return;
                }
                showToast('تم الحذف', 'success');
                attCurrentPage = 1;
                await loadRecords();
            }
        </script>
    </body>
</html>
