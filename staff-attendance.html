<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>الحضور والغياب | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        
    <link rel="stylesheet" href="css/tailwind-output.css">
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        <style>
            .date-wrap {
                display: flex;
                align-items: center;
                border: 1px solid var(--color-accent, #e8e8e8);
                border-radius: var(--radius-sm, 6px);
                overflow: hidden;
                transition: var(--transition-fast, 0.2s);
                background: var(--color-surface-alt, #f9fafb);
            }

            .date-wrap:focus-within {
                border-color: var(--color-primary, #3b6ac5);
                box-shadow: 0 0 0 3px var(--color-primary-mist, rgba(59, 106, 197, 0.15));
            }

            .date-wrap input[type="date"] {
                border: none !important;
                box-shadow: none !important;
                border-radius: 0;
                padding: 7px 8px;
                flex: 1;
                min-width: 0;
                font-size: 13px;
                background: transparent;
                color: var(--color-text-primary);
                font-family: var(--font-main);
                outline: none;
            }

            .date-sep {
                padding: 0 6px;
                font-size: 12px;
                color: var(--color-text-tertiary);
                white-space: nowrap;
                flex-shrink: 0;
                display: none;
                align-items: center;
                gap: 4px;
            }

            .date-sep.visible {
                display: flex;
            }

            .date-to-wrap {
                max-width: 0;
                overflow: hidden;
                transition: max-width 0.25s ease;
                display: flex;
                align-items: center;
                flex-shrink: 0;
            }

            .date-to-wrap.open {
                max-width: 160px;
            }

            .days-pill {
                font-size: 11px;
                font-weight: 500;
                background: #e6f1fb;
                color: #0c447c;
                padding: 2px 8px;
                border-radius: 20px;
                white-space: nowrap;
                display: none;
                margin-inline-start: 6px;
                flex-shrink: 0;
            }

            .days-pill.visible {
                display: inline-block;
            }
        </style>
        </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-clipboard-check"></i> الحضور والغياب</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container">
                <!-- ══ Add Record Form ══ -->
                <div class="attendance-form-card">
                    <div class="attendance-form-header">
                        <i class="fas fa-plus-circle"></i>
                        <h3>تسجيل غياب أو تأخر</h3>
                    </div>
                    <div class="attendance-form-body">
                        <form id="att-form">
                            <!-- Type Toggle -->
                            <div style="margin-bottom: 14px">
                                <label
                                    style="
                                        font-family: var(--font-main);
                                        font-size: 13px;
                                        font-weight: 600;
                                        color: var(--color-text-muted);
                                        margin-bottom: 6px;
                                        display: block;
                                    "
                                    >النوع</label
                                >
                                <div class="type-toggle">
                                    <button type="button" class="type-toggle-btn active" data-type="absence">
                                        <i class="fas fa-user-minus"></i> غياب
                                    </button>
                                    <button type="button" class="type-toggle-btn" data-type="late">
                                        <i class="fas fa-clock"></i> تأخر
                                    </button>
                                </div>
                                <input type="hidden" id="att-type" value="absence" />
                            </div>

                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="att-subject">المادة</label>
                                    <select id="att-subject">
                                        <option value="">-- كل المواد --</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="att-teacher">الأستاذ(ة)</label>
                                    <select id="att-teacher" required>
                                        <option value="">-- اختر أستاذ(ة) --</option>
                                    </select>
                                </div>

                                <!-- Absence Period (visible only for absence type) -->
                                <div class="absence-period-field" id="absence-period-field">
                                    <div class="form-group">
                                        <label for="att-absence-period">فترة الغياب</label>
                                        <select id="att-absence-period">
                                            <option value="full_day">اليوم كامل</option>
                                            <option value="morning">صباحا فقط (08:00 – 12:00)</option>
                                            <option value="afternoon">مساءً فقط (14:00 – 18:00)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group date-field-group">
                                    <label id="date-label">التاريخ</label>
                                    <div style="display:flex;align-items:center;gap:6px">
                                        <div class="date-wrap" style="flex:1">
                                            <input type="date" id="date-from" required />
                                            <span class="date-sep" id="date-sep">←</span>
                                            <div class="date-to-wrap" id="date-to-wrap">
                                                <input type="date" id="date-to" />
                                            </div>
                                        </div>
                                        <span class="days-pill" id="days-pill"></span>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="att-reason">السبب</label>
                                    <select id="att-reason">
                                        <option value="">-- اختر السبب --</option>
                                        <option value="رخصة">رخصة</option>
                                        <option value="تكوين">تكوين</option>
                                        <option value="لقاء تربوي">لقاء تربوي</option>
                                        <option value="إضراب">إضراب</option>
                                        <option value="بدون">بدون</option>
                                        <option value="أخرى">أخرى</option>
                                    </select>
                                </div>

                                <!-- Late-only fields -->
                                <div class="late-fields" id="late-fields">
                                    <div class="form-group">
                                        <label for="att-arrival-time">وقت الوصول</label>
                                        <input type="time" id="att-arrival-time" />
                                    </div>
                                </div>

                                <div class="late-fields" id="late-fields-duration">
                                    <div class="form-group">
                                        <label for="att-late-duration">مدة التأخر (بالدقائق)</label>
                                        <input
                                            type="number"
                                            id="att-late-duration"
                                            min="1"
                                            max="480"
                                            placeholder="مثال: 15"
                                        />
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="att-notes">ملاحظات</label>
                                    <input type="text" id="att-notes" placeholder="اختياري" />
                                </div>
                            </div>

                            <input type="hidden" id="att-edit-id" value="" />
                            <div class="form-actions">
                                <button type="submit" class="btn-primary" id="att-submit-btn"><i class="fas fa-save"></i> حفظ</button>
                                <button type="button" class="btn-secondary" id="att-cancel-edit-btn" style="display:none">
                                    <i class="fas fa-times"></i> إلغاء التعديل
                                </button>
                                <button type="reset" class="btn-secondary" id="reset-btn">
                                    <i class="fas fa-undo"></i> إعادة تعيين
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ══ Stat Cards ══ -->
                <div class="att-stats" id="stat-cards">
                    <div class="att-stat-card">
                        <div class="att-stat-icon absence"><i class="fas fa-user-minus"></i></div>
                        <div class="att-stat-body">
                            <h4 id="stat-absence">0</h4>
                            <p>حالة غياب</p>
                        </div>
                    </div>
                    <div class="att-stat-card">
                        <div class="att-stat-icon late"><i class="fas fa-clock"></i></div>
                        <div class="att-stat-body">
                            <h4 id="stat-late">0</h4>
                            <p>حالة تأخر</p>
                        </div>
                    </div>
                    <div class="att-stat-card">
                        <div class="att-stat-icon total"><i class="fas fa-clipboard-list"></i></div>
                        <div class="att-stat-body">
                            <h4 id="stat-total">0</h4>
                            <p>إجمالي السجلات</p>
                        </div>
                    </div>
                </div>

                <!-- ══ Records Table ══ -->
                <div class="att-section">
                    <div class="att-section-header">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>سجل الحضور والغياب</h3>
                        <span class="badge-count" id="records-count" role="status" aria-live="polite">0</span>
                        <div class="filter-bar">
                            <select id="filter-type">
                                <option value="">الكل</option>
                                <option value="absence">غياب</option>
                                <option value="late">تأخر</option>
                            </select>
                            <input type="date" id="filter-date" title="فلترة حسب التاريخ" />
                        </div>
                    </div>
                    <div class="att-table-scroll">
                    <table class="att-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>النوع</th>
                                <th>الأستاذ(ة)</th>
                                <th>المادة</th>
                                <th>التاريخ</th>
                                <th>الفترة</th>
                                <th>التوقيت / المدة</th>
                                <th>السبب</th>
                                <th>الأقسام المتضررة</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="records-tbody">
                            <tr class="empty-row">
                                <td colspan="10">لا توجد سجلات</td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                    <div class="support-pagination no-print" id="att-pagination"></div>
                </div>
            </div>
        </main>

        <script src="js/data/ma-education-labels.js"></script>
        <script src="js/shared/timetable-utils.js"></script>
        <script src="js/pages/staff-attendance.js"></script>
    </body>
</html>
