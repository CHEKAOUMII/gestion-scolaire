                                        <option value="">-- اختر السبب --</option>

                                        <option value="بدون">بدون</option>

        <script src="js/data/ma-education-labels.js"></script>
        <script>
            function escapeHtml(text) {
                if (text === null || text === undefined) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function todayStr() {
                const d = new Date();
                return (
                    d.getFullYear() +
                    '-' +
                    String(d.getMonth() + 1).padStart(2, '0') +
                    '-' +
                    String(d.getDate()).padStart(2, '0')
                );
            }

            /** Convert YYYY-MM-DD to dd/mm/yyyy */
            function formatDate(dateStr) {
                if (!dateStr) return '—';
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr;
                return parts[2] + '/' + parts[1] + '/' + parts[0];
            }

            const year = typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';
            let allRecords = [];
            let teachersList = [];
            let teacherSections = {};

            document.addEventListener('DOMContentLoaded', async () => {
                // Set today's date
                document.getElementById('att-date').value = todayStr();

                // Load teachers from grades table (primary source)
                try {
                    let result = await window.api.teachers.getFromGrades(year);
                    teachersList = Array.isArray(result) ? result : [];

                    // Fallback to teachers table
                    if (teachersList.length === 0) {
                        result = await window.api.teachers.getAll(year);
                        teachersList = Array.isArray(result) ? result : [];
                    }
                } catch (err) {
                    console.error('[Staff Attendance] Error loading teachers:', err);
                    // Try fallback
                    try {
                        const result = await window.api.teachers.getAll(year);
                        teachersList = Array.isArray(result) ? result : [];
                    } catch (e2) {
                        teachersList = [];
                    }
                }

                if (teachersList.length === 0) {
                    showToast('لم يتم العثور على أساتذة', 'warning');
                }

                // Build unique subjects list from teachers data (with normalization)
                const subjectsSet = new Set();
                teachersList.forEach((t) => {
                    if (t.subject) {
                        // subject may be comma-separated from GROUP_CONCAT
                        t.subject.split(',').forEach((s) => {
                            const trimmed = s.trim();
                            if (trimmed) {
                                const normalized =
                                    typeof normalizeSubjectName === 'function'
                                        ? normalizeSubjectName(trimmed)
                                        : trimmed;
                                if (normalized) subjectsSet.add(normalized);
                            }
                        });
                    }
                });
                const subjectSelect = document.getElementById('att-subject');
                [...subjectsSet]
                    .sort(typeof compareSubjects === 'function' ? compareSubjects : (a, b) => a.localeCompare(b, 'ar'))
                    .forEach((s) => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = s;
                        subjectSelect.appendChild(opt);
                    });

                // Filter teachers by selected subject
                const teacherSelect = document.getElementById('att-teacher');

                function filterTeachers() {
                    const selectedSubject = subjectSelect.value;
                    teacherSelect.innerHTML = '<option value="">-- اختر أستاذ(ة) --</option>';

                    const seen = new Set();
                    teachersList.forEach((t) => {
                        // Check if teacher teaches the selected subject (normalized)
                        if (selectedSubject) {
                            const subjects = (t.subject || '').split(',').map((s) => {
                                const trimmed = s.trim();
                                return typeof normalizeSubjectName === 'function'
                                    ? normalizeSubjectName(trimmed)
                                    : trimmed;
                            });
                            if (!subjects.includes(selectedSubject)) return;
                        }
                        // Deduplicate by name
                        if (seen.has(t.full_name)) return;
                        seen.add(t.full_name);

                        const opt = document.createElement('option');
                        opt.value = t.id || t.full_name;
                        opt.textContent = t.full_name;
                        opt.dataset.subject = selectedSubject || t.subject || '';
                        opt.dataset.hasId = t.id ? '1' : '0';
                        teacherSelect.appendChild(opt);
                    });
                }

                subjectSelect.addEventListener('change', filterTeachers);
                filterTeachers(); // Initial populate

                // Load teacher → sections mapping for affected sections display
                try {
                    const reportData = await window.api.dailyReport.getData(todayStr(), year);
                    if (reportData && reportData.teacherSections) {
                        teacherSections = reportData.teacherSections;
                    }
                } catch (e) {
                    console.warn('Could not load teacher sections:', e);
                }

                // Type toggle
                document.querySelectorAll('.type-toggle-btn').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.type-toggle-btn').forEach((b) => b.classList.remove('active'));
                        btn.classList.add('active');
                        const type = btn.dataset.type;
                        document.getElementById('att-type').value = type;
                        const lateFields = document.querySelectorAll('.late-fields');
                        lateFields.forEach((f) => {
                            f.classList.toggle('visible', type === 'late');
                        });
                    });
                });

                // Reset button
                document.getElementById('reset-btn').addEventListener('click', () => {
                    document.getElementById('att-subject').value = '';
                    filterTeachers();
                    document.querySelectorAll('.late-fields').forEach((f) => f.classList.remove('visible'));
                    document.querySelectorAll('.type-toggle-btn').forEach((b) => b.classList.remove('active'));
                    document.querySelector('.type-toggle-btn[data-type="absence"]').classList.add('active');
                    document.getElementById('att-type').value = 'absence';
                    document.getElementById('att-date').value = todayStr();
                });

                // Save form
                document.getElementById('att-form').addEventListener('submit', saveRecord);

                // Filters
                document.getElementById('filter-type').addEventListener('change', renderTable);
                document.getElementById('filter-date').addEventListener('change', renderTable);

                // Load records
                await loadRecords();
            });

            async function loadRecords() {
                allRecords = (await window.api.staffAttendance.getAll(year)) || [];
                updateStats();
                renderTable();
            }

            function updateStats() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                // Filter for current month
                const thisMonth = allRecords.filter((r) => {
                    if (!r.attendance_date) return false;
                    const d = new Date(r.attendance_date);
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                });

                const absences = thisMonth.filter((r) => r.type === 'absence').length;
                const lates = thisMonth.filter((r) => r.type === 'late').length;

                document.getElementById('stat-absence').textContent = absences;
                document.getElementById('stat-late').textContent = lates;
                document.getElementById('stat-total').textContent = allRecords.length;
            }

            /**
             * Normalize a name for fuzzy matching:
             * remove underscores, collapse whitespace, strip Arabic diacritics, trim
             */
            function normalizeName(name) {
                return (name || '')
                    .replace(/_/g, ' ')
                    .replace(/[\u064B-\u065F\u0670]/g, '') // strip Arabic diacritics
                    .replace(/\bال/g, '') // strip Arabic definite article "ال"
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();
            }

            function normalizeStoredTeacherMeta(key, entry) {
                const sourceName = String(entry?.sourceName || key || '').trim();
                const sourceDisplayName = String(entry?.sourceDisplayName || sourceName || '').trim();
                const teacherName = String(
                    entry?.teacherName || entry?.displayName || sourceDisplayName || sourceName || ''
                ).trim();
                return {
                    key: String(key || entry?.key || '').trim(),
                    teacherId: Number(entry?.teacherId) || null,
                    teacherName,
                    displayName: String(entry?.displayName || teacherName || sourceDisplayName || sourceName).trim(),
                    sourceName,
                    sourceDisplayName
                };
            }

            function getStoredTimetableTeacherEntries(data) {
                const entriesByKey = new Map();

                Object.entries(data?.teacherMetaByKey || {}).forEach(([key, entry]) => {
                    entriesByKey.set(key, normalizeStoredTeacherMeta(key, entry));
                });

                (Array.isArray(data?.teachers) ? data.teachers : []).forEach((entry) => {
                    const normalized = normalizeStoredTeacherMeta(entry?.key || entry?.name, entry);
                    if (normalized.key && !entriesByKey.has(normalized.key)) {
                        entriesByKey.set(normalized.key, normalized);
                    }
                });

                Object.keys(data?.timetables || {}).forEach((key) => {
                    if (!entriesByKey.has(key)) {
                        entriesByKey.set(
                            key,
                            normalizeStoredTeacherMeta(key, { key, sourceName: key, teacherName: key })
                        );
                    }
                });

                return Array.from(entriesByKey.values());
            }

            function getFallbackTeacherSections(teacherId, teacherName) {
                const byId = teacherId ? teacherSections[`id:${teacherId}`] : null;
                if (Array.isArray(byId) && byId.length) return byId;
                const byName = teacherSections[teacherName] || teacherSections[`name:${teacherName}`];
                return Array.isArray(byName) ? byName : [];
            }

            function resolveTeacherTimetableKeys(data, teacherId, teacherName) {
                const entries = getStoredTimetableTeacherEntries(data);
                const targetId = Number(teacherId) || null;
                const targetName = String(teacherName || '').trim();
                const normalizedTarget = normalizeName(targetName);
                const matchedKeys = [];

                const addMatches = (predicate) => {
                    entries.forEach((entry) => {
                        if (entry.key && predicate(entry)) matchedKeys.push(entry.key);
                    });
                    return [...new Set(matchedKeys)];
                };

                if (targetId) {
                    const byId = addMatches((entry) => entry.teacherId === targetId);
                    if (byId.length) return byId;
                }

                if (!targetName) return [];

                const fieldsForEntry = (entry) => [
                    entry.teacherName,
                    entry.displayName,
                    entry.sourceDisplayName,
                    entry.sourceName,
                    entry.key.replace(/^tafwij:/, '').replace(/_/g, ' ')
                ];

                const exact = addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => String(value || '').trim() === targetName)
                );
                if (exact.length) return exact;

                const normalized = addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => normalizeName(value) === normalizedTarget)
                );
                if (normalized.length) return normalized;

                return addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => {
                        const normalizedValue = normalizeName(value);
                        return (
                            normalizedValue &&
                            (normalizedValue.includes(normalizedTarget) || normalizedTarget.includes(normalizedValue))
                        );
                    })
                );
            }

            let _debugSectionsShown = false;

            /**
             * Get the sections a teacher was scheduled to teach on a specific date,
             * reading from the timetable stored in localStorage.
             */
            function getSectionsForDay(teacherId, teacherName, dateStr) {
                try {
                    const raw = localStorage.getItem('timetableData');
                    if (!raw) return getFallbackTeacherSections(teacherId, teacherName);
                    const data = JSON.parse(raw);
                    if (!data || !data.timetables) return getFallbackTeacherSections(teacherId, teacherName);

                    // Map JS getDay() → Arabic day name
                    const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const dayName = dayNames[dateObj.getDay()];

                    const teacherKeys = resolveTeacherTimetableKeys(data, teacherId, teacherName);

                    // Debug: show matching info once
                    if (!_debugSectionsShown) {
                        _debugSectionsShown = true;
                        const ttSample = getStoredTimetableTeacherEntries(data)
                            .slice(0, 5)
                            .map((entry) => ({ key: entry.key, teacherId: entry.teacherId, name: entry.teacherName }));
                        console.log(
                            '[Sections Debug]',
                            '\nTeacher from record:',
                            JSON.stringify(teacherName),
                            '\nTeacher ID:',
                            JSON.stringify(teacherId || null),
                            '\nDay:',
                            dayName,
                            '\nTimetable teachers (first 5):',
                            ttSample,
                            '\nMatches found:',
                            teacherKeys.length ? teacherKeys : 'NONE'
                        );
                    }

                    const sections = new Set();
                    teacherKeys.forEach((teacherKey) => {
                        const dayData = data.timetables?.[teacherKey]?.[dayName];
                        if (!dayData) return;
                        for (const hours of Object.values(dayData)) {
                            for (const lesson of Object.values(hours || {})) {
                                const students = (lesson.students || '').trim();
                                if (students) {
                                    const baseClass = students.replace(/:[Gg]\d+$/g, '').trim();
                                    if (baseClass) sections.add(baseClass);
                                }
                            }
                        }
                    });

                    if (sections.size > 0) return [...sections].sort();
                    return getFallbackTeacherSections(teacherId, teacherName);
                } catch (e) {
                    console.warn('Error reading timetable for day filtering:', e);
                    return getFallbackTeacherSections(teacherId, teacherName);
                }
            }

            /**
             * Get the scheduled time periods for a teacher on a specific date.
             * Returns an array of period strings, e.g. ['08:00-09:00', '10:00-11:00']
             */
            function getScheduleForDay(teacherId, teacherName, dateStr) {
                try {
                    const raw = localStorage.getItem('timetableData');
                    if (!raw) return [];
                    const data = JSON.parse(raw);
                    if (!data || !data.timetables) return [];

                    const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const dayName = dayNames[dateObj.getDay()];

                    const teacherKeys = resolveTeacherTimetableKeys(data, teacherId, teacherName);
                    if (!teacherKeys.length) return [];

                    // Period mapping from common FET hour names to display times
                    const periodMap = {
                        h1: '08:00-09:00',
                        h2: '09:00-10:00',
                        h3: '10:00-11:00',
                        h4: '11:00-12:00',
                        h5: '14:00-15:00',
                        h6: '15:00-16:00',
                        h7: '16:00-17:00',
                        h8: '17:00-18:00'
                    };

                    const periods = [];
                    teacherKeys.forEach((teacherKey) => {
                        const dayData = data.timetables?.[teacherKey]?.[dayName];
                        if (!dayData) return;
                        for (const hours of Object.values(dayData)) {
                            if (!hours || typeof hours !== 'object') continue;
                            const sortedKeys = Object.keys(hours).sort();
                            for (const h of sortedKeys) {
                                if (hours[h]) {
                                    periods.push(periodMap[h] || h);
                                }
                            }
                        }
                    });
                    return [...new Set(periods)];
                } catch (e) {
                    console.warn('Error reading schedule:', e);
                    return [];
                }
            }

            function renderTable() {
                const filterType = document.getElementById('filter-type').value;
                const filterDate = document.getElementById('filter-date').value;

                let filtered = allRecords;
                if (filterType) {
                    filtered = filtered.filter((r) => r.type === filterType);
                }
                if (filterDate) {
                    filtered = filtered.filter((r) => r.attendance_date === filterDate);
                }

                document.getElementById('records-count').textContent = filtered.length;
                const tbody = document.getElementById('records-tbody');

                if (filtered.length === 0) {
                    tbody.innerHTML = '<tr class="empty-row"><td colspan="9">لا توجد سجلات مطابقة</td></tr>';
                    return;
                }

                tbody.innerHTML = filtered
                    .map((r, i) => {
                        const isAbsence = r.type === 'absence';
                        const typeBadge = isAbsence
                            ? '<span class="type-badge absence"><i class="fas fa-user-minus"></i> غياب</span>'
                            : '<span class="type-badge late"><i class="fas fa-clock"></i> تأخر</span>';

                        let timeInfo = '—';
                        if (!isAbsence) {
                            const parts = [];
                            if (r.arrival_time) parts.push('الوصول: ' + escapeHtml(r.arrival_time));
                            if (r.late_duration) parts.push(r.late_duration + ' دقيقة');
                            timeInfo = parts.length ? parts.join(' · ') : '—';
                        } else if ((r.teacher_id || r.full_name) && r.attendance_date) {
                            // Show schedule hours from timetable for this day
                            const scheduleHours = getScheduleForDay(r.teacher_id, r.full_name, r.attendance_date);
                            if (scheduleHours.length > 0) {
                                timeInfo = scheduleHours
                                    .map(
                                        (h) =>
                                            `<span class="section-tag" style="font-size: 11px;">${escapeHtml(h)}</span>`
                                    )
                                    .join('');
                            }
                        }

                        // Affected sections — from timetable for that specific day only
                        const teacherName = r.full_name;
                        let sectionsHtml = '—';
                        if (isAbsence && (r.teacher_id || teacherName) && r.attendance_date) {
                            const daySections = getSectionsForDay(r.teacher_id, teacherName, r.attendance_date);
                            if (daySections.length > 0) {
                                sectionsHtml = daySections
                                    .map((s) => `<span class="section-tag">${escapeHtml(s)}</span>`)
                                    .join('');
                            }
                        }

                        return `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${typeBadge}</td>
                        <td><strong>${escapeHtml(r.full_name || '—')}</strong></td>
                        <td>${escapeHtml(r.subject || '—')}</td>
                        <td>${formatDate(r.attendance_date)}</td>
                        <td>${timeInfo}</td>
                        <td>${escapeHtml(r.reason || '—')}${r.notes ? `<div class="att-note-hint"><i class="fas fa-sticky-note"></i> ${escapeHtml(r.notes)}</div>` : ''}</td>
                        <td>${isAbsence ? sectionsHtml : '—'}</td>
                        <td>
                            <div class="att-action-group">
                                <button class="edit-btn" onclick="editRecord(${Number(r.id)})" title="تعديل">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="delete-btn" onclick="deleteRecord(${Number(r.id)})" title="حذف">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
                    })
                    .join('');
            }

            async function saveRecord(e) {
                e.preventDefault();

                const teacherSelect = document.getElementById('att-teacher');
                const teacherValue = teacherSelect.value;
                if (!teacherValue) {
                    showToast('الرجاء اختيار أستاذ(ة)', 'error');
                    return;
                }

                const selectedOption = teacherSelect.options[teacherSelect.selectedIndex];
                const teacherName = selectedOption.textContent;
                const hasId = selectedOption.dataset.hasId === '1';

                const type = document.getElementById('att-type').value;
                const selectedSubject =
                    document.getElementById('att-subject').value || selectedOption.dataset.subject || '';
                const payload = {
                    teacher_id: hasId ? Number(teacherValue) : null,
                    teacher_name: teacherName,
                    subject: selectedSubject,
                    attendance_date: document.getElementById('att-date').value,
                    type: type,
                    reason: document.getElementById('att-reason').value,
                    notes: document.getElementById('att-notes').value.trim(),
                    school_year: year
                };

                if (type === 'late') {
                    payload.arrival_time = document.getElementById('att-arrival-time').value || null;
                    payload.late_duration = Number(document.getElementById('att-late-duration').value) || null;
                }

                const res = await window.api.staffAttendance.save(payload);
                if (!res || res.success === false) {
                    showToast(res?.error || 'فشل الحفظ', 'error');
                    return;
                }

                showToast('تم الحفظ بنجاح', 'success');
                document.getElementById('att-form').reset();
                document.getElementById('att-subject').value = '';
                document.querySelectorAll('.late-fields').forEach((f) => f.classList.remove('visible'));
                document.querySelectorAll('.type-toggle-btn').forEach((b) => b.classList.remove('active'));
                document.querySelector('.type-toggle-btn[data-type="absence"]').classList.add('active');
                document.getElementById('att-type').value = 'absence';
                document.getElementById('att-date').value = todayStr();

                await loadRecords();
            }

            // ── Edit record ──
            function editRecord(id) {
                const record = allRecords.find(r => r.id === id);
                if (!record) return;

                document.getElementById('edit-id').value = record.id;
                document.getElementById('edit-type').value = record.type || 'absence';
                document.getElementById('edit-date').value = record.attendance_date || '';
                document.getElementById('edit-reason').value = record.reason || '';
                document.getElementById('edit-notes').value = record.notes || '';
                document.getElementById('edit-arrival-time').value = record.arrival_time || '';
                document.getElementById('edit-late-duration').value = record.late_duration || '';

                // Type toggle
                document.querySelectorAll('#edit-type-toggle .type-toggle-btn').forEach(b => b.classList.remove('active'));
                const activeTypeBtn = document.querySelector(`#edit-type-toggle .type-toggle-btn[data-type="${record.type || 'absence'}"]`);
                if (activeTypeBtn) activeTypeBtn.classList.add('active');

                // Show/hide late fields
                const isLate = record.type === 'late';
                document.getElementById('edit-late-fields').classList.toggle('visible', isLate);
                document.getElementById('edit-late-fields-duration').classList.toggle('visible', isLate);

                // Populate subjects in edit modal
                const editSubject = document.getElementById('edit-subject');
                editSubject.innerHTML = '<option value="">-- كل المواد --</option>';
                const subjectsSet = new Set();
                teachersList.forEach(t => {
                    if (t.subject) {
                        t.subject.split(',').forEach(s => {
                            const trimmed = s.trim();
                            if (trimmed) {
                                const normalized = typeof normalizeSubjectName === 'function' ? normalizeSubjectName(trimmed) : trimmed;
                                if (normalized) subjectsSet.add(normalized);
                            }
                        });
                    }
                });
                [...subjectsSet].sort(typeof compareSubjects === 'function' ? compareSubjects : (a, b) => a.localeCompare(b, 'ar')).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    editSubject.appendChild(opt);
                });
                editSubject.value = record.subject || '';

                // Populate teachers filtered by subject
                populateEditTeachers(editSubject.value);
                // Try to select the right teacher
                const editTeacher = document.getElementById('edit-teacher');
                if (record.teacher_id) {
                    editTeacher.value = String(record.teacher_id);
                } else {
                    // Find by name
                    for (const opt of editTeacher.options) {
                        if (opt.textContent === record.full_name) {
                            editTeacher.value = opt.value;
                            break;
                        }
                    }
                }

                document.getElementById('edit-modal').style.display = 'flex';
            }

            function populateEditTeachers(selectedSubject) {
                const editTeacher = document.getElementById('edit-teacher');
                const currentValue = editTeacher.value;
                editTeacher.innerHTML = '<option value="">-- اختر أستاذ(ة) --</option>';
                const seen = new Set();
                teachersList.forEach(t => {
                    if (selectedSubject) {
                        const subjects = (t.subject || '').split(',').map(s => {
                            const trimmed = s.trim();
                            return typeof normalizeSubjectName === 'function' ? normalizeSubjectName(trimmed) : trimmed;
                        });
                        if (!subjects.includes(selectedSubject)) return;
                    }
                    if (seen.has(t.full_name)) return;
                    seen.add(t.full_name);
                    const opt = document.createElement('option');
                    opt.value = t.id || t.full_name;
                    opt.textContent = t.full_name;
                    opt.dataset.subject = selectedSubject || t.subject || '';
                    opt.dataset.hasId = t.id ? '1' : '0';
                    editTeacher.appendChild(opt);
                });
                // Restore previous selection if still valid
                let found = false;
                for (const opt of editTeacher.options) {
                    if (opt.value === currentValue) { found = true; break; }
                }
                editTeacher.value = found ? currentValue : '';
            }

            function closeEditModal() {
                document.getElementById('edit-modal').style.display = 'none';
            }

            // Edit modal events
            document.getElementById('edit-modal-close').addEventListener('click', closeEditModal);
            document.getElementById('edit-cancel-btn').addEventListener('click', closeEditModal);
            document.getElementById('edit-modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeEditModal();
            });

            // Edit type toggle
            document.querySelectorAll('#edit-type-toggle .type-toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#edit-type-toggle .type-toggle-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const type = btn.dataset.type;
                    document.getElementById('edit-type').value = type;
                    document.getElementById('edit-late-fields').classList.toggle('visible', type === 'late');
                    document.getElementById('edit-late-fields-duration').classList.toggle('visible', type === 'late');
                });
            });

            // Edit subject change → filter teachers
            document.getElementById('edit-subject').addEventListener('change', function() {
                populateEditTeachers(this.value);
            });

            // Save edit
            document.getElementById('edit-save-btn').addEventListener('click', async () => {
                const editTeacher = document.getElementById('edit-teacher');
                if (!editTeacher.value) {
                    showToast('الرجاء اختيار أستاذ(ة)', 'error');
                    return;
                }
                const selectedOption = editTeacher.options[editTeacher.selectedIndex];
                const hasId = selectedOption.dataset.hasId === '1';
                const type = document.getElementById('edit-type').value;
                const selectedSubject = document.getElementById('edit-subject').value || selectedOption.dataset.subject || '';

                const payload = {
                    id: Number(document.getElementById('edit-id').value),
                    teacher_id: hasId ? Number(editTeacher.value) : null,
                    teacher_name: selectedOption.textContent,
                    subject: selectedSubject,
                    attendance_date: document.getElementById('edit-date').value,
                    type: type,
                    reason: document.getElementById('edit-reason').value,
                    notes: document.getElementById('edit-notes').value.trim(),
                    school_year: year
                };

                if (type === 'late') {
                    payload.arrival_time = document.getElementById('edit-arrival-time').value || null;
                    payload.late_duration = Number(document.getElementById('edit-late-duration').value) || null;
                }

                const res = await window.api.staffAttendance.update(payload);
                if (!res || res.success === false) {
                    showToast(res?.error || 'فشل التعديل', 'error');
                    return;
                }

                showToast('تم تعديل السجل بنجاح', 'success');
                closeEditModal();
                await loadRecords();
            });

            // ── Delete record ──
            async function deleteRecord(id) {
                const record = allRecords.find(r => r.id === id);
                const teacherName = record ? (record.full_name || 'هذا الأستاذ') : 'هذا الأستاذ';
                const dateStr = record ? formatDate(record.attendance_date) : '';
                const { confirmed } = await showConfirm({
                    title: 'حذف سجل الحضور',
                    message: `سيتم حذف سجل ${record?.type === 'late' ? 'التأخر' : 'الغياب'} بتاريخ ${dateStr} الخاص بـ ${teacherName}.`,
                    detail: 'لا يمكن التراجع بعد الحذف.',
                    type: 'danger',
                    confirmText: 'حذف'
                });
                if (!confirmed) return;
                const res = await window.api.staffAttendance.delete(id);
                if (!res || res.success === false) {
                    showToast('فشل الحذف', 'error');
                    return;
                }
                showToast('تم الحذف', 'success');
                await loadRecords();
            }
        </script>
    </body>
</html>
