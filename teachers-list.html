<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>بطاقات الأساتذة | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        <script src="js/print-system.js" defer></script>
    </head>

    <body class="teachers-page">
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-id-card-alt"></i> بطاقات الأساتذة</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container teachers-page-shell">
                <!-- Stats Row -->
                <div class="staff-stats-row animate-in">
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-total">-</div>
                        <div class="stat-label">مجموع الأساتذة</div>
                    </div>
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-agent">-</div>
                        <div class="stat-label">من ملف الوزارة</div>
                    </div>
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-male">-</div>
                        <div class="stat-label">ذكور</div>
                    </div>
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-female">-</div>
                        <div class="stat-label">إناث</div>
                    </div>
                    <button
                        class="staff-stat-card surplus"
                        id="stat-surplus-card"
                        type="button"
                        title="عرض الأساتذة الفائضين فقط"
                        aria-pressed="false"
                    >
                        <div class="stat-value" id="stat-surplus">-</div>
                        <div class="stat-label">⚠️ الفائضون</div>
                    </button>
                </div>

                <!-- Add/Edit Form -->
                <div class="gs-form-section">
                    <div class="gs-form-header">
                        <i class="fas fa-plus-circle"></i> <span id="form-title">إضافة أستاذ</span>
                    </div>
                    <form id="teacher-form" class="gs-form-grid">
                        <input type="hidden" id="teacher-id" />
                        <div class="gs-form-group">
                            <label for="teacher-name">الاسم الكامل *</label>
                            <input id="teacher-name" class="gs-field-control" placeholder="الاسم الكامل" required />
                        </div>
                        <div class="gs-form-group">
                            <label for="teacher-subject">المادة</label>
                            <input id="teacher-subject" class="gs-field-control" placeholder="المادة" />
                        </div>
                        <div class="gs-form-group">
                            <label for="teacher-phone">الهاتف</label>
                            <input id="teacher-phone" class="gs-field-control" placeholder="الهاتف" />
                        </div>
                        <div class="gs-form-group">
                            <label for="teacher-email">البريد الإلكتروني</label>
                            <input
                                id="teacher-email"
                                class="gs-field-control"
                                placeholder="البريد الإلكتروني"
                                type="email"
                            />
                        </div>
                        <div class="gs-form-actions">
                            <button class="btn btn-success" type="submit"><i class="fas fa-save"></i> حفظ</button>
                            <button class="btn btn-secondary" type="button" id="cancel-edit" hidden>إلغاء</button>
                        </div>
                    </form>
                </div>

                <!-- Teachers Table — gs-preview-section style -->
                <div class="gs-preview-section">
                    <div class="gs-preview-header gs-preview-header-wrap">
                        <h3 class="gs-preview-title">
                            <i class="fas fa-table"></i>
                            لائحة الأساتذة
                            <span class="gs-count-badge" id="staff-counter">0</span>
                        </h3>
                        <div class="staff-toolbar">
                            <input
                                type="text"
                                class="search-input"
                                id="search-input"
                                placeholder="بحث بالاسم أو ر.ت أو المادة..."
                            />
                            <select id="filter-gender">
                                <option value="">كل الأنواع</option>
                                <option value="ذكور">ذكور</option>
                                <option value="إناث">إناث</option>
                            </select>
                            <select id="filter-subject">
                                <option value="">كل التخصصات</option>
                            </select>
                            <select id="filter-cadre">
                                <option value="">كل الأطر</option>
                            </select>
                            <select id="filter-source">
                                <option value="">كل المصادر</option>
                                <option value="agent_xml">ملف الوزارة</option>
                                <option value="fet">FET</option>
                                <option value="manual">يدوي</option>
                            </select>
                            <select id="filter-fonction">
                                <option value="">كل الوظائف</option>
                                <option value="تدريس">تدريس</option>
                                <option value="غير تدريس">غير تدريس</option>
                            </select>
                            <button
                                class="btn btn-success ux-print-preview-btn teachers-print-btn"
                                id="btn-print"
                                title="معاينة الطباعة"
                            >
                                <i class="fas fa-eye"></i> معاينة
                            </button>
                        </div>
                    </div>

                    <div class="gs-preview-body">
                        <div class="staff-table-wrap">
                            <table class="staff-table" id="staff-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>ر.ت</th>
                                        <th>الاسم الكامل</th>
                                        <th>المادة</th>
                                        <th>الإطار</th>
                                        <th>الدرجة</th>
                                        <th>الرتبة</th>
                                        <th>الهاتف</th>
                                        <th>المصدر</th>
                                        <th class="col-actions">إجراء</th>
                                    </tr>
                                </thead>
                                <tbody id="teachers-tbody"></tbody>
                            </table>
                        </div>
                        <div id="teachers-pagination" class="sl-pagination teachers-pagination"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Detail Drawer -->
        <div class="detail-overlay" id="detail-overlay" aria-hidden="true">
            <div class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-name">
                <div class="detail-header">
                    <button class="close-detail" id="close-detail" title="إغلاق" aria-label="إغلاق تفاصيل الأستاذ">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="teacher-avatar"><i class="fas fa-user"></i></div>
                    <h3 class="teacher-main-name" id="detail-name">-</h3>
                    <div class="teacher-sub-name" id="detail-name-fr"></div>
                </div>
                <div class="detail-body" id="detail-body">
                    <!-- Filled by JS -->
                </div>
            </div>
        </div>

        <script src="js/data/ma-education-labels.js"></script>
        <script src="js/pages/teachers-list.js" defer></script>
    </body>
</html>
