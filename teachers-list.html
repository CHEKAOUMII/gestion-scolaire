<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الأساتذة | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/utils.js" defer></script>
    <script src="js/sidebar.js" defer></script>
    <script src="js/ux-enhancements.js" defer></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar">
        <!-- Sidebar will be injected by sidebar.js -->
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title"><i class="fas fa-users"></i> قائمة الأساتذة</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="theme-toggle" id="shortcuts-btn" title="اختصارات لوحة المفاتيح (?)">
                    <i class="fas fa-keyboard"></i>
                </button>
            </div>
        </header>

        <div class="grades-container">
            <div class="search-section">
                <h3>إضافة/تعديل أستاذ</h3>
                <form id="teacher-form" class="search-form"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                    <input type="hidden" id="teacher-id">
                    <input id="teacher-name" placeholder="الاسم الكامل" required>
                    <input id="teacher-subject" placeholder="المادة">
                    <input id="teacher-phone" placeholder="الهاتف">
                    <input id="teacher-email" placeholder="البريد الإلكتروني">
                    <button class="btn btn-success" type="submit">???</button>
                    <button class="btn btn-secondary" type="button" id="cancel-edit"
                        style="display: none;">إلغاء</button>
                </form>
            </div>

            <div class="students-results">
                <h3>لائحة الأساتذة</h3>
                <div class="table-responsive">
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الاسم</th>
                                <th>المادة</th>
                                <th>الهاتف</th>
                                <th>البريد</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="teachers-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const year = '2025/2026';
        let teachers = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadTeachers();
            setupForm();
        });

        async function loadTeachers() {
            teachers = await window.api.teachers.getAll(year) || [];
            renderTeachers();
        }

        function renderTeachers() {
            const tbody = document.getElementById('teachers-tbody');
            if (!teachers.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="padding: 20px; text-align: center;">لا توجد بيانات</td></tr>';
                return;
            }
            tbody.innerHTML = teachers.map((t, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${t.full_name || '-'}</td>
                    <td>${t.subject || '-'}</td>
                    <td>${t.phone || '-'}</td>
                    <td>${t.email || '-'}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="editTeacher(${t.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="deleteTeacher(${t.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function setupForm() {
            document.getElementById('teacher-form').addEventListener('submit', async e => {
                e.preventDefault();
                const id = document.getElementById('teacher-id').value;
                const payload = {
                    full_name: document.getElementById('teacher-name').value.trim(),
                    subject: document.getElementById('teacher-subject').value.trim(),
                    phone: document.getElementById('teacher-phone').value.trim(),
                    email: document.getElementById('teacher-email').value.trim(),
                    school_year: year,
                    active: 1
                };
                let res = id ? await window.api.teachers.update(Number(id), payload) : await window.api.teachers.add(payload);
                if (!res || res.success === false) {
                    showToast('???: ' + (res?.error || 'save failed'), 'error');
                    return;
                }
                showToast('تم الحفظ', 'success');
                clearForm();
                await loadTeachers();
            });
            document.getElementById('cancel-edit').addEventListener('click', clearForm);
        }

        function editTeacher(id) {
            const t = teachers.find(x => x.id === id);
            if (!t) return;
            document.getElementById('teacher-id').value = t.id;
            document.getElementById('teacher-name').value = t.full_name || '';
            document.getElementById('teacher-subject').value = t.subject || '';
            document.getElementById('teacher-phone').value = t.phone || '';
            document.getElementById('teacher-email').value = t.email || '';
            document.getElementById('cancel-edit').style.display = 'inline-flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteTeacher(id) {
            if (!confirm('حذف الأستاذ؟')) return;
            const res = await window.api.teachers.delete(id);
            if (!res || res.success === false) {
                showToast('فشل الحذف', 'error');
                return;
            }
            showToast('تم الحذف', 'success');
            await loadTeachers();
        }

        function clearForm() {
            document.getElementById('teacher-form').reset();
            document.getElementById('teacher-id').value = '';
            document.getElementById('cancel-edit').style.display = 'none';
        }
    </script>
</body>

</html>
