<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>بطاقات الأساتذة | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        
    <link rel="stylesheet" href="css/tailwind-output.css">
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js"></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                    <h2 class="page-title"><i class="fas fa-id-card-alt"></i> بطاقات الأساتذة</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container">
                <!-- Stats Row -->
                <div class="staff-stats-row animate-in">
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-total">-</div>
                        <div class="stat-label">مجموع الأساتذة</div>
                    </div>
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-agent">-</div>
                        <div class="stat-label">من ملف الوزارة</div>
                    </div>
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-male">-</div>
                        <div class="stat-label">ذكور</div>
                    </div>
                    <div class="staff-stat-card">
                        <div class="stat-value" id="stat-female">-</div>
                        <div class="stat-label">إناث</div>
                    </div>
                    <div class="staff-stat-card surplus" id="stat-surplus-card" title="انقر لعرض الفائضين فقط">
                        <div class="stat-value" id="stat-surplus">-</div>
                        <div class="stat-label">⚠️ الفائضون</div>
                    </div>
                </div>

                <!-- Add/Edit Form -->
                <div class="staff-form-section animate-in animate-in-delay-1">
                    <h3><i class="fas fa-plus-circle"></i> <span id="form-title">إضافة أستاذ</span></h3>
                    <form id="teacher-form">
                        <input type="hidden" id="teacher-id" />
                        <div class="staff-form-grid">
                            <input id="teacher-name" placeholder="الاسم الكامل *" required />
                            <input id="teacher-subject" placeholder="المادة" />
                            <input id="teacher-phone" placeholder="الهاتف" />
                            <input id="teacher-email" placeholder="البريد الإلكتروني" type="email" />
                        </div>
                        <div class="staff-form-actions">
                            <button class="btn btn-success" type="submit"><i class="fas fa-save"></i> حفظ</button>
                            <button class="btn btn-secondary" type="button" id="cancel-edit" style="display: none">
                                إلغاء
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Toolbar -->
                <div class="students-results animate-in animate-in-delay-2">
                    <h3><i class="fas fa-table"></i> لائحة الأساتذة</h3>
                    <div class="staff-toolbar">
                        <input
                            type="text"
                            class="search-input"
                            id="search-input"
                            placeholder="بحث بالاسم أو ر.ت أو المادة..."
                        />
                        <select id="filter-gender">
                            <option value="">كل الأنواع</option>
                            <option value="ذكور">ذكور</option>
                            <option value="إناث">إناث</option>
                        </select>
                        <select id="filter-subject">
                            <option value="">كل التخصصات</option>
                        </select>
                        <select id="filter-cadre">
                            <option value="">كل الأطر</option>
                        </select>
                        <select id="filter-source">
                            <option value="">كل المصادر</option>
                            <option value="agent_xml">ملف الوزارة</option>
                            <option value="fet">FET</option>
                            <option value="manual">يدوي</option>
                        </select>
                        <select id="filter-fonction">
                            <option value="">كل الوظائف</option>
                            <option value="تدريس">تدريس</option>
                            <option value="غير تدريس">غير تدريس</option>
                        </select>
                        <button class="btn btn-success" id="btn-print" title="معاينة الطباعة" style="padding: 8px 14px; white-space: nowrap;">
                            <i class="fas fa-eye"></i> معاينة الطباعة
                        </button>
                        <span class="staff-counter" id="staff-counter"></span>
                    </div>

                    <!-- Table -->
                    <div class="staff-table-wrap">
                        <table class="staff-table" id="staff-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>ر.ت</th>
                                    <th>الاسم الكامل</th>
                                    <th>المادة</th>
                                    <th>الإطار</th>
                                    <th>الدرجة</th>
                                    <th>الرتبة</th>
                                    <th>الهاتف</th>
                                    <th>المصدر</th>
                                    <th class="col-actions">إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="teachers-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Detail Drawer -->
        <div class="detail-overlay" id="detail-overlay">
            <div class="detail-panel" id="detail-panel">
                <div class="detail-header">
                    <button class="close-detail" id="close-detail" title="إغلاق"><i class="fas fa-times"></i></button>
                    <div class="teacher-avatar"><i class="fas fa-user"></i></div>
                    <div class="teacher-main-name" id="detail-name">-</div>
                    <div class="teacher-sub-name" id="detail-name-fr"></div>
                </div>
                <div class="detail-body" id="detail-body">
                    <!-- Filled by JS -->
                </div>
            </div>
        </div>

        <script src="js/data/ma-education-labels.js"></script>
        <script src="js/utils.js"></script>
        <script>
            const year = typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';
            let teachers = [];
            let filtered = [];

            document.addEventListener('DOMContentLoaded', async () => {
                await loadTeachers();
                setupForm();
                setupFilters();
                setupDetailPanel();
                document.getElementById('btn-print')?.addEventListener('click', () => {
                    // Build custom print content with simplified table
                    let printDiv = document.getElementById('teachers-print-content');
                    if (!printDiv) {
                        printDiv = document.createElement('div');
                        printDiv.id = 'teachers-print-content';
                        printDiv.style.display = 'none';
                        document.body.appendChild(printDiv);
                    }
                    const list = filtered && filtered.length ? filtered : teachers;
                    let rows = '';
                    list.forEach((t, i) => {
                        rows += `<tr>
                            <td style="text-align:center; padding:8px 6px; border:1px solid #bbb;">${i + 1}</td>
                            <td style="text-align:center; padding:8px 6px; border:1px solid #bbb;">${esc(t.ppr || '')}</td>
                            <td style="padding:8px 10px; border:1px solid #bbb; font-weight:600;">${esc(t.full_name || '')}</td>
                            <td style="text-align:center; padding:8px 6px; border:1px solid #bbb;">${esc(t.phone || '-')}</td>
                            <td style="padding:8px 6px; border:1px solid #bbb; min-width:110px;"></td>
                        </tr>`;
                    });
                    printDiv.innerHTML = `
                        <table style="width:100%; border-collapse:collapse; font-family:'Cairo','Segoe UI',sans-serif; font-size:13px; direction:rtl;">
                            <thead>
                                <tr style="background:#3B6AC5; color:#fff;">
                                    <th style="padding:10px 6px; border:1px solid #3B6AC5; width:40px;">#</th>
                                    <th style="padding:10px 6px; border:1px solid #3B6AC5; width:90px;">ر.ت</th>
                                    <th style="padding:10px 6px; border:1px solid #3B6AC5;">الاسم الكامل</th>
                                    <th style="padding:10px 6px; border:1px solid #3B6AC5; width:110px;">رقم الهاتف</th>
                                    <th style="padding:10px 6px; border:1px solid #3B6AC5; width:120px;">التوقيع</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    `;
                    printDiv.style.display = 'block';
                    openPrintPreview({ contentSelector: '#teachers-print-content', title: 'لائحة الادارة التربوية', pageSize: 'A4' });
                    // Hide after openPrintPreview clones it (300ms internal delay)
                    setTimeout(() => { printDiv.style.display = 'none'; }, 500);
                });
            });

            async function loadTeachers() {
                const result = await window.api.teachers.getAll(year);
                console.log('[DEBUG] getSchoolYear:', year, 'getAll result:', result);
                teachers = Array.isArray(result) ? result : [];
                // Debug: show unique position/statut values
                const positions = [...new Set(teachers.map((t) => t.position).filter(Boolean))];
                const statuts = [...new Set(teachers.map((t) => t.statut).filter(Boolean))];
                console.log('[DEBUG-SURPLUS] Unique positions:', positions);
                console.log('[DEBUG-SURPLUS] Unique statuts:', statuts);
                console.log('[DEBUG-SURPLUS] Surplus count:', teachers.filter(isSurplusTeacher).length);
                populateDropdowns();
                applyFilters();
                updateStats();
            }

            function isSurplusTeacher(t) {
                if (Number(t.is_surplus) === 1) return true;
                const pos = (t.position || '').toLowerCase();
                const stat = (t.statut || '').toLowerCase();
                const func = (t.function_title || '').toLowerCase();
                const combined = `${pos} ${stat} ${func}`;
                return (
                    combined.includes('surnombre') ||
                    combined.includes('excédentaire') ||
                    combined.includes('excedentaire') ||
                    combined.includes('فائض')
                );
            }

            function updateStats() {
                const el = (id, v) => {
                    const e = document.getElementById(id);
                    if (e) e.textContent = v;
                };
                el('stat-total', teachers.length);
                el('stat-agent', teachers.filter((t) => t.source === 'agent_xml').length);
                el(
                    'stat-male',
                    teachers.filter((t) => (t.gender || '').includes('1') || (t.gender || '').includes('ذكر')).length
                );
                el(
                    'stat-female',
                    teachers.filter((t) => (t.gender || '').includes('2') || (t.gender || '').includes('أنثى')).length
                );
                const surplusCount = teachers.filter(isSurplusTeacher).length;
                el('stat-surplus', surplusCount);
                // Wire click: show only surplus teachers
                const surplusCard = document.getElementById('stat-surplus-card');
                if (surplusCard) {
                    surplusCard.onclick = () => {
                        filtered = teachers.filter(isSurplusTeacher);
                        renderTeachers();
                        const counter = document.getElementById('staff-counter');
                        if (counter) counter.textContent = `${filtered.length} / ${teachers.length} أستاذ (فائضون)`;
                    };
                }
            }

            function populateDropdowns() {
                // Populate Cadre
                const selectCadre = document.getElementById('filter-cadre');
                const cadres = [...new Set(teachers.map((t) => t.cadre).filter(Boolean))].sort();
                selectCadre.innerHTML = '<option value="">كل الأطر</option>';
                cadres.forEach((c) => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = typeof translateCadre === 'function' ? translateCadre(c) : c;
                    selectCadre.appendChild(opt);
                });

                // Populate Subject — prefer specialty_subject, fallback to subject
                const selectSubject = document.getElementById('filter-subject');
                const subjectSet = new Set();
                teachers.forEach((t) => {
                    const raw = t.specialty_subject || t.subject;
                    if (!raw) return;
                    const label = typeof translateSubject === 'function' ? translateSubject(raw) : raw;
                    if (label) subjectSet.add(label);
                });
                const subjects = [...subjectSet].sort(compareSubjects);
                selectSubject.innerHTML = '<option value="">كل التخصصات</option>';
                subjects.forEach((s) => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    selectSubject.appendChild(opt);
                });
            }

            function setupFilters() {
                document.getElementById('search-input').addEventListener('input', applyFilters);
                document.getElementById('filter-cadre').addEventListener('change', applyFilters);
                document.getElementById('filter-source').addEventListener('change', applyFilters);
                document.getElementById('filter-gender').addEventListener('change', applyFilters);
                document.getElementById('filter-subject').addEventListener('change', applyFilters);
                document.getElementById('filter-fonction').addEventListener('change', applyFilters);
            }

            /**
             * Check whether a teacher is in a "teaching" role based on function_title.
             * Teaching roles: مدرس / Enseignant (E001) and مدرس فائض / Enseignant en surnombre (E002).
             */
            function isTeachingRole(t) {
                const fn = (t.function_title || '').toLowerCase();
                return (
                    fn.includes('مدرس') ||
                    fn.includes('enseignant') ||
                    fn.includes('surnombre') ||
                    fn.includes('فائض')
                );
            }

            function applyFilters() {
                const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
                const cadre = document.getElementById('filter-cadre')?.value || '';
                const source = document.getElementById('filter-source')?.value || '';
                const genderVal = document.getElementById('filter-gender')?.value || '';
                const subject = document.getElementById('filter-subject')?.value || '';
                const fonction = document.getElementById('filter-fonction')?.value || '';

                filtered = teachers.filter((t) => {
                    if (q) {
                        const haystack = [
                            t.full_name,
                            t.full_name_fr,
                            t.ppr,
                            t.subject,
                            t.specialty_subject,
                            t.phone,
                            t.cin
                        ]
                            .join(' ')
                            .toLowerCase();
                        if (!haystack.includes(q)) return false;
                    }
                    if (cadre && t.cadre !== cadre) return false;
                    if (source && t.source !== source) return false;
                    if (subject) {
                        // Match against translated specialty_subject OR subject
                        const raw = t.specialty_subject || t.subject;
                        const label = typeof translateSubject === 'function' ? translateSubject(raw) : raw;
                        if (label !== subject) return false;
                    }
                    if (genderVal) {
                        const isMale = (t.gender || '').includes('ذكر') || (t.gender || '').includes('1');
                        const isFemale = (t.gender || '').includes('أنثى') || (t.gender || '').includes('2');
                        if (genderVal === 'ذكور' && !isMale) return false;
                        if (genderVal === 'إناث' && !isFemale) return false;
                    }
                    if (fonction) {
                        const teaching = isTeachingRole(t);
                        if (fonction === 'تدريس' && !teaching) return false;
                        if (fonction === 'غير تدريس' && teaching) return false;
                    }
                    return true;
                });

                renderTeachers();
                const counter = document.getElementById('staff-counter');
                if (counter) counter.textContent = `${filtered.length} / ${teachers.length} أستاذ`;
            }

            function esc(v) {
                return String(v ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function sourceLabel(src) {
                if (src === 'agent_xml') return '<span class="badge badge-source badge-source-agent">الوزارة</span>';
                if (src === 'fet') return '<span class="badge badge-source badge-source-fet">FET</span>';
                return '<span class="badge badge-source badge-source-manual">يدوي</span>';
            }

            function renderTeachers() {
                const tbody = document.getElementById('teachers-tbody');
                if (!filtered.length) {
                    tbody.innerHTML = `
                    <tr><td colspan="10">
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <p>لا توجد بيانات بخصوص معايير البحث المحددة</p>
                        </div>
                    </td></tr>`;
                    return;
                }
                tbody.innerHTML = filtered
                    .map((t, i) => {
                        // عرض مادة التخصص من DB أو ترجمتها مباشرةً
                        const specRaw = t.specialty_subject || t.subject;
                        const specDisplay = specRaw
                            ? typeof translateSubject === 'function'
                                ? translateSubject(specRaw)
                                : specRaw
                            : '-';
                        const cadreDisplay = t.cadre
                            ? typeof translateCadre === 'function'
                                ? translateCadre(t.cadre)
                                : t.cadre
                            : '-';
                        const gradeDisplay = t.grade
                            ? typeof translateGrade === 'function'
                                ? translateGrade(t.grade)
                                : t.grade
                            : '-';
                        const genderIcon =
                            t.gender && (t.gender.includes('2') || t.gender.includes('أنثى'))
                                ? '&nbsp;<i class="fas fa-venus" style="color:#e83e8c;font-size:0.8em;"></i>'
                                : t.gender
                                  ? '&nbsp;<i class="fas fa-mars" style="color:#0d6efd;font-size:0.8em;"></i>'
                                  : '';
                        return `
                <tr onclick="showDetail(${t.id})" title="انقر لعرض التفاصيل" class="teacher-row">
                    <td>${i + 1}</td>
                    <td class="col-ppr">${esc(t.ppr) || '-'}</td>
                    <td><strong>${esc(t.full_name)}</strong>${genderIcon}</td>
                    <td>${esc(specDisplay)}</td>
                    <td>${t.cadre ? '<span class="badge badge-cadre">' + esc(cadreDisplay) + '</span>' : '-'}</td>
                    <td>${t.grade ? '<span class="badge badge-grade">' + esc(gradeDisplay) + '</span>' : '-'}</td>
                    <td>${t.echelon || '-'}</td>
                    <td style="direction:ltr;text-align:right;font-size:12px;">${esc(t.phone) || '-'}</td>
                    <td>${sourceLabel(t.source)}</td>
                    <td class="col-actions" onclick="event.stopPropagation()">
                        <div class="actions-row">
                            <button class="btn btn-secondary" onclick="editTeacher(${t.id})" title="تعديل"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-secondary" style="color:var(--color-danger)" onclick="deleteTeacher(${t.id})" title="حذف"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
                    })
                    .join('');
            }

            /* ─── Detail Panel ─── */
            function setupDetailPanel() {
                document.getElementById('close-detail').addEventListener('click', closeDetail);
                document.getElementById('detail-overlay').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeDetail();
                });
            }

            function closeDetail() {
                document.getElementById('detail-overlay').classList.remove('active');
            }

            function showDetail(id) {
                const t = teachers.find((x) => x.id === id);
                if (!t) return;

                document.getElementById('detail-name').textContent = t.full_name || '-';
                document.getElementById('detail-name-fr').textContent = t.full_name_fr || '';

                const f = (label, value) =>
                    value
                        ? `
                <div class="detail-field">
                    <span class="field-label">${label}</span>
                    <span class="field-value">${esc(value)}</span>
                </div>`
                        : '';

                const fFull = (label, value) =>
                    value
                        ? `
                <div class="detail-field full-width">
                    <span class="field-label">${label}</span>
                    <span class="field-value">${esc(value)}</span>
                </div>`
                        : '';

                const body = document.getElementById('detail-body');
                body.innerHTML = `
                <div class="detail-section">
                    <h4><i class="fas fa-id-badge"></i> المعلومات الإدارية</h4>
                    <div class="detail-grid">
                        ${f('رقم التأجير (PPR)', t.ppr)}
                        ${f('رقم ب.و.ت (CIN)', t.cin)}
                        ${f('الإطار', t.cadre ? (typeof translateCadre === 'function' ? translateCadre(t.cadre) : t.cadre) : '')}
                        ${f('الدرجة', t.grade ? (typeof translateGrade === 'function' ? translateGrade(t.grade) : t.grade) : '')}
                        ${f('الرتبة', t.echelon)}
                        ${f('الوظيفة', t.function_title)}
                        ${f('تاريخ التوظيف', t.hire_date)}
                        ${f('المصدر', t.source === 'agent_xml' ? 'ملف الوزارة' : t.source === 'fet' ? 'FET' : 'يدوي')}
                    </div>
                </div>

                <div class="detail-section">
                    <h4><i class="fas fa-book"></i> المعلومات المهنية</h4>
                    <div class="detail-grid">
                        ${f('مادة التخصص الرسمية', t.specialty_subject)}
                        ${t.subject && t.subject !== t.specialty_subject ? f('المادة المُدرَّسة', t.subject) : ''}
                    </div>
                </div>

                <div class="detail-section">
                    <h4><i class="fas fa-user"></i> المعلومات الشخصية</h4>
                    <div class="detail-grid">
                        ${f('الجنس', t.gender === '1' ? 'ذكر' : t.gender === '2' ? 'أنثى' : t.gender)}
                        ${f('تاريخ الازدياد', t.birth_date)}
                        ${f('مكان الازدياد', t.birth_place)}
                        ${f('الحالة العائلية', t.marital_status)}
                    </div>
                </div>

                <div class="detail-section">
                    <h4><i class="fas fa-phone-alt"></i> معلومات الاتصال</h4>
                    <div class="detail-grid">
                        ${f('الهاتف', t.phone)}
                        ${f('البريد الإلكتروني', t.email)}
                        ${fFull('العنوان', t.address)}
                    </div>
                </div>
            `;

                document.getElementById('detail-overlay').classList.add('active');
            }

            /* ─── Form CRUD ─── */
            function setupForm() {
                document.getElementById('teacher-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const id = document.getElementById('teacher-id').value;
                    const payload = {
                        full_name: document.getElementById('teacher-name').value.trim(),
                        subject: document.getElementById('teacher-subject').value.trim(),
                        phone: document.getElementById('teacher-phone').value.trim(),
                        email: document.getElementById('teacher-email').value.trim(),
                        school_year: year,
                        active: 1
                    };
                    const res = id
                        ? await window.api.teachers.update(Number(id), payload)
                        : await window.api.teachers.add(payload);
                    if (!res || res.success === false) {
                        showToast('خطأ: ' + (res?.error || 'فشل الحفظ'), 'error');
                        return;
                    }
                    showToast(id ? 'تم التعديل' : 'تم الإضافة', 'success');
                    clearForm();
                    await loadTeachers();
                });
                document.getElementById('cancel-edit').addEventListener('click', clearForm);
            }

            function editTeacher(id) {
                const t = teachers.find((x) => x.id === id);
                if (!t) return;
                document.getElementById('teacher-id').value = t.id;
                document.getElementById('teacher-name').value = t.full_name || '';
                document.getElementById('teacher-subject').value = t.subject || '';
                document.getElementById('teacher-phone').value = t.phone || '';
                document.getElementById('teacher-email').value = t.email || '';
                document.getElementById('form-title').textContent = 'تعديل: ' + (t.full_name || '');
                document.getElementById('cancel-edit').style.display = 'inline-flex';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            async function deleteTeacher(id) {
                if (!confirm('هل تريد حذف هذا الأستاذ؟')) return;
                const res = await window.api.teachers.delete(id);
                if (!res || res.success === false) {
                    showToast('فشل الحذف', 'error');
                    return;
                }
                showToast('تم الحذف', 'success');
                closeDetail();
                await loadTeachers();
            }

            function clearForm() {
                document.getElementById('teacher-form').reset();
                document.getElementById('teacher-id').value = '';
                document.getElementById('form-title').textContent = 'إضافة أستاذ';
                document.getElementById('cancel-edit').style.display = 'none';
            }
        </script>
    </body>
</html>
