<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="توليد أوراق التنقيط للأقسام والمواد الدراسية">
    <title>أوراق التنقيط | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind-output.css">
    <script src="js/utils.js" defer></script>
    <script src="js/notifications.js" defer></script>
    <script src="js/sidebar.js" defer></script>
    <script src="js/ux-enhancements.js" defer></script>
    </head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle" aria-label="فتح أو إغلاق القائمة الجانبية"><i
                        class="fas fa-bars" aria-hidden="true"></i></button>
                <h2 class="page-title"><i class="fas fa-file-alt" aria-hidden="true"></i> أوراق التنقيط</h2>
            </div>
            <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر" aria-label="تبديل المظهر"><i
                    class="fas fa-moon" aria-hidden="true"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <!-- Form Section -->
            <div class="gs-form-section">
                <div class="gs-form-header">
                    <i class="fas fa-cog"></i> توليد ورقة تنقيط
                </div>
                <form id="gs-form" class="gs-form-grid" role="form" aria-label="نموذج توليد ورقة التنقيط">
                    <div class="gs-form-group">
                        <label for="level-select">المستوى</label>
                        <select id="level-select" name="level-select">
                            <option value="">اختر المستوى</option>
                        </select>
                    </div>
                    <div class="gs-form-group">
                        <label for="class-select">القسم</label>
                        <select id="class-select" name="class-select" required aria-required="true">
                            <option value="">اختر القسم</option>
                        </select>
                    </div>
                    <div class="gs-form-group">
                        <label for="subject-select">المادة</label>
                        <select id="subject-select" name="subject-select" required aria-required="true">
                            <option value="">اختر المادة</option>
                        </select>
                    </div>
                    <div class="gs-form-group">
                        <label for="semester-select">الدورة</label>
                        <select id="semester-select" name="semester-select">
                            <option value="1">الدورة الأولى</option>
                            <option value="2">الدورة الثانية</option>
                        </select>
                    </div>
                    <div class="gs-form-actions">
                        <button class="btn btn-primary" type="button" id="generate-btn"><i class="fas fa-file-alt"
                                aria-hidden="true"></i> توليد</button>
                        <button class="btn btn-success ux-print-preview-btn" type="button" id="print-btn" disabled><i
                                class="fas fa-eye" aria-hidden="true"></i> معاينة</button>
                    </div>
                </form>
            </div>

            <!-- Preview Section -->
            <div class="gs-preview-section">
                <div class="gs-preview-header">
                    <h3 class="gs-preview-title">
                        <i class="fas fa-table-list"></i>
                        معاينة ورقة التنقيط
                        <span id="gs-count-badge" class="gs-count-badge" aria-live="polite"
                            style="display:none;">0</span>
                    </h3>
                </div>

                <div class="gs-preview-body" id="gs-preview-body">
                    <div class="gs-empty-state" id="gs-empty-state">
                        <div class="gs-empty-icon">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <h4>لا توجد ورقة تنقيط</h4>
                        <p>اختر القسم والمادة ثم اضغط "توليد" لإنشاء ورقة التنقيط</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <p id="gs-feedback" class="sr-only" aria-live="polite"></p>

    <script src="js/data/ma-education-labels.js"></script>
    <script src="js/pages/grades-sheets.js" defer></script>
</body>

</html>
