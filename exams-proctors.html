<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توزيع الحراسة | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ux-enhancements.js"></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title"><i class="fas fa-user-shield"></i> توزيع الحراسة</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <div class="search-section">
                <form id="form" class="search-form"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                    <input type="hidden" id="id">
                    <input id="teacher" placeholder="الأستاذ" required>
                    <input id="room" placeholder="القاعة">
                    <input type="date" id="date">
                    <input id="session" placeholder="الفترة (صباحية/مسائية)">
                    <button class="btn btn-success" type="submit">???</button>
                </form>
            </div>

            <div class="students-results">
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الأستاذ</th>
                            <th>القاعة</th>
                            <th>التاريخ</th>
                            <th>الفترة</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const year = getSchoolYear();
        let rows = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadRows();
            document.getElementById('form').addEventListener('submit', save);
        });

        async function loadRows() {
            rows = await window.api.proctors.getAll(year) || [];
            document.getElementById('tbody').innerHTML = rows.length ? rows.map((r, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${r.teacher || '-'}</td>
                    <td>${r.room || '-'}</td>
                    <td>${r.date || '-'}</td>
                    <td>${r.session || '-'}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="editRow(${r.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="delRow(${r.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="6" style="padding: 20px; text-align: center;">لا توجد بيانات</td></tr>';
        }

        async function save(e) {
            e.preventDefault();
            const payload = {
                id: document.getElementById('id').value ? Number(document.getElementById('id').value) : undefined,
                teacher: document.getElementById('teacher').value.trim(),
                room: document.getElementById('room').value.trim(),
                date: document.getElementById('date').value,
                session: document.getElementById('session').value.trim(),
                school_year: year
            };
            const res = await window.api.proctors.save(payload);
            if (!res || res.success === false) {
                showToast('فشل الحفظ', 'error');
                return;
            }
            showToast('تم الحفظ', 'success');
            e.target.reset();
            document.getElementById('id').value = '';
            await loadRows();
        }

        function editRow(id) {
            const r = rows.find(x => x.id === id);
            if (!r) return;
            document.getElementById('id').value = r.id;
            document.getElementById('teacher').value = r.teacher || '';
            document.getElementById('room').value = r.room || '';
            document.getElementById('date').value = r.date || '';
            document.getElementById('session').value = r.session || '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function delRow(id) {
            if (!confirm('حذف هذا السجل؟')) return;
            const res = await window.api.proctors.delete(id);
            if (!res || res.success === false) {
                showToast('فشل الحذف', 'error');
                return;
            }
            await loadRows();
        }
    </script>
</body>

</html>
