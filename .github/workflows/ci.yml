name: CI

on:
    push:
        branches: ['**']
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Tailwind CSS
              run: npm run css:build

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm test
