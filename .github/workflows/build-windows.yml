name: Build Windows

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Tailwind CSS
              run: npm run css:build

            - name: Create .env file
              shell: bash
              env:
                  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
                  FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
                  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
                  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
                  FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
                  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
                  FIREBASE_FUNCTIONS_URL: ${{ secrets.FIREBASE_FUNCTIONS_URL }}
                  OWNER_SYNC_WRITE_TOKEN: ${{ secrets.OWNER_SYNC_WRITE_TOKEN }}
                  OWNER_SYNC_READ_TOKEN: ${{ secrets.OWNER_SYNC_READ_TOKEN }}
              run: |
                  printf 'FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY" >> .env
                  printf 'FIREBASE_AUTH_DOMAIN=%s\n' "$FIREBASE_AUTH_DOMAIN" >> .env
                  printf 'FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID" >> .env
                  printf 'FIREBASE_STORAGE_BUCKET=%s\n' "$FIREBASE_STORAGE_BUCKET" >> .env
                  printf 'FIREBASE_MESSAGING_SENDER_ID=%s\n' "$FIREBASE_MESSAGING_SENDER_ID" >> .env
                  printf 'FIREBASE_APP_ID=%s\n' "$FIREBASE_APP_ID" >> .env
                  printf 'FIREBASE_FUNCTIONS_URL=%s\n' "$FIREBASE_FUNCTIONS_URL" >> .env
                  printf 'OWNER_SYNC_WRITE_TOKEN=%s\n' "$OWNER_SYNC_WRITE_TOKEN" >> .env
                  printf 'OWNER_SYNC_READ_TOKEN=%s\n' "$OWNER_SYNC_READ_TOKEN" >> .env

            - name: Build Windows installer
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: npm run build

            - name: Upload installer artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows-installer
                  path: dist/*.exe
                  retention-days: 7
