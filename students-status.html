<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>الوضعية الدراسية | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
    </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-user-slash"></i> الوضعية الدراسية للتلاميذ</h2>
                </div>
                <div class="header-right" style="display: flex; gap: 10px; flex-wrap: wrap">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="print-header" id="print-header">
                <h1><i class="fas fa-user-slash"></i> الوضعية الدراسية للتلاميذ</h1>
                <p id="print-date"></p>
                <p id="print-filters"></p>
            </div>

            <div class="grades-container">
                <!-- Search / Filter Section -->
                <div class="search-section">
                    <h3><i class="fas fa-filter"></i> تصفية البيانات</h3>
                    <form
                        class="search-form"
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px"
                    >
                        <select id="level-select">
                            <option value="">كل المستويات</option>
                        </select>
                        <select id="section-select">
                            <option value="">كل الأقسام</option>
                        </select>
                        <input type="text" id="search-input" placeholder="بحث بالاسم أو رمز مسار..." />
                        <div style="display: flex; gap: 8px">
                            <button
                                class="btn btn-primary"
                                type="button"
                                id="search-btn"
                                style="
                                    flex: 1;
                                    padding: 12px 20px;
                                    font-size: 14px;
                                    border-radius: 10px;
                                    margin: 0;
                                    justify-content: center;
                                "
                            >
                                <i class="fas fa-search"></i> بحث
                            </button>
                            <button
                                class="btn btn-success ux-print-preview-btn"
                                type="button"
                                id="print-btn"
                                style="
                                    padding: 12px 16px;
                                    font-size: 14px;
                                    border-radius: 10px;
                                    margin: 0;
                                    white-space: nowrap;
                                "
                            >
                                <i class="fas fa-print"></i> طباعة
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Stat Cards -->
                <div class="status-stats" id="status-stats">
                    <div class="stat-card">
                        <div class="stat-icon total"><i class="fas fa-users"></i></div>
                        <div class="stat-info">
                            <h4>المجموع</h4>
                            <div class="stat-value" id="stat-total">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon dropout"><i class="fas fa-user-clock"></i></div>
                        <div class="stat-info">
                            <h4>المنقطعون</h4>
                            <div class="stat-value" id="stat-dropout">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon expelled"><i class="fas fa-user-times"></i></div>
                        <div class="stat-info">
                            <h4>المفصولون</h4>
                            <div class="stat-value" id="stat-expelled">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon not-enrolled"><i class="fas fa-user-minus"></i></div>
                        <div class="stat-info">
                            <h4>غير الملتحقين</h4>
                            <div class="stat-value" id="stat-not-enrolled">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon transferred-in"><i class="fas fa-user-plus"></i></div>
                        <div class="stat-info">
                            <h4>الوافدون</h4>
                            <div class="stat-value" id="stat-transferred-in">0</div>
                        </div>
                    </div>
                </div>

                <!-- Tabs + Table -->
                <div class="students-results">
                    <div class="results-action-bar">
                        <h3 style="margin: 0"><i class="fas fa-list"></i> قائمة التلاميذ</h3>
                        <div class="action-group">
                            <button class="btn btn-primary" id="btn-change-status" type="button" disabled>
                                <i class="fas fa-exchange-alt"></i> تغيير الحالة
                            </button>
                            <button class="btn btn-success" id="btn-export" type="button">
                                <i class="fas fa-file-excel"></i> تصدير Excel
                            </button>
                        </div>
                    </div>

                    <div class="status-tabs" id="status-tabs">
                        <button class="status-tab active" data-status="all">
                            <i class="fas fa-list"></i> الكل <span class="tab-count" id="count-all">0</span>
                        </button>
                        <button class="status-tab" data-status="dropout">
                            <i class="fas fa-user-clock"></i> المنقطعون
                            <span class="tab-count" id="count-dropout">0</span>
                        </button>
                        <button class="status-tab" data-status="expelled">
                            <i class="fas fa-user-times"></i> المفصولون
                            <span class="tab-count" id="count-expelled">0</span>
                        </button>
                        <button class="status-tab" data-status="not_enrolled">
                            <i class="fas fa-user-minus"></i> غير الملتحقين
                            <span class="tab-count" id="count-not-enrolled">0</span>
                        </button>
                        <button class="status-tab" data-status="transferred_in">
                            <i class="fas fa-user-plus"></i> الوافدون
                            <span class="tab-count" id="count-transferred-in">0</span>
                        </button>
                    </div>

                    <div class="table-quick-search" id="table-quick-search">
                        <i class="fas fa-filter" style="color: var(--color-text-muted, #999)"></i>
                        <input type="text" id="quick-search-input" placeholder="تصفية سريعة بالاسم أو رمز مسار..." />
                        <span class="search-count" id="search-count"></span>
                    </div>

                    <div class="table-responsive">
                        <table class="students-table students-table-card students-table-card--selectable">
                            <thead>
                                <tr>
                                    <th style="width: 40px">
                                        <input type="checkbox" id="select-all" title="تحديد الكل" />
                                    </th>
                                    <th>#</th>
                                    <th>رمز مسار</th>
                                    <th>الاسم الكامل</th>
                                    <th>القسم</th>
                                    <th>الجنس</th>
                                    <th>الحالة</th>
                                    <th>التاريخ</th>
                                    <th>الملاحظات</th>
                                </tr>
                            </thead>
                            <tbody id="tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Change Status Modal -->
        <div class="status-modal-overlay" id="status-modal-overlay">
            <div class="status-modal">
                <div class="status-modal-header">
                    <h3><i class="fas fa-exchange-alt"></i> تغيير حالة التلاميذ</h3>
                    <button class="close-btn" id="modal-close">&times;</button>
                </div>
                <div class="status-modal-body">
                    <p
                        id="modal-selection-info"
                        style="margin-bottom: 15px; font-size: 13px; color: var(--color-text-muted, #777)"
                    ></p>
                    <div class="form-group">
                        <label for="new-status">الحالة الجديدة</label>
                        <select id="new-status">
                            <option value="active">نشط (عودة للدراسة)</option>
                            <option value="dropout">منقطع عن الدراسة</option>
                            <option value="expelled">مفصول</option>
                            <option value="not_enrolled">غير ملتحق</option>
                            <option value="transferred_in">وافد</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status-reason">الملاحظات (اختياري)</label>
                        <textarea id="status-reason" rows="3" placeholder="أدخل سبب التغيير..."></textarea>
                    </div>
                </div>
                <div class="status-modal-footer">
                    <button class="btn btn-secondary" id="modal-cancel" type="button">إلغاء</button>
                    <button class="btn btn-primary" id="modal-confirm" type="button">
                        <i class="fas fa-check"></i> تأكيد
                    </button>
                </div>
            </div>
        </div>

        <script src="js/pages/students-status.js" defer></script>
    </body>
</html>
