<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التلاميذ الحاصلون على صفر | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ux-enhancements.js"></script>
    <style>
        .sz-search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            align-items: stretch;
        }

        .sz-search-form .btn {
            min-height: 46px;
            margin: 0;
            justify-content: center;
        }

        .sz-kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeInUp 0.4s ease-out 0.03s both;
        }

        .sz-kpi-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            box-shadow: var(--shadow-soft);
        }

        .sz-kpi-label {
            color: var(--color-text-light);
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
            font-family: var(--font-display);
        }

        .sz-kpi-value {
            color: var(--color-primary);
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
            font-family: var(--font-display);
        }

        .sz-results-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .sz-results-head h3 {
            margin-bottom: 0;
        }

        .sz-results-meta {
            color: var(--color-text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sz-search-form {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 520px) {
            .sz-search-form {
                grid-template-columns: 1fr;
            }
        }

        /* Print preview overrides */
        .ux-pp-sheet .sz-kpis {
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .ux-pp-sheet .sz-kpi-card {
            padding: 8px 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
        }

        .ux-pp-sheet .sz-kpi-label {
            font-size: 10px;
            margin-bottom: 4px;
            color: #555;
        }

        .ux-pp-sheet .sz-kpi-value {
            font-size: 18px;
            color: #3B6AC5;
        }

        .ux-pp-sheet .students-table {
            width: 100%;
            table-layout: fixed;
            font-size: 11px;
        }

        .ux-pp-sheet .students-table th,
        .ux-pp-sheet .students-table td {
            padding: 5px 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ux-pp-sheet .students-table th:nth-child(1),
        .ux-pp-sheet .students-table td:nth-child(1) {
            width: 30px;
        }

        .ux-pp-sheet .students-table th:nth-child(2),
        .ux-pp-sheet .students-table td:nth-child(2) {
            width: 90px;
        }

        .ux-pp-sheet .students-table th:nth-child(4),
        .ux-pp-sheet .students-table td:nth-child(4) {
            width: 75px;
        }

        .ux-pp-sheet .students-table th:nth-child(6),
        .ux-pp-sheet .students-table td:nth-child(6) {
            width: 50px;
        }

        .ux-pp-sheet .students-table th:nth-child(7),
        .ux-pp-sheet .students-table td:nth-child(7) {
            width: 65px;
        }

        .ux-pp-sheet .sz-results-head {
            margin-bottom: 8px;
        }

        .ux-pp-sheet .sz-results-head h3 {
            font-size: 13px;
        }

        .ux-pp-sheet .sz-results-meta {
            font-size: 10px;
        }

        .ux-pp-sheet .table-responsive {
            overflow: visible;
        }
    </style>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title"><i class="fas fa-exclamation-circle"></i> التلاميذ الحاصلون على صفر</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <div class="search-section">
                <h3><i class="fas fa-filter"></i> تصفية النتائج</h3>
                <form class="search-form sz-search-form" id="filters-form">
                    <input id="search-input" type="text" placeholder="بحث بالاسم، رمز مسار أو المادة"
                        autocomplete="off">
                    <select id="class-select">
                        <option value="">كل الأقسام</option>
                    </select>
                    <select id="semester-select">
                        <option value="">كل الدورات</option>
                        <option value="1">الدورة الأولى</option>
                        <option value="2">الدورة الثانية</option>
                    </select>
                    <select id="page-size-select" aria-label="عدد النتائج في الصفحة">
                        <option value="10">10 في الصفحة</option>
                        <option value="25" selected>25 في الصفحة</option>
                        <option value="50">50 في الصفحة</option>
                        <option value="100">100 في الصفحة</option>
                    </select>
                    <button class="btn btn-primary" type="button" id="search-btn"><i class="fas fa-search"></i>
                        بحث</button>
                    <button class="btn btn-success ux-print-preview-btn" type="button" id="export-btn" disabled><i
                            class="fas fa-eye"></i>
                        معاينة الطباعة / PDF</button>
                </form>
            </div>

            <div class="sz-kpis" aria-live="polite">
                <div class="sz-kpi-card">
                    <div class="sz-kpi-label">حالات الصفر</div>
                    <div class="sz-kpi-value" id="kpi-total-cases">0</div>
                </div>
                <div class="sz-kpi-card">
                    <div class="sz-kpi-label">عدد التلاميذ</div>
                    <div class="sz-kpi-value" id="kpi-unique-students">0</div>
                </div>
                <div class="sz-kpi-card">
                    <div class="sz-kpi-label">الأقسام المتأثرة</div>
                    <div class="sz-kpi-value" id="kpi-sections-count">0</div>
                </div>
                <div class="sz-kpi-card">
                    <div class="sz-kpi-label">مرتبطة بالغياب</div>
                    <div class="sz-kpi-value" id="kpi-absence-linked">0</div>
                </div>
            </div>

            <div class="students-results">
                <div class="sz-results-head">
                    <h3><i class="fas fa-list"></i> قائمة التلاميذ الحاصلين على صفر <span class="count-badge"
                            id="results-count">0</span></h3>
                    <div class="sz-results-meta" id="results-meta">-</div>
                </div>
                <div class="table-responsive">
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>رمز مسار</th>
                                <th>الاسم الكامل</th>
                                <th>القسم</th>
                                <th>المادة</th>
                                <th>الدورة</th>
                                <th>السبب</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination" style="display:none;"></div>
            </div>
        </div>
    </main>

    <script>
        const year = '2025/2026';
        let currentPage = 1;
        let searchDebounceTimer = null;
        let activeRequestId = 0;

        function $(id) {
            return document.getElementById(id);
        }

        function asNumber(value) {
            const n = Number(value);
            return Number.isFinite(n) ? n : NaN;
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function semesterLabel(value) {
            const sem = String(value || '');
            return sem === '1' ? 'الأولى' : sem === '2' ? 'الثانية' : '-';
        }

        function formatNow() {
            return new Date().toLocaleString('ar-MA', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getFilters() {
            return {
                className: $('class-select').value,
                semester: $('semester-select').value,
                searchTerm: $('search-input').value.trim()
            };
        }

        function getPageSize() {
            const value = Number($('page-size-select').value);
            return Number.isFinite(value) && value > 0 ? value : 25;
        }

        function renderMessageRow(message, iconClass = 'fa-info-circle', color = '#6b7280') {
            const tbody = $('tbody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" style="padding: 20px; text-align: center;">
                        <i class="fas ${iconClass}" style="color: ${color}; font-size: 32px; display: block; margin-bottom: 10px;"></i>
                        ${escapeHtml(message)}
                    </td>
                </tr>
            `;
        }

        function updateKpis(summary = {}) {
            $('kpi-total-cases').textContent = String(summary.totalCases || 0);
            $('kpi-unique-students').textContent = String(summary.uniqueStudents || 0);
            $('kpi-sections-count').textContent = String(summary.sectionsCount || 0);
            $('kpi-absence-linked').textContent = String(summary.absenceLinkedCases || 0);
        }

        function updateResultsMeta(pagination) {
            const totalRows = Number(pagination?.totalRows || 0);
            const page = Number(pagination?.page || 1);
            const pageSize = Number(pagination?.pageSize || getPageSize());
            if (!totalRows) {
                $('results-meta').textContent = '-';
                $('results-count').textContent = '0';
                return;
            }

            const start = (page - 1) * pageSize + 1;
            const end = Math.min(page * pageSize, totalRows);
            $('results-meta').textContent = `عرض ${start} - ${end} من ${totalRows}`;
            $('results-count').textContent = String(totalRows);
        }

        function renderRows(rows, pagination) {
            const tbody = $('tbody');
            const startIndex = (Number(pagination.page || 1) - 1) * Number(pagination.pageSize || getPageSize());

            tbody.innerHTML = rows.map((row, idx) => {
                const massarCode = row.student_code || row.massar_code || '-';
                const studentName = row.student_name || row.full_name || '-';
                const section = row.class_name || row.section || '-';
                const subject = row.subject || '-';
                const reason = row.zero_reason || (Number(row.absence_count || 0) > 0 ? 'غياب' : 'تعثر دراسي');

                return `
                    <tr>
                        <td>${startIndex + idx + 1}</td>
                        <td>${escapeHtml(massarCode)}</td>
                        <td>${escapeHtml(studentName)}</td>
                        <td>${escapeHtml(section)}</td>
                        <td>${escapeHtml(subject)}</td>
                        <td>${semesterLabel(row.semester)}</td>
                        <td>${escapeHtml(reason)}</td>
                    </tr>
                `;
            }).join('');
        }

        function buildPageList(current, totalPages) {
            if (totalPages <= 7) {
                return Array.from({ length: totalPages }, (_, i) => i + 1);
            }

            const pages = [1];
            const start = Math.max(2, current - 1);
            const end = Math.min(totalPages - 1, current + 1);

            if (start > 2) pages.push('...');
            for (let p = start; p <= end; p += 1) pages.push(p);
            if (end < totalPages - 1) pages.push('...');

            pages.push(totalPages);
            return pages;
        }

        function renderPagination(pagination) {
            const container = $('pagination');
            const totalRows = Number(pagination?.totalRows || 0);
            const totalPages = Number(pagination?.totalPages || 1);
            const page = Number(pagination?.page || 1);

            if (!totalRows || totalPages <= 1) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            const pageItems = buildPageList(page, totalPages);
            const pagesHtml = pageItems.map((item) => {
                if (item === '...') return '<span class="ellipsis">...</span>';
                return `<button type="button" class="page-btn ${item === page ? 'active' : ''}" data-page="${item}">${item}</button>`;
            }).join('');

            container.innerHTML = `
                <button type="button" class="nav-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>السابق</button>
                ${pagesHtml}
                <button type="button" class="nav-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>التالي</button>
                <span class="page-info">صفحة ${page} من ${totalPages}</span>
            `;
            container.style.display = 'flex';
        }

        function normalizeZeroRows(rows = []) {
            return rows
                .map((g) => ({
                    id: g.id,
                    student_code: g.student_code || g.massar_code || '',
                    student_name: g.student_name || g.full_name || '',
                    class_name: g.class_name || g.section || '',
                    subject: g.subject || '',
                    semester: String(g.semester || ''),
                    grade: asNumber(g.grade),
                    absence_count: Number(g.absence_count || 0),
                    zero_reason: g.zero_reason || ''
                }))
                .filter((g) => g.grade === 0);
        }

        async function buildFallbackZeroStudents({ className = '', semester = '', searchTerm = '', page = 1, pageSize = 25, exportAll = false } = {}) {
            const rawGrades = await window.api.grades.getAll(year);
            const allGrades = normalizeZeroRows(Array.isArray(rawGrades) ? rawGrades : []);
            const search = searchTerm.trim().toLowerCase();

            let filtered = allGrades;
            if (className) filtered = filtered.filter((g) => g.class_name === className);
            if (semester) filtered = filtered.filter((g) => String(g.semester) === String(semester));
            if (search) {
                filtered = filtered.filter((g) =>
                    String(g.student_name || '').toLowerCase().includes(search) ||
                    String(g.student_code || '').toLowerCase().includes(search) ||
                    String(g.subject || '').toLowerCase().includes(search)
                );
            }

            filtered.sort((a, b) => {
                const bySection = String(a.class_name || '').localeCompare(String(b.class_name || ''), 'ar');
                if (bySection !== 0) return bySection;
                return String(a.student_name || '').localeCompare(String(b.student_name || ''), 'ar');
            });

            const totalRows = filtered.length;
            const totalPages = totalRows ? Math.ceil(totalRows / pageSize) : 1;
            const safePage = Math.min(Math.max(1, page), totalPages);
            const start = (safePage - 1) * pageSize;
            const rows = exportAll ? filtered : filtered.slice(start, start + pageSize);

            return {
                success: true,
                rows: rows.map((r) => ({
                    ...r,
                    zero_reason: r.zero_reason || 'تعثر دراسي'
                })),
                pagination: {
                    page: exportAll ? 1 : safePage,
                    pageSize: exportAll ? rows.length || pageSize : pageSize,
                    totalRows,
                    totalPages: exportAll ? 1 : totalPages
                },
                summary: {
                    totalCases: totalRows,
                    uniqueStudents: new Set(filtered.map((r) => r.student_code || r.student_name)).size,
                    sectionsCount: new Set(filtered.map((r) => r.class_name)).size,
                    absenceLinkedCases: 0
                }
            };
        }

        async function fetchZeroStudents({ className = '', semester = '', searchTerm = '', page = 1, pageSize = 25, exportAll = false } = {}) {
            if (typeof window.api?.grades?.getZeroStudents === 'function') {
                try {
                    const result = await window.api.grades.getZeroStudents({
                        schoolYear: year,
                        className,
                        semester,
                        searchTerm,
                        page,
                        pageSize,
                        exportAll
                    });

                    if (result?.success) {
                        return result;
                    }

                    console.warn('grades:getZeroStudents returned non-success, falling back to local filtering:', result?.error || result);
                } catch (err) {
                    console.warn('grades:getZeroStudents failed, using local fallback:', err);
                }
            }

            return buildFallbackZeroStudents({ className, semester, searchTerm, page, pageSize, exportAll });
        }

        async function loadClasses() {
            try {
                const classes = await window.api.classes.getAll(year) || [];
                const select = $('class-select');
                while (select.options.length > 1) select.remove(1);
                classes.forEach((c) => {
                    const opt = document.createElement('option');
                    opt.value = c.name;
                    opt.textContent = c.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.warn('Failed to load classes:', err);
                showToast('تعذر تحميل الأقسام', 'error');
            }
        }

        async function search({ resetPage = false } = {}) {
            if (resetPage) currentPage = 1;

            const requestId = ++activeRequestId;
            const filters = getFilters();
            const pageSize = getPageSize();

            try {
                renderMessageRow('جاري تحميل المعطيات...', 'fa-spinner fa-spin', '#3B6AC5');

                const result = await fetchZeroStudents({
                    ...filters,
                    page: currentPage,
                    pageSize,
                    exportAll: false
                });

                if (requestId !== activeRequestId) return;
                if (!result?.success) {
                    throw new Error(result?.error || 'تعذر جلب المعطيات');
                }

                currentPage = Number(result.pagination?.page || 1);
                updateKpis(result.summary || {});
                updateResultsMeta(result.pagination || {});
                renderPagination(result.pagination || {});

                const rows = Array.isArray(result.rows) ? result.rows : [];
                $('export-btn').disabled = !rows.length && !Number(result.pagination?.totalRows || 0);

                if (!rows.length) {
                    renderMessageRow('لا يوجد تلاميذ حاصلون على صفر وفق الفلاتر الحالية', 'fa-check-circle', '#10b981');
                    return;
                }

                renderRows(rows, result.pagination || {});
            } catch (err) {
                console.warn('Failed to load zero students:', err);
                updateKpis({ totalCases: 0, uniqueStudents: 0, sectionsCount: 0, absenceLinkedCases: 0 });
                updateResultsMeta({ totalRows: 0 });
                renderPagination({ totalRows: 0, totalPages: 1, page: 1 });
                renderMessageRow('تعذر جلب المعطيات، حاول مرة أخرى', 'fa-triangle-exclamation', '#e85d5d');
                showToast('تعذر جلب المعطيات', 'error');
            }
        }

        async function showPrintPreview() {
            try {
                showToast('جاري تحضير معاينة الطباعة...', 'info');

                // Fetch ALL rows first so printable table is complete
                const filters = getFilters();
                const result = await fetchZeroStudents({
                    ...filters,
                    page: 1,
                    pageSize: getPageSize(),
                    exportAll: true
                });

                if (!result?.success) {
                    throw new Error(result?.error || 'تعذر تجهيز المعاينة');
                }

                const rows = Array.isArray(result.rows) ? result.rows : [];
                if (!rows.length) {
                    showToast('لا توجد بيانات للمعاينة', 'warning');
                    return;
                }

                // Temporarily fill the page table with all rows for the preview snapshot
                const savedTbody = $('tbody').innerHTML;
                const savedPagination = $('pagination').innerHTML;
                const savedPaginationDisplay = $('pagination').style.display;
                const savedMeta = $('results-meta').textContent;

                renderRows(rows, { page: 1, pageSize: rows.length });
                $('pagination').style.display = 'none';

                const filtersText = [
                    filters.className ? `القسم: ${filters.className}` : 'كل الأقسام',
                    filters.semester ? `الدورة: ${semesterLabel(filters.semester)}` : 'كل الدورات'
                ].join(' | ');
                $('results-meta').textContent = `السنة الدراسية: ${year} | عدد السجلات: ${rows.length} | ${filtersText}`;

                const previewFn =
                    (typeof window.openPrintPreview === 'function' && window.openPrintPreview) ||
                    (typeof window.UXEnhancements?.openPrintPreview === 'function' && window.UXEnhancements.openPrintPreview);

                if (previewFn) {
                    previewFn({
                        title: 'التلاميذ الحاصلون على صفر',
                        pageSize: 'A4',
                        defaultFileName: `تلاميذ_الصفر_${year.replace('/', '-')}`
                    });
                } else {
                    window.print();
                }

                // Restore original table state
                $('tbody').innerHTML = savedTbody;
                $('pagination').innerHTML = savedPagination;
                $('pagination').style.display = savedPaginationDisplay;
                $('results-meta').textContent = savedMeta;

                showToast(`تم تجهيز المعاينة (${rows.length} سجل)`, 'success');
            } catch (err) {
                console.warn('Print preview error:', err);
                showToast('تعذر فتح معاينة الطباعة', 'error');
            }
        }

        function bindEvents() {
            $('filters-form').addEventListener('submit', (event) => {
                event.preventDefault();
                search({ resetPage: true });
            });

            $('search-btn').addEventListener('click', () => search({ resetPage: true }));
            $('export-btn').addEventListener('click', showPrintPreview);

            ['class-select', 'semester-select', 'page-size-select'].forEach((id) => {
                $(id).addEventListener('change', () => search({ resetPage: true }));
            });

            $('search-input').addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    search({ resetPage: true });
                }, 250);
            });

            $('pagination').addEventListener('click', (event) => {
                const button = event.target.closest('button[data-page]');
                if (!button || button.disabled) return;
                const targetPage = Number(button.dataset.page);
                if (!Number.isFinite(targetPage) || targetPage < 1 || targetPage === currentPage) return;
                currentPage = targetPage;
                search();
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            bindEvents();
            await loadClasses();
            await search({ resetPage: true });
        });
    </script>
</body>

</html>
