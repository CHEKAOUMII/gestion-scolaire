<!doctype html>
<html lang="ar" dir="rtl">
    <head>
    <script src="js/theme-boot.js"></script>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>معلومات المؤسسة | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/shared/dom-helpers.js" defer></script>
        <script src="js/shared/auth-session.js" defer></script>
        <script src="js/shared/filter-manager.js" defer></script>
        <script src="js/data/ma-regions.js" defer></script>
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
    </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
    <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-school" aria-hidden="true"></i> معلومات المؤسسة</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="تبديل المظهر" aria-pressed="false" title="تبديل المظهر">
                        <i class="fas fa-moon" aria-hidden="true"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container">
                <!-- Section 0: Sync-linked institution identity -->
                <section class="identity-section" id="sync-institution-section" aria-labelledby="sync-institution-title" hidden>
                    <div class="section-title" id="sync-institution-title"><i class="fas fa-cloud" aria-hidden="true"></i> هوية المؤسسة المرتبطة بالمزامنة</div>
                    <div class="identity-form">
                        <div class="form-group">
                            <label for="sync-inst-code">رمز ماسار</label>
                            <input id="sync-inst-code" name="sync-inst-code" dir="ltr" autocomplete="off" maxlength="20" placeholder="مثال: 12345A" />
                            <p id="sync-inst-code-error" class="field-error hidden"></p>
                        </div>
                        <div class="form-group">
                            <label for="sync-inst-name">اسم المؤسسة (المزامنة)</label>
                            <input id="sync-inst-name" name="sync-inst-name" disabled autocomplete="off" />
                        </div>
                        <div class="school-section-actions" id="sync-inst-link-wrap" hidden>
                            <button type="button" id="sync-inst-save-btn" class="btn btn-secondary btn-sm">
                                <i class="fas fa-save" aria-hidden="true"></i> حفظ رمز ماسار
                            </button>
                        </div>
                    </div>
                </section>

                <form id="school-form" novalidate>
                    <!-- Section 1: Ministry hierarchy (right column of letterhead) -->
                    <section class="identity-section" aria-labelledby="ministry-section-title">
                        <div class="section-title" id="ministry-section-title"><i class="fas fa-landmark" aria-hidden="true"></i> الجهة الوصية</div>
                        <div class="identity-form">
                            <div class="form-group">
                                <label for="id-country">الدولة</label>
                                <input id="id-country" name="country" autocomplete="country-name" placeholder="المملكة المغربية" />
                            </div>
                            <div class="form-group">
                                <label for="id-ministry">الوزارة</label>
                                <input id="id-ministry" name="ministry" autocomplete="organization" placeholder="وزارة التربية الوطنية والتعليم الأولي والرياضة" />
                            </div>
                            <div class="form-group">
                                <label for="id-academy">الأكاديمية الجهوية</label>
                                <select id="id-academy" name="academy">
                                    <option value="" disabled selected>اختر الأكاديمية الجهوية</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="id-directorate">المديرية الإقليمية</label>
                                <select id="id-directorate" name="directorate" disabled>
                                    <option value="" disabled selected>اختر الأكاديمية أولاً</option>
                                </select>
                            </div>
                        </div>
                    </section>

                    <!-- Section 2: School identity (left column of letterhead) -->
                    <section class="identity-section" aria-labelledby="school-section-title">
                        <div class="section-title" id="school-section-title"><i class="fas fa-building" aria-hidden="true"></i> معلومات المؤسسة</div>
                        <div class="identity-form">
                            <div class="form-group">
                                <label for="id-school-name">اسم المؤسسة</label>
                                <input id="id-school-name" name="school_name" autocomplete="organization" placeholder="اسم المؤسسة التعليمية" />
                            </div>
                            <div class="form-group">
                                <label for="id-school-code">رمز المؤسسة</label>
                                <input id="id-school-code" name="school_code" dir="ltr" autocomplete="off" placeholder="رمز المؤسسة" />
                            </div>
                            <div class="form-group">
                                <label for="id-city">المدينة</label>
                                <input id="id-city" name="city" autocomplete="address-level2" placeholder="المدينة" />
                            </div>
                            <div class="form-group">
                                <label for="id-commune">الجماعة</label>
                                <input id="id-commune" name="commune" autocomplete="off" placeholder="الجماعة الترابية" />
                            </div>
                            <div class="form-group">
                                <label for="id-school-year">الموسم الدراسي</label>
                                <input id="id-school-year" name="school_year" inputmode="numeric" pattern="\d{4}/\d{4}" autocomplete="off" placeholder="2025/2026" />
                            </div>
                            <div class="form-group">
                                <label for="id-director-name">اسم المدير(ة)</label>
                                <input id="id-director-name" name="director_name" autocomplete="name" placeholder="الاسم الكامل للمدير(ة)" />
                            </div>
                            <div class="form-group">
                                <label for="id-director-title">صفة المدير(ة)</label>
                                <input id="id-director-title" name="director_title" autocomplete="off" placeholder="مدير(ة) المؤسسة" />
                            </div>
                            <div class="form-group full-width">
                                <label for="id-footer-text">نص التذييل (أسفل الوثائق)</label>
                                <textarea
                                    id="id-footer-text"
                                    name="footer_text"
                                    class="school-textarea--compact"
                                    placeholder="سلمت هذه الوثيقة للمعني(ة) بالأمر..."
                                ></textarea>
                            </div>
                        </div>
                    </section>

                    <!-- Sections 3-5: Logo, Seal, Signature — rendered from <template> by settings-school.js -->
                    <div class="assets-row" id="assets-row"></div>

                    <template id="asset-uploader-template">
                        <section class="identity-section">
                            <div class="section-title">
                                <i class="fas asset-section-icon" aria-hidden="true"></i>
                                <span class="asset-section-title"></span>
                            </div>
                            <div class="logo-upload-area">
                                <button class="logo-preview asset-preview" type="button">
                                    <i class="fas placeholder-icon asset-placeholder-icon" aria-hidden="true"></i>
                                    <img class="asset-img" alt="" hidden />
                                </button>
                                <div class="logo-actions">
                                    <button class="btn btn-primary btn-sm asset-upload-btn" type="button">
                                        <i class="fas fa-upload" aria-hidden="true"></i> اختيار صورة
                                    </button>
                                    <button class="btn btn-outline btn-sm asset-remove-btn" type="button" hidden>
                                        <i class="fas fa-trash" aria-hidden="true"></i>
                                        <span class="asset-remove-label">حذف</span>
                                    </button>
                                    <span class="asset-help-text"></span>
                                </div>
                                <div class="asset-scale-control" hidden>
                                    <label class="asset-scale-label">
                                        <span class="asset-scale-text">حجم الصورة في الوثائق</span>
                                        <span class="asset-scale-value" dir="ltr">100%</span>
                                    </label>
                                    <input
                                        type="range"
                                        class="asset-scale-slider"
                                        min="30"
                                        max="250"
                                        step="5"
                                        value="100"
                                        aria-label="نسبة حجم الصورة"
                                    />
                                    <div class="asset-scale-hints" aria-hidden="true">
                                        <span>صغير</span>
                                        <span>كبير</span>
                                    </div>
                                </div>
                            </div>
                            <input type="file" class="asset-file-input" accept="image/png,image/jpeg" hidden />
                        </section>
                    </template>

                    <!-- Save + Preview -->
                    <div class="form-actions">
                        <button class="btn btn-success" id="btn-save" type="submit">
                            <i class="fas fa-save" aria-hidden="true"></i> حفظ جميع المعلومات
                        </button>
                        <button class="btn btn-primary" id="btn-preview" type="button">
                            <i class="fas fa-eye" aria-hidden="true"></i> معاينة رأس الوثيقة
                        </button>
                    </div>
                </form>

                <!-- Live letterhead preview -->
                <section
                    class="identity-section school-preview-section"
                    id="preview-section"
                    aria-labelledby="preview-section-title"
                    hidden
                >
                    <div class="section-title" id="preview-section-title">
                        <i class="fas fa-print" aria-hidden="true"></i> معاينة رأس الوثيقة كما سيظهر عند الطباعة
                    </div>
                    <div class="letterhead-preview-container" id="letterhead-preview"></div>
                </section>
            </div>
        </main>

        <script src="js/pages/settings-school.js" defer></script>
    </body>
</html>
