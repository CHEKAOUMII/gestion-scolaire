<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="صفحة إدارة المستخدمين والصلاحيات" />
        <meta name="theme-color" content="#3b6ac5" />
        <title>المستخدمون | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        <script src="js/pages/settings-users-guard.js"></script>
    </head>

    <body>
        <noscript>
            <div
                class="fixed inset-0 z-[9999] flex min-h-screen items-center justify-center bg-[var(--color-primary-dark)] p-10 text-center text-white"
            >
                <div>
                    <i class="fas fa-exclamation-triangle mb-4 block text-5xl text-[var(--color-warning-solid)]"></i>
                    <h2 class="text-2xl font-bold">يجب تفعيل JavaScript لاستخدام هذا التطبيق</h2>
                </div>
            </div>
        </noscript>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button
                        class="menu-toggle"
                        id="menu-toggle"
                        type="button"
                        aria-label="فتح القائمة الجانبية"
                        title="القائمة"
                    >
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="page-title"><i class="fas fa-users-cog"></i> المستخدمون</h2>
                </div>
                <div class="header-right">
                    <button
                        class="theme-toggle"
                        id="theme-toggle"
                        type="button"
                        aria-label="تبديل المظهر"
                        title="تبديل المظهر"
                    >
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container">
                <div class="search-section">
                    <form id="form" class="search-form settings-users-form-grid">
                        <label for="name" class="sr-only">الاسم</label>
                        <input id="name" placeholder="الاسم" required />
                        <label for="email" class="sr-only">البريد الإلكتروني</label>
                        <input id="email" type="email" placeholder="البريد" required />
                        <label for="password" class="sr-only">كلمة المرور</label>
                        <input id="password" type="password" placeholder="كلمة المرور" autocomplete="new-password" />
                        <label for="role" class="sr-only">الدور</label>
                        <select id="role">
                            <option value="admin">admin</option>
                            <option value="staff">staff</option>
                            <option value="viewer">viewer</option>
                        </select>
                        <button class="btn btn-success" type="submit">إضافة مستخدم</button>
                    </form>
                </div>

                <div class="students-results">
                    <table class="students-table">
                        <caption class="sr-only">
                            قائمة المستخدمين المسجلين
                        </caption>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الاسم</th>
                                <th>البريد</th>
                                <th>الدور</th>
                                <th>الحالة</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>

                <div class="students-results settings-visibility-panel">
                    <div class="settings-visibility-header">
                        <h3 class="settings-visibility-title">
                            <i class="fas fa-eye-slash"></i> الصفحات في قائمة التنقل
                        </h3>
                        <div class="settings-visibility-actions">
                            <span id="page-visibility-pending" class="settings-visibility-pending" data-state="clean"
                                >لا تعديلات معلقة</span
                            >
                            <button id="save-page-visibility" class="btn btn-success" type="button" disabled>
                                <i class="fas fa-save"></i> حفظ التعديلات
                            </button>
                            <button
                                id="save-page-visibility-defaults"
                                class="btn btn-warning"
                                type="button"
                                title="حفظ الإعدادات الحالية كإعداد افتراضي لجميع الأجهزة عند التثبيت"
                            >
                                <i class="fas fa-download"></i> حفظ كإعداد افتراضي للتطبيق
                            </button>
                            <button id="refresh-page-visibility" class="btn btn-secondary" type="button">
                                تحديث القائمة
                            </button>
                        </div>
                    </div>
                    <p class="settings-visibility-help">
                        تحكم بالصفحات التي تظهر في قائمة التنقل لكل المستخدمين. غير الأدمن لن يروا هذه الصفحات المخفية.
                    </p>
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الصفحة</th>
                                <th>المجموعة</th>
                                <th>الحالة</th>
                                <th>الإنجاز الحالي</th>
                                <th>تغيير الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="page-visibility-tbody"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <script src="js/pages/settings-users.js" defer></script>
    </body>
</html>
