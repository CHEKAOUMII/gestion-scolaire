<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>قاعات الامتحان | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
    </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-door-open"></i> قاعات الامتحان</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container">
                <div class="search-section">
                    <form
                        id="form"
                        class="search-form"
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px"
                    >
                        <input type="hidden" id="id" />
                        <input id="name" placeholder="اسم القاعة" required />
                        <input id="capacity" type="number" placeholder="السعة" />
                        <input id="building" placeholder="المبنى" />
                        <button class="btn btn-success" type="submit">حفظ</button>
                    </form>
                </div>

                <div class="students-results">
                    <table class="students-table students-table-card">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>اسم القاعة</th>
                                <th>السعة</th>
                                <th>المبنى</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <script>
            function escapeHtml(text) {
                if (text === null || text === undefined) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            const year = getSchoolYear();
            let rows = [];

            document.addEventListener('DOMContentLoaded', async () => {
                await loadRows();
                document.getElementById('form').addEventListener('submit', save);
            });

            async function loadRows() {
                rows = (await window.api.examRooms.getAll(year)) || [];
                document.getElementById('tbody').innerHTML = rows.length
                    ? rows
                          .map(
                              (r, i) => `
                <tr>
                    <td data-label="#">${i + 1}</td>
                    <td data-label="اسم القاعة">${escapeHtml(r.room_name || '-')}</td>
                    <td data-label="السعة">${escapeHtml(r.capacity || '-')}</td>
                    <td data-label="المبنى">${escapeHtml(r.equipment || '-')}</td>
                    <td data-label="الإجراء">
                        <button class="btn btn-secondary" onclick="editRow(${Number(r.id)})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="delRow(${Number(r.id)})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `
                          )
                          .join('')
                    : '<tr><td colspan="5" style="padding: 20px; text-align: center;">لا توجد بيانات</td></tr>';
            }

            async function save(e) {
                e.preventDefault();
                const payload = {
                    id: document.getElementById('id').value ? Number(document.getElementById('id').value) : undefined,
                    room_name: document.getElementById('name').value.trim(),
                    capacity: document.getElementById('capacity').value,
                    equipment: document.getElementById('building').value.trim(),
                    school_year: year
                };
                const res = await window.api.examRooms.save(payload);
                if (!res || res.success === false) {
                    showToast('فشل الحفظ', 'error');
                    return;
                }
                showToast('تم الحفظ', 'success');
                e.target.reset();
                document.getElementById('id').value = '';
                await loadRows();
            }

            function editRow(id) {
                const r = rows.find((x) => x.id === id);
                if (!r) return;
                document.getElementById('id').value = r.id;
                document.getElementById('name').value = r.room_name || '';
                document.getElementById('capacity').value = r.capacity || '';
                document.getElementById('building').value = r.equipment || '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            async function delRow(id) {
                const confirmed = await showConfirm({
                    type: 'danger',
                    title: 'حذف قاعة',
                    message: 'حذف هذه القاعة؟',
                    detail: 'لا يمكن التراجع عن هذا الإجراء.',
                    confirmText: 'حذف'
                });
                if (!confirmed.confirmed) return;
                const res = await window.api.examRooms.delete(id);
                if (!res || res.success === false) {
                    showToast('فشل الحذف', 'error');
                    return;
                }
                await loadRows();
            }
        </script>
    </body>
</html>
