<!doctype html>
<html lang="ar" dir="rtl">
    <head>
    <script src="js/theme-boot.js"></script>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>غياب الأساتذة | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/shared/dom-helpers.js" defer></script>
        <script src="js/shared/auth-session.js" defer></script>
        <script src="js/shared/filter-manager.js" defer></script>
        <script src="js/utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
    </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
    <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-user-minus"></i> غياب الأساتذة</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container">
                <div class="search-section">
                    <h3><i class="fas fa-pen"></i> تسجيل غياب</h3>
                    <form
                        id="form"
                        class="search-form"
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px"
                    >
                        <input type="hidden" id="id" />
                        <select id="teacher" required>
                            <option value="">-- اختر أستاذ --</option>
                        </select>
                        <input type="date" id="date" required />
                        <input id="reason" placeholder="السبب" />
                        <select id="justified">
                            <option value="1">مبرر</option>
                            <option value="0">غير مبرر</option>
                        </select>
                        <button class="btn btn-success" type="submit">حفظ</button>
                    </form>
                </div>

                <div class="students-results">
                    <h3><i class="fas fa-clipboard-list"></i> سجل الغياب</h3>
                    <table class="students-table students-table-card">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الأستاذ</th>
                                <th>التاريخ</th>
                                <th>السبب</th>
                                <th>الحالة</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <script>
            function escapeHtml(text) {
                if (text === null || text === undefined) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            const year = getSchoolYear();
            let rows = [];

            document.addEventListener('DOMContentLoaded', async () => {
                const teachers = (await window.api.teachers.getAll(year)) || [];
                const select = document.getElementById('teacher');
                teachers.forEach((t) => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = t.full_name;
                    select.appendChild(opt);
                });

                await loadRows();
                document.getElementById('form').addEventListener('submit', save);
            });

            async function loadRows() {
                rows = (await window.api.teacherAbsences.getAll(year)) || [];
                document.getElementById('tbody').innerHTML = rows.length
                    ? rows
                          .map(
                              (r, i) => `
                <tr>
                    <td data-label="#">${i + 1}</td>
                    <td data-label="الأستاذ">${escapeHtml(r.full_name || '-')}</td>
                    <td data-label="التاريخ">${escapeHtml(r.absence_date || '-')}</td>
                    <td data-label="السبب">${escapeHtml(r.reason || '-')}</td>
                    <td data-label="الحالة">${r.justified ? '<span style="color: var(--color-success);">مبرر</span>' : '<span style="color: var(--color-danger);">غير مبرر</span>'}</td>
                    <td data-label="الإجراء">
                        <button class="btn btn-secondary" onclick="delRow(${Number(r.id)})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `
                          )
                          .join('')
                    : '<tr><td colspan="6" style="padding: 20px; text-align: center;">لا توجد بيانات</td></tr>';
            }

            async function save(e) {
                e.preventDefault();
                const payload = {
                    teacher_id: Number(document.getElementById('teacher').value),
                    absence_date: document.getElementById('date').value,
                    reason: document.getElementById('reason').value.trim(),
                    school_year: year
                };
                const res = await window.api.teacherAbsences.save(payload);
                if (!res || res.success === false) {
                    showToast('فشل الحفظ', 'error');
                    return;
                }
                showToast('تم الحفظ', 'success');
                e.target.reset();
                await loadRows();
            }

            async function delRow(id) {
                const confirmed = await showConfirm({
                    type: 'danger',
                    title: 'حذف سجل غياب',
                    message: 'حذف هذا السجل؟',
                    detail: 'لا يمكن التراجع عن هذا الإجراء.',
                    confirmText: 'حذف'
                });
                if (!confirmed.confirmed) return;
                const res = await window.api.teacherAbsences.delete(id);
                if (!res || res.success === false) {
                    showToast('فشل الحذف', 'error');
                    return;
                }
                await loadRows();
            }
        </script>
    </body>
</html>
