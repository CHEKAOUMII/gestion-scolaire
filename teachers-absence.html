<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غياب الأساتذة | برنامج التدبير المدرسي</title>
    <link rel="stylesheet" href="vendor/fonts/google-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ux-enhancements.js"></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title"><i class="fas fa-user-minus"></i> غياب الأساتذة</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <div class="search-section">
                <h3><i class="fas fa-pen"></i> تسجيل غياب</h3>
                <form id="form" class="search-form"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                    <input type="hidden" id="id">
                    <select id="teacher" required>
                        <option value="">-- اختر أستاذ --</option>
                    </select>
                    <input type="date" id="date" required>
                    <input id="reason" placeholder="السبب">
                    <select id="justified">
                        <option value="1">????</option>
                        <option value="0">??? ????</option>
                    </select>
                    <button class="btn btn-success" type="submit">???</button>
                </form>
            </div>

            <div class="students-results">
                <h3><i class="fas fa-clipboard-list"></i> سجل الغياب</h3>
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الأستاذ</th>
                            <th>التاريخ</th>
                            <th>السبب</th>
                            <th>الحالة</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const year = '2025/2026';
        let rows = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const teachers = await window.api.teachers.getAll(year) || [];
            const select = document.getElementById('teacher');
            teachers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.full_name;
                opt.textContent = t.full_name;
                select.appendChild(opt);
            });

            await loadRows();
            document.getElementById('form').addEventListener('submit', save);
        });

        async function loadRows() {
            rows = await window.api.teacherAbsence.getAll(year) || [];
            document.getElementById('tbody').innerHTML = rows.length ? rows.map((r, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${r.teacher || '-'}</td>
                    <td>${r.date || '-'}</td>
                    <td>${r.reason || '-'}</td>
                    <td>${r.justified ? '<span style="color: #059669;">????</span>' : '<span style="color: #dc2626;">??? ????</span>'}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="delRow(${r.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="6" style="padding: 20px; text-align: center;">لا توجد بيانات</td></tr>';
        }

        async function save(e) {
            e.preventDefault();
            const payload = {
                teacher: document.getElementById('teacher').value,
                date: document.getElementById('date').value,
                reason: document.getElementById('reason').value.trim(),
                justified: Number(document.getElementById('justified').value),
                school_year: year
            };
            const res = await window.api.teacherAbsence.add(payload);
            if (!res || res.success === false) {
                showToast('فشل الحفظ', 'error');
                return;
            }
            showToast('تم الحفظ', 'success');
            e.target.reset();
            await loadRows();
        }

        async function delRow(id) {
            if (!confirm('حذف هذا السجل؟')) return;
            const res = await window.api.teacherAbsence.delete(id);
            if (!res || res.success === false) {
                showToast('فشل الحذف', 'error');
                return;
            }
            await loadRows();
        }
    </script>
</body>

</html>
