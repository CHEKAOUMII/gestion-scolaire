        <script>
            function escapeHtml(text) {
                if (text === null || text === undefined) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function formatDateShort(dateStr) {
                if (!dateStr) return '—';
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr;
                return parts[2] + '/' + parts[1];
            }

            function formatDateAr(dateStr) {
                try {
                    const d = new Date(dateStr + 'T00:00:00');
                    return d.toLocaleDateString('ar-MA', {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric'
                    });
                } catch {
                    return dateStr;
                }
            }

            function todayStr() {
                const d = new Date();
                return (
                    d.getFullYear() +
                    '-' +
                    String(d.getMonth() + 1).padStart(2, '0') +
                    '-' +
                    String(d.getDate()).padStart(2, '0')
                );
            }

            /** Get date 30 days ago as YYYY-MM-DD */
            function thirtyDaysAgo() {
                const d = new Date();
                d.setDate(d.getDate() - 30);
                return (
                    d.getFullYear() +
                    '-' +
                    String(d.getMonth() + 1).padStart(2, '0') +
                    '-' +
                    String(d.getDate()).padStart(2, '0')
                );
            }

            // PERIOD_MAP, CONSECUTIVE_SLOT_MAP, resolveSlotTime → loaded from utils.js
            // Note: CONSECUTIVE_SLOT_MAP maps each slot to its next consecutive (h1→h2, etc.)

            function renderTopList(container, items, options) {
                if (!container) return;

                if (!items.length) {
                    container.innerHTML =
                        '<span style="color: var(--color-text-muted);">لا توجد حصص في الانتظار</span>';
                    return;
                }

                const { medals, getTitle, getMeta, getBadgeValue, badgeBg } = options;
                container.innerHTML = items
                    .map(
                        (item, i) =>
                            `<div style="display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:6px; background: var(--color-neutral-surface);">
                                <span style="font-size:16px;">${medals[i]}</span>
                                <strong style="flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: var(--color-text-main);">${getTitle(item)}</strong>
                                ${getMeta(item) ? `<span style="color: var(--color-text-muted); font-size:11px; white-space:nowrap;">${getMeta(item)}</span>` : ''}
                                <span style="background: ${badgeBg}; color: var(--color-surface); border-radius:10px; padding:1px 8px; font-size:11px; font-weight:700;">${getBadgeValue(item)}</span>
                            </div>`
                    )
                    .join('');
            }

            function buildMergedRecord(run) {
                const first = run[0];
                if (run.length === 1) {
                    return {
                        ...first,
                        period_time: resolveSlotTime(first.period_slot, first.period_time),
                        ids: [first.id]
                    };
                }
                const last = run[run.length - 1];
                const slotLabels = run.map((r) => (r.period_slot || '').toUpperCase()).join(' ');
                const firstTime = resolveSlotTime(first.period_slot, first.period_time);
                const lastTime = resolveSlotTime(last.period_slot, last.period_time);
                const startTime = firstTime.split('-')[0] || '';
                const endTime = lastTime.split('-')[1] || '';
                const combinedTime = startTime && endTime ? startTime + '-' + endTime : firstTime;
                const allCompensated = run.every((r) => r.compensated);
                return {
                    ...first,
                    period_slot: slotLabels,
                    period_time: combinedTime,
                    ids: run.map((r) => r.id),
                    compensated: allCompensated ? 1 : 0
                };
            }

            function mergeConsecutiveSessions(records) {
                if (!records || records.length === 0) return [];
                const groups = {};
                for (const r of records) {
                    const key =
                        (r.absence_date || '') +
                        '|' +
                        (r.teacher_name || '') +
                        '|' +
                        (r.section || '') +
                        '|' +
                        (r.subject || '');
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(r);
                }
                const merged = [];
                for (const [groupKey, groupRecords] of Object.entries(groups)) {
                    try {
                        groupRecords.sort((a, b) => {
                            const numA = parseInt((a.period_slot || '').toLowerCase().replace('h', ''), 10) || 0;
                            const numB = parseInt((b.period_slot || '').toLowerCase().replace('h', ''), 10) || 0;
                            return numA - numB;
                        });
                        let run = [groupRecords[0]];
                        for (let i = 1; i < groupRecords.length; i++) {
                            const prevSlot = (run[run.length - 1].period_slot || '').toLowerCase();
                            const currSlot = (groupRecords[i].period_slot || '').toLowerCase();
                            if (CONSECUTIVE_SLOT_MAP[prevSlot] === currSlot) {
                                run.push(groupRecords[i]);
                            } else {
                                merged.push(buildMergedRecord(run));
                                run = [groupRecords[i]];
                            }
                        }
                        merged.push(buildMergedRecord(run));
                    } catch (mergeErr) {
                        const parts = groupKey.split('|');
                        const ctx = `التاريخ: ${parts[0] || '?'}, الأستاذ: ${parts[1] || '?'}, القسم: ${parts[2] || '?'}`;
                        console.error(`[CompTracking] خطأ في دمج الحصص المتتابعة (${ctx}):`, mergeErr);
                        // Fall back: add records un-merged so the page still works
                        for (const r of groupRecords) {
                            merged.push({
                                ...r,
                                period_time: resolveSlotTime(r.period_slot, r.period_time),
                                ids: [r.id]
                            });
                        }
                    }
                }
                return merged;
            }

            const year = typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';
            let allRecords = [];
            let loadedTeachers = [];
            const PAGE_SIZE = 20;
            let currentPage = 1;
            let lastPagedRecords = [];

            /** Normalize name: remove underscores, diacritics, collapse spaces */
            function normalizeName(name) {
                return (name || '')
                    .replace(/_/g, ' ')
                    .replace(/[\u064B-\u065F\u0670]/g, '')
                    .replace(/\bال/g, '')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();
            }

            function normalizeStoredTeacherMeta(key, entry) {
                const sourceName = String(entry?.sourceName || key || '').trim();
                const sourceDisplayName = String(entry?.sourceDisplayName || sourceName || '').trim();
                const teacherName = String(
                    entry?.teacherName || entry?.displayName || sourceDisplayName || sourceName || ''
                ).trim();
                return {
                    key: String(key || entry?.key || '').trim(),
                    teacherId: Number(entry?.teacherId) || null,
                    teacherName,
                    displayName: String(entry?.displayName || teacherName || sourceDisplayName || sourceName).trim(),
                    sourceName,
                    sourceDisplayName
                };
            }

            function getStoredTimetableTeacherEntries(data) {
                const entriesByKey = new Map();

                Object.entries(data?.teacherMetaByKey || {}).forEach(([key, entry]) => {
                    entriesByKey.set(key, normalizeStoredTeacherMeta(key, entry));
                });

                (Array.isArray(data?.teachers) ? data.teachers : []).forEach((entry) => {
                    const normalized = normalizeStoredTeacherMeta(entry?.key || entry?.name, entry);
                    if (normalized.key && !entriesByKey.has(normalized.key)) {
                        entriesByKey.set(normalized.key, normalized);
                    }
                });

                Object.keys(data?.timetables || {}).forEach((key) => {
                    if (!entriesByKey.has(key)) {
                        entriesByKey.set(
                            key,
                            normalizeStoredTeacherMeta(key, { key, sourceName: key, teacherName: key })
                        );
                    }
                });

                return Array.from(entriesByKey.values());
            }

            function resolveTeacherTimetableKeys(data, teacherId, teacherName) {
                const entries = getStoredTimetableTeacherEntries(data);
                const targetId = Number(teacherId) || null;
                const targetName = String(teacherName || '').trim();
                const normalizedTarget = normalizeName(targetName);
                const matchedKeys = [];

                const addMatches = (predicate) => {
                    entries.forEach((entry) => {
                        if (entry.key && predicate(entry)) matchedKeys.push(entry.key);
                    });
                    return [...new Set(matchedKeys)];
                };

                if (targetId) {
                    const byId = addMatches((entry) => entry.teacherId === targetId);
                    if (byId.length) return byId;
                }

                if (!targetName) return [];

                const fieldsForEntry = (entry) => [
                    entry.teacherName,
                    entry.displayName,
                    entry.sourceDisplayName,
                    entry.sourceName,
                    entry.key.replace(/^tafwij:/, '').replace(/_/g, ' ')
                ];

                const exact = addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => String(value || '').trim() === targetName)
                );
                if (exact.length) return exact;

                const normalized = addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => normalizeName(value) === normalizedTarget)
                );
                if (normalized.length) return normalized;

                return addMatches((entry) =>
                    fieldsForEntry(entry).some((value) => {
                        const normalizedValue = normalizeName(value);
                        return (
                            normalizedValue &&
                            (normalizedValue.includes(normalizedTarget) || normalizedTarget.includes(normalizedValue))
                        );
                    })
                );
            }

            /**
             * Extract every detailed session (teacher × section × period) for a list of
             * absence records on a given date, using the timetable from the database.
             */
            async function getDetailedSessionsForDay(absenceRecords, date) {
                const sessions = [];
                try {
                    const schoolYear = typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';
                    const ttData = await window.api.timetable.get(schoolYear);
                    if (!ttData || !ttData.timetables) return sessions;

                    const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const dateObj = new Date(date + 'T00:00:00');
                    const dayName = dayNames[dateObj.getDay()];

                    for (const absence of absenceRecords) {
                        const name = absence.full_name || absence.teacher_name;
                        if (!name) continue;

                        const teacherKeys = resolveTeacherTimetableKeys(ttData, absence.teacher_id, name);
                        if (!teacherKeys.length) continue;

                        teacherKeys.forEach((teacherKey) => {
                            const dayData = ttData.timetables?.[teacherKey]?.[dayName];
                            if (!dayData) return;

                            for (const [, hours] of Object.entries(dayData)) {
                                if (!hours || typeof hours !== 'object') continue;
                                for (const [h, lesson] of Object.entries(hours)) {
                                    if (!lesson) continue;
                                    const sectionName = (lesson.students || '').trim();
                                    if (!sectionName) continue;
                                    sessions.push({
                                        absence_date: date,
                                        teacher_id: Number(absence.teacher_id) || null,
                                        teacher_name: name,
                                        section: sectionName,
                                        period_slot: h,
                                        period_time: PERIOD_MAP[h] || h,
                                        subject:
                                        (typeof normalizeSubjectName === 'function'
                                            ? normalizeSubjectName(lesson.subject || '')
                                            : lesson.subject || '') ||
                                        absence.subject ||
                                        '',
                                        school_year: year,
                                        reason: absence.reason || '',
                                        notes: absence.notes || ''
                                    });
                                }
                            }
                        });
                    }
                } catch (e) {
                    console.warn('[CompTracking] Error extracting sessions from timetable:', e);
                }
                return sessions;
            }

            /**
             * For a date range, read staff_attendance absences, derive sessions from the
             * timetable and save them (INSERT OR IGNORE) into compensation_tracking.
             */
            async function autoSeedFromAttendance(dateFrom, dateTo) {
                try {
                    // Fetch all staff_attendance absence records for the school year
                    const allAtt = await window.api.staffAttendance.getAll(year);
                    if (!allAtt || allAtt.length === 0) return;

                    // Filter to absences only, within the date range
                    const absences = allAtt.filter((r) => {
                        if (r.type !== 'absence') return false;
                        if (!r.attendance_date) return false;
                        if (dateFrom && r.attendance_date < dateFrom) return false;
                        if (dateTo && r.attendance_date > dateTo) return false;
                        return true;
                    });

                    if (absences.length === 0) return;

                    // Group by date
                    const byDate = {};
                    for (const r of absences) {
                        const d = r.attendance_date;
                        if (!byDate[d]) byDate[d] = [];
                        byDate[d].push(r);
                    }

                    // For each day, extract sessions and saveBatch
                    for (const [date, recs] of Object.entries(byDate)) {
                        const sessions = await getDetailedSessionsForDay(recs, date);
                        if (sessions.length > 0) {
                            try {
                                await window.api.compensation.saveBatch(sessions);
                            } catch (e) {
                                console.warn('[CompTracking] saveBatch error for', date, e);
                            }
                        }
                    }
                } catch (e) {
                    console.warn('[CompTracking] autoSeedFromAttendance error:', e);
                }
            }

            document.addEventListener('DOMContentLoaded', async () => {
                // Set default date range
                document.getElementById('filter-date-from').value = thirtyDaysAgo();
                document.getElementById('filter-date-to').value = todayStr();

                // Populate teacher/section/subject filters
                await populateFilters();

                // Load data
                loadTrackingData();

                document.getElementById('apply-filter-btn').addEventListener('click', loadTrackingData);
                document.getElementById('print-btn').addEventListener('click', async () => {
                    const tbody = document.getElementById('tracking-tbody');
                    const rows = tbody?.querySelectorAll('tr:not(.empty-row)');
                    if (!rows || !rows.length) {
                        showToast('لا توجد بيانات للطباعة', 'warning');
                        return;
                    }

                    const year = typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';
                    const dateStr = new Intl.DateTimeFormat('ar-MA', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    }).format(new Date());
                    let identity = {};
                    try {
                        identity = (await window.api.reports.getIdentity()) || {};
                    } catch (_) {}
                    const letterhead =
                        typeof window.buildLetterheadHTML === 'function'
                            ? window.buildLetterheadHTML(identity, year)
                            : '';

                    // Clone table rows without action column
                    let tableRows = '';
                    rows.forEach((row, i) => {
                        const cells = row.querySelectorAll('td:not(.no-print)');
                        tableRows +=
                            '<tr>' +
                            Array.from(cells)
                                .map((td) => `<td>${td.innerHTML}</td>`)
                                .join('') +
                            '</tr>';
                    });

                    let printDiv = document.getElementById('comp-print-content');
                    if (!printDiv) {
                        printDiv = document.createElement('div');
                        printDiv.id = 'comp-print-content';
                        printDiv.style.display = 'none';
                        document.body.appendChild(printDiv);
                    }
                    printDiv.innerHTML = `
                        <div class="gs-sheet-wrapper">
                            <div class="gs-sheet" id="comp-sheet-content">
                                ${letterhead}
                                <div class="gs-sheet-title">الحصص التعويضية</div>
                                <div class="gs-sheet-meta">
                                    <span><i class="fas fa-calendar-alt"></i> السنة الدراسية: ${year}</span>
                                    <span><i class="fas fa-list"></i> العدد: ${rows.length}</span>
                                    <span><i class="fas fa-clock"></i> التاريخ: ${dateStr}</span>
                                </div>
                                <table>
                                    <thead>
                                        <tr>
                                            <th style="text-align:center;width:40px;">#</th>
                                            <th>التاريخ</th>
                                            <th>القسم</th>
                                            <th>الأستاذ(ة)</th>
                                            <th>المادة</th>
                                            <th>الحصة</th>
                                            <th>الحالة</th>
                                        </tr>
                                    </thead>
                                    <tbody>${tableRows}</tbody>
                                </table>
                                <div class="gs-footer">
                                    <span>تاريخ الطباعة: ${dateStr}</span>
                                    <span>برنامج التدبير المدرسي — ${year}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    printDiv.style.display = 'block';
                    PrintSystem.preview({
                        contentSelector: '#comp-sheet-content',
                        title: 'الحصص التعويضية',
                        pageSize: 'A4',
                        noHeader: true
                    });
                    setTimeout(() => {
                        printDiv.style.display = 'none';
                    }, 500);
                });

                // Enter key on filters triggers full reload
                document.querySelectorAll('.filter-group input, .filter-group select').forEach((el) => {
                    el.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') loadTrackingData();
                    });
                    if (el.tagName === 'SELECT') el.addEventListener('change', applyFilters);
                });
            });

            let _compFilterManager = null;

            async function populateFilters() {
                try {
                    loadedTeachers = await window.api.teachers.getAll(year);
                } catch (e) {
                    console.warn('Could not load teachers for filter:', e);
                }

                // Use FilterManager for section + subject (unified DB source)
                try {
                    _compFilterManager = new FilterManager({
                        selectors: { class: 'filter-section', subject: 'filter-subject' },
                        placeholders: { class: 'الكل', subject: 'الكل' },
                        onChange: (values) => {
                            // When subject changes, filter teachers accordingly
                            updateTeacherDropdown(values.subject || '');
                        }
                    });
                    await _compFilterManager.init();
                } catch (err) {
                    console.warn('Failed to init FilterManager:', err);
                }

                // Initialize teachers dropdown
                updateTeacherDropdown('');
            }

            async function updateTeacherDropdown(selectedSubject) {
                const teacherSelect = document.getElementById('filter-teacher');
                const currentTeacher = teacherSelect.value;
                teacherSelect.innerHTML = '<option value="">الكل</option>';

                let allowedTeacherNames = null;

                if (selectedSubject) {
                    allowedTeacherNames = new Set();

                    if (loadedTeachers && loadedTeachers.length) {
                        loadedTeachers.forEach((t) => {
                            const s1 = (t.specialty_subject || '').trim();
                            const s2 = (t.subject || '').trim();
                            const tr1 = typeof translateSubject === 'function' ? translateSubject(s1) : s1;
                            const tr2 = typeof translateSubject === 'function' ? translateSubject(s2) : s2;
                            if (
                                tr1 === selectedSubject ||
                                tr2 === selectedSubject ||
                                s1 === selectedSubject ||
                                s2 === selectedSubject
                            ) {
                                allowedTeacherNames.add(t.full_name);
                            }
                        });
                    }

                    try {
                        const schoolYear = typeof getSchoolYear === 'function' ? getSchoolYear() : '2025/2026';
                        const ttData = await window.api.timetable.get(schoolYear);
                        if (ttData && ttData.timetables) {
                                for (const [teacherKey, days] of Object.entries(ttData.timetables)) {
                                    let teachesSubject = false;
                                    for (const day of Object.values(days)) {
                                        if (!day || typeof day !== 'object') continue;
                                        for (const period of Object.values(day)) {
                                            if (!period || typeof period !== 'object') continue;
                                            for (const lesson of Object.values(period)) {
                                                if (
                                                    lesson &&
                                                    lesson.subject &&
                                                    lesson.subject.trim() === selectedSubject
                                                ) {
                                                    teachesSubject = true;
                                                }
                                            }
                                        }
                                    }
                                    if (teachesSubject) {
                                        const entries = getStoredTimetableTeacherEntries(ttData);
                                        const entry = entries.find((e) => e.key === teacherKey);
                                        if (entry && entry.teacherName) {
                                            const matchedTeacher = (loadedTeachers || []).find(
                                                (t) =>
                                                    t.full_name === entry.teacherName ||
                                                    normalizeName(t.full_name) === normalizeName(entry.teacherName)
                                            );
                                            if (matchedTeacher) allowedTeacherNames.add(matchedTeacher.full_name);
                                            else allowedTeacherNames.add(entry.teacherName);
                                        } else {
                                            allowedTeacherNames.add(
                                                teacherKey.replace(/^tafwij:/, '').replace(/_/g, ' ')
                                            );
                                        }
                                    }
                                }
                            }
                        } catch (e) {}
                }

                const teachersToRender = [];
                if (allowedTeacherNames) {
                    (loadedTeachers || []).forEach((t) => {
                        if (allowedTeacherNames.has(t.full_name)) teachersToRender.push(t);
                    });
                    allowedTeacherNames.forEach((name) => {
                        if (!teachersToRender.find((t) => t.full_name === name)) {
                            teachersToRender.push({ full_name: name });
                        }
                    });
                } else {
                    if (loadedTeachers && loadedTeachers.length) teachersToRender.push(...loadedTeachers);
                }

                teachersToRender.sort((a, b) => (a.full_name || '').localeCompare(b.full_name || '', 'ar'));

                teachersToRender.forEach((t) => {
                    const opt = document.createElement('option');
                    opt.value = t.full_name;
                    opt.textContent = t.full_name;
                    teacherSelect.appendChild(opt);
                });

                if (currentTeacher && Array.from(teacherSelect.options).some((o) => o.value === currentTeacher)) {
                    teacherSelect.value = currentTeacher;
                }
            }

            function ensureArrayResponse(value, label) {
                if (Array.isArray(value)) return value;
                if (value && value.success === false) {
                    throw new Error(value.error || `فشل تحميل ${label}`);
                }
                if (value == null) return [];
                return [];
            }

            async function loadTrackingData() {
                try {
                    const dateFrom = document.getElementById('filter-date-from').value;
                    const dateTo = document.getElementById('filter-date-to').value;

                    // ── Step 1: Auto-seed from staff_attendance + timetable ──
                    // This ensures sessions show up without needing staff-daily-report.html first
                    await autoSeedFromAttendance(dateFrom, dateTo);

                    // ── Step 2: Fetch all pending (not yet compensated) ──
                    allRecords = ensureArrayResponse(
                        await window.api.compensation.getPending(year),
                        'بيانات التعويضات'
                    );

                    // ── Step 3: Also fetch compensated records in the date range ──
                    if (dateFrom && dateTo) {
                        const allDone = await fetchCompensatedInRange(dateFrom, dateTo);
                        const idSet = new Set(allRecords.map((r) => r.id));
                        for (const r of allDone) {
                            if (!idSet.has(r.id)) {
                                allRecords.push(r);
                                idSet.add(r.id);
                            }
                        }
                    }

                    applyFilters();
                } catch (err) {
                    const detail = err instanceof ReferenceError
                        ? `خطأ مرجعي: ${err.message}`
                        : err.message || 'خطأ غير معروف';
                    console.error('Error loading tracking data:', err);
                    allRecords = [];
                    applyFilters();
                    showToast(`خطأ في تحميل بيانات التتبع: ${detail}`, 'error');
                }
            }

            async function fetchCompensatedInRange(dateFrom, dateTo) {
                const results = [];
                const from = new Date(dateFrom + 'T00:00:00');
                const to = new Date(dateTo + 'T00:00:00');
                // Fetch each date's data (limit to 60 days max)
                const maxDays = 60;
                let count = 0;
                for (let d = new Date(from); d <= to && count < maxDays; d.setDate(d.getDate() + 1), count++) {
                    const dateStr =
                        d.getFullYear() +
                        '-' +
                        String(d.getMonth() + 1).padStart(2, '0') +
                        '-' +
                        String(d.getDate()).padStart(2, '0');
                    try {
                        const dayRecords = ensureArrayResponse(
                            await window.api.compensation.getByDate(dateStr, year),
                            'بيانات التعويضات المؤكدة'
                        );
                        results.push(...dayRecords);
                    } catch (e) {
                        console.warn('[CompTracking] getByDate failed for', dateStr, e);
                    }
                }
                return results;
            }

            function applyFilters() {
                const dateFrom = document.getElementById('filter-date-from').value;
                const dateTo = document.getElementById('filter-date-to').value;
                const section = document.getElementById('filter-section').value;
                const teacher = document.getElementById('filter-teacher').value;
                const subject = document.getElementById('filter-subject').value;
                const status = document.getElementById('filter-status').value;

                let statsRecords = Array.isArray(allRecords) ? [...allRecords] : [];

                if (dateFrom) {
                    statsRecords = statsRecords.filter((r) => r.absence_date >= dateFrom);
                }
                if (dateTo) {
                    statsRecords = statsRecords.filter((r) => r.absence_date <= dateTo);
                }
                if (section) {
                    statsRecords = statsRecords.filter((r) => r.section === section);
                }
                if (teacher) {
                    statsRecords = statsRecords.filter((r) => r.teacher_name === teacher);
                }
                if (subject) {
                    statsRecords = statsRecords.filter((r) => {
                        if (r.subject === subject) return true;
                        const norm =
                            typeof normalizeSubjectName === 'function'
                                ? normalizeSubjectName(r.subject || '')
                                : r.subject;
                        return norm === subject;
                    });
                }

                let tableRecords = [...statsRecords];

                if (status === 'pending') {
                    tableRecords = tableRecords.filter((r) => !r.compensated);
                } else if (status === 'done') {
                    tableRecords = tableRecords.filter((r) => r.compensated);
                }

                // Merge consecutive periods for display, then sort
                const mergedTableRecords = mergeConsecutiveSessions(tableRecords);

                // Sort: pending first, then by date desc
                mergedTableRecords.sort((a, b) => {
                    if (a.compensated !== b.compensated) return a.compensated - b.compensated;
                    return b.absence_date.localeCompare(a.absence_date);
                });

                currentPage = 1;
                renderStats(statsRecords);
                renderTable(mergedTableRecords);
            }

            function renderStats(records) {
                const total = records.length;
                const done = records.filter((r) => r.compensated).length;
                const pending = total - done;

                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-done').textContent = done;

                // Update hidden date display for print preview
                const dateFrom = document.getElementById('filter-date-from').value;
                const dateTo = document.getElementById('filter-date-to').value;
                const dateDisplay = document.getElementById('date-display');
                if (dateDisplay && dateFrom && dateTo) {
                    dateDisplay.textContent = `من ${dateFrom.split('-').reverse().join('/')} إلى ${dateTo.split('-').reverse().join('/')}`;
                }

                // Calculate top 3 teachers with most pending sessions
                const pendingRecords = records.filter((r) => !r.compensated);
                const teacherMap = {};
                for (const r of pendingRecords) {
                    const key = (r.teacher_name || '—') + '||' + (r.subject || '—');
                    if (!teacherMap[key]) {
                        teacherMap[key] = { name: r.teacher_name || '—', subject: r.subject || '—', count: 0 };
                    }
                    teacherMap[key].count++;
                }
                const topTeachers = Object.values(teacherMap)
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 3);

                const medals = ['🥇', '🥈', '🥉'];
                const topList = document.getElementById('top-teachers-list');
                renderTopList(topList, topTeachers, {
                    medals,
                    badgeBg: 'var(--color-danger-solid)',
                    getTitle: (t) => escapeHtml(t.name),
                    getMeta: (t) => escapeHtml(t.subject),
                    getBadgeValue: (t) => t.count
                });

                // Calculate top 3 sections with most pending sessions
                const sectionMap = {};
                for (const r of pendingRecords) {
                    const sec = r.section || '—';
                    sectionMap[sec] = (sectionMap[sec] || 0) + 1;
                }
                const topSections = Object.entries(sectionMap)
                    .map(([section, count]) => ({ section, count }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 3);

                const topSectionsList = document.getElementById('top-sections-list');
                renderTopList(topSectionsList, topSections, {
                    medals,
                    badgeBg: 'var(--color-info-solid)',
                    getTitle: (s) => escapeHtml(s.section),
                    getMeta: () => '',
                    getBadgeValue: (s) => s.count
                });
            }

            function renderTable(records) {
                lastPagedRecords = records;
                const tbody = document.getElementById('tracking-tbody');
                const totalPages = Math.max(1, Math.ceil(records.length / PAGE_SIZE));
                currentPage = Math.min(currentPage, totalPages);
                document.getElementById('table-count').textContent = records.length;

                if (records.length === 0) {
                    tbody.innerHTML = `
                    <tr class="empty-row">
                        <td colspan="9">
                            <div class="comp-empty-state">
                                <i class="fas fa-check-circle"></i>
                                <p>لا توجد حصص مسجلة بهذه المعايير</p>
                            </div>
                        </td>
                    </tr>`;
                    renderPagination(0, 1);
                    return;
                }

                const start = (currentPage - 1) * PAGE_SIZE;
                const pageRecords = records.slice(start, start + PAGE_SIZE);

                tbody.innerHTML = pageRecords
                    .map((r, i) => {
                        const isCompensated = r.compensated;
                        const statusHtml = isCompensated
                            ? '<span class="status-badge done"><i class="fas fa-check-circle"></i> تم التعويض</span>'
                            : '<span class="status-badge pending"><i class="fas fa-hourglass-half"></i> في الانتظار</span>';
                        const actionHtml = isCompensated
                            ? `<button class="comp-toggle undo" onclick="toggleComp([${r.ids.join(',')}], false)" title="التراجع">
                           <i class="fas fa-undo"></i> تراجع
                       </button>`
                            : `<button class="comp-toggle approve" onclick="toggleComp([${r.ids.join(',')}], true)" title="تأكيد التعويض">
                           <i class="fas fa-check"></i> تعويض
                       </button>`;
                        const periodTime = escapeHtml(r.period_time || PERIOD_MAP[(r.period_slot || '').toLowerCase()] || r.period_slot || '');
                        const reasonHtml = r.reason
                            ? escapeHtml(r.reason) + (r.notes ? '<br><small class="record-note"><i class="fas fa-sticky-note"></i> ' + escapeHtml(r.notes) + '</small>' : '')
                            : (r.notes ? '<small class="record-note"><i class="fas fa-sticky-note"></i> ' + escapeHtml(r.notes) + '</small>' : '—');

                        return `
                    <tr class="${isCompensated ? 'compensated' : ''}">
                        <td data-label="#">${start + i + 1}</td>
                        <td data-label="التاريخ">${escapeHtml(formatDateAr(r.absence_date))}</td>
                        <td data-label="القسم"><strong>${escapeHtml(r.section)}</strong></td>
                        <td data-label="الأستاذ(ة)">${escapeHtml(r.teacher_name)}</td>
                        <td data-label="المادة">${escapeHtml(r.subject || '—')}</td>
                        <td data-label="الحصة"><span class="section-tag" style="font-size: 11px;">${periodTime}</span></td>
                        <td data-label="السبب">${reasonHtml}</td>
                        <td data-label="الحالة">${statusHtml}</td>
                        <td data-label="إجراء" class="no-print">${actionHtml}</td>
                    </tr>`;
                    })
                    .join('');

                renderPagination(records.length, totalPages);
            }

            function renderPagination(total, totalPages) {
                let el = document.getElementById('comp-pagination');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'comp-pagination';
                    el.style.cssText =
                        'display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0 4px;font-size:13px;';
                    document.querySelector('.gs-preview-body').after(el);
                }
                if (total === 0 || totalPages <= 1) {
                    el.innerHTML = '';
                    return;
                }
                const from = (currentPage - 1) * PAGE_SIZE + 1;
                const to = Math.min(currentPage * PAGE_SIZE, total);
                el.innerHTML = `
                    <button onclick="gotoPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}
                        style="border:1px solid var(--color-accent);background:var(--color-surface-alt);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--color-text-main);box-shadow:var(--shadow-card);">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <span style="color:var(--color-text-muted);">${from}–${to} من ${total}</span>
                    <span style="font-weight:600;">صفحة ${currentPage} / ${totalPages}</span>
                    <button onclick="gotoPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}
                        style="border:1px solid var(--color-accent);background:var(--color-surface-alt);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--color-text-main);box-shadow:var(--shadow-card);">
                        <i class="fas fa-chevron-left"></i>
                    </button>`;
            }

            function gotoPage(page) {
                const totalPages = Math.max(1, Math.ceil(lastPagedRecords.length / PAGE_SIZE));
                currentPage = Math.max(1, Math.min(page, totalPages));
                renderTable(lastPagedRecords);
                document.querySelector('.gs-preview-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            async function toggleComp(idOrIds, compensated) {
                try {
                    const ids = Array.isArray(idOrIds) ? idOrIds : [idOrIds];
                    for (const id of ids) {
                        await window.api.compensation.toggleCompensated(id, compensated);
                    }
                    for (const id of ids) {
                        const rec = allRecords.find((r) => r.id === id);
                        if (rec) {
                            rec.compensated = compensated ? 1 : 0;
                            rec.compensated_date = compensated ? todayStr() : null;
                        }
                    }
                    applyFilters();
                    showToast(compensated ? 'تم تأكيد التعويض' : 'تم التراجع عن التعويض', 'success');
                } catch (err) {
                    console.error('Error toggling compensation:', err);
                    showToast('خطأ في تحديث الحالة', 'error');
                }
            }
        </script>
    </body>
</html>
