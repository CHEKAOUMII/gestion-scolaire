<!doctype html>
<html lang="ar" dir="rtl">
    <head>
    <script src="js/theme-boot.js"></script>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>الحصص التعويضية | برنامج التدبير المدرسي</title>
        <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />
        <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />

        <link rel="stylesheet" href="css/tailwind-output.css" />
        <script src="js/data/ma-education-labels.js"></script>
        <script src="js/utils.js" defer></script>
        <script src="js/shared/date-utils.js" defer></script>
        <script src="js/notifications.js" defer></script>
        <script src="js/message-system.js" defer></script>
        <script src="js/sidebar.js" defer></script>
        <script src="js/ux-enhancements.js" defer></script>
        <script src="js/shared/timetable-utils.js" defer></script>
    <script src="js/print-system.js"></script>
    </head>

    <body>
        <div class="toast-container" id="toast-container"></div>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="header">
    <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="فتح القائمة الجانبية"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <h2 class="page-title"><i class="fas fa-exchange-alt"></i> الحصص التعويضية</h2>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="grades-container" style="padding-top: 18px">
                <!-- Filters — gs-form-section style -->
                <div class="gs-form-section no-print">
                    <div class="gs-form-header"><i class="fas fa-filter"></i> فلترة وبحث</div>
                    <div class="gs-form-grid">
                        <div class="gs-form-group">
                            <label for="filter-date-from"><i class="fas fa-calendar-day"></i> من تاريخ</label>
                            <input type="date" id="filter-date-from" />
                        </div>
                        <div class="gs-form-group">
                            <label for="filter-date-to">إلى تاريخ</label>
                            <input type="date" id="filter-date-to" />
                        </div>
                        <div class="gs-form-group">
                            <label for="filter-section">القسم</label>
                            <select id="filter-section">
                                <option value="">الكل</option>
                            </select>
                        </div>
                        <div class="gs-form-group">
                            <label for="filter-subject">المادة</label>
                            <select id="filter-subject">
                                <option value="">الكل</option>
                            </select>
                        </div>
                        <div class="gs-form-group">
                            <label for="filter-teacher">الأستاذ(ة)</label>
                            <select id="filter-teacher">
                                <option value="">الكل</option>
                            </select>
                        </div>
                        <div class="gs-form-group">
                            <label for="filter-status">الحالة</label>
                            <select id="filter-status">
                                <option value="">الكل</option>
                                <option value="pending" selected>في الانتظار</option>
                                <option value="done">تم التعويض</option>
                            </select>
                        </div>
                        <div class="gs-form-actions">
                            <button class="btn btn-primary" id="apply-filter-btn" type="button">
                                <i class="fas fa-search"></i> بحث
                            </button>
                            <button class="btn btn-success ux-print-preview-btn" id="print-btn" type="button">
                                <i class="fas fa-eye"></i> معاينة
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Stat Cards -->
                <div class="comp-stats no-print" id="stat-cards">
                    <div class="comp-stat-card">
                        <div
                            class="comp-stat-icon"
                            style="background: var(--color-danger-surface); color: var(--color-danger)"
                        >
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="comp-stat-body">
                            <h4 id="stat-total">0</h4>
                            <p>إجمالي الحصص الضائعة</p>
                        </div>
                    </div>
                    <div class="comp-stat-card">
                        <div
                            class="comp-stat-icon"
                            style="background: var(--color-warning-surface); color: var(--color-warning)"
                        >
                            <i class="fas fa-hourglass-half"></i>
                        </div>
                        <div class="comp-stat-body">
                            <h4 id="stat-pending">0</h4>
                            <p>في الانتظار</p>
                        </div>
                    </div>
                    <div class="comp-stat-card">
                        <div
                            class="comp-stat-icon"
                            style="background: var(--color-success-surface); color: var(--color-success)"
                        >
                            <i class="fas fa-check-double"></i>
                        </div>
                        <div class="comp-stat-body">
                            <h4 id="stat-done">0</h4>
                            <p>تم التعويض</p>
                        </div>
                    </div>
                    <div class="comp-stat-card">
                        <div
                            class="comp-stat-icon"
                            style="background: var(--color-warning-surface); color: var(--color-warning)"
                        >
                            <i class="fas fa-trophy"></i>
                        </div>
                        <div class="comp-stat-body" style="width: 100%">
                            <p style="margin-bottom: 8px; font-weight: 600; font-size: 13px">
                                الأساتذة الأكثر حصصا للتعويض
                            </p>
                            <div
                                id="top-teachers-list"
                                style="display: flex; flex-direction: column; gap: 6px; font-size: 12px"
                            >
                                <span style="color: var(--color-text-muted)">جارٍ التحميل...</span>
                            </div>
                        </div>
                    </div>
                    <div class="comp-stat-card">
                        <div
                            class="comp-stat-icon"
                            style="background: var(--color-info-surface); color: var(--color-info)"
                        >
                            <i class="fas fa-school"></i>
                        </div>
                        <div class="comp-stat-body" style="width: 100%">
                            <p style="margin-bottom: 8px; font-weight: 600; font-size: 13px">الأقسام الأكثر تضررا</p>
                            <div
                                id="top-sections-list"
                                style="display: flex; flex-direction: column; gap: 6px; font-size: 12px"
                            >
                                <span style="color: var(--color-text-muted)">جارٍ التحميل...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hidden date display for print preview header -->
                <span id="date-display" style="display: none"></span>

                <!-- Tracking Table — gs-preview-section style -->
                <div class="gs-preview-section">
                    <div class="gs-preview-header">
                        <h3 class="gs-preview-title">
                            <i class="fas fa-list-check"></i>
                            جدول تتبع الحصص التعويضية
                            <span class="gs-count-badge" id="table-count">0</span>
                        </h3>
                    </div>
                    <div class="gs-preview-body">
                        <table class="comp-table comp-table-card">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>التاريخ</th>
                                    <th>القسم</th>
                                    <th>الأستاذ(ة)</th>
                                    <th>المادة</th>
                                    <th>الحصة</th>
                                    <th>السبب</th>
                                    <th>الحالة</th>
                                    <th class="no-print" style="width: 120px">إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="tracking-tbody">
                                <tr class="empty-row">
                                    <td colspan="9">جارٍ التحميل...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <script src="js/pages/compensation-tracking.js" defer></script>
    </body>
</html>
