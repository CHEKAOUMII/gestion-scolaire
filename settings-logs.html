<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل النشاطات | برنامج التدبير المدرسي</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ux-enhancements.css">
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ux-enhancements.js"></script>
</head>

<body>
    <div class="toast-container" id="toast-container"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 class="page-title"><i class="fas fa-history"></i> سجل النشاطات</h2>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="grades-container">
            <div class="students-results">
                <div class="search-form">
                    <button class="btn btn-primary" id="refresh">تحديث</button>
                    <button class="btn btn-secondary" id="seed">إضافة سجل تجريبي</button>
                </div>
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>العملية</th>
                            <th>النوع</th>
                            <th>المعرف</th>
                            <th>التفاصيل</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadLogs();
            document.getElementById('refresh').addEventListener('click', loadLogs);
            document.getElementById('seed').addEventListener('click', seedLog);
        });

        async function seedLog() {
            await window.api.systemLogs.add({
                action: 'manual:test',
                details: 'seed log from settings-logs',
                entity_type: 'manual',
                entity_id: 'seed'
            });
            await loadLogs();
        }

        async function loadLogs() {
            const rows = await window.api.systemLogs.getAll(300) || [];
            document.getElementById('tbody').innerHTML = rows.length ? rows.map((r, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${r.action || '-'}</td>
                    <td>${r.entity_type || '-'}</td>
                    <td>${r.entity_id || '-'}</td>
                    <td>${r.details || '-'}</td>
                    <td>${r.created_at || '-'}</td>
                </tr>
            `).join('') : '<tr><td colspan="6" style="padding: 20px; text-align: center;">لا توجد سجلات</td></tr>';
        }
    </script>
</body>

</html>
